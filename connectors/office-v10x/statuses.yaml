unknown_message: สถานะนี้ยังไม่มีคำอธิบายในระบบ — เปิดรายการนั้นในหน้าจริงเพื่อตรวจ หรือติดต่อทีม support ในห้องแชทประจำของเว็บ
tables:
  withdraw:
    label: สถานะรายการถอน
    source: office-v10x src/services/helper-function.ts withdrawStatus · ปุ่มจาก src/components (ChangeStatus.vue) ตาม appendix-v10x §6.1
    questions: [BQ-29, BQ-03, BQ-04, BQ-06]
    entries:
      - {code: 1, label: สำเร็จ, aliases: [โอนแล้ว], meaning: โอนเงินให้สมาชิกเรียบร้อยแล้ว, next_action: ไม่ต้องทำอะไรต่อ, final: true}
      - {code: 2, label: เตรียมการโอนเงิน, aliases: [รอคิว], meaning: รายการอยู่ในคิวรอระบบโอน, next_action: รอระบบโอน ถ้าค้างนานผิดปกติ ผู้มีสิทธิ์กดปุ่มทำรายการอีกครั้งได้ที่หน้ารายการถอน}
      - {code: 3, label: รอตรวจสอบ, aliases: [กำลังรอตรวจสอบ, กำลังตรวจสอบ], meaning: รายการรอพนักงานตรวจสอบก่อนโอน, next_action: ผู้มีสิทธิ์ตรวจรายการผ่านปุ่มจัดการของแถวนั้นในหน้ารายการถอน}
      - {code: 4, label: ยกเลิก, meaning: รายการถอนถูกยกเลิกแล้ว, next_action: ไม่ต้องทำอะไรต่อ, final: true}
      - {code: 5, label: ทำรายการอีกครั้ง, meaning: สั่งให้ระบบโอนรายการนี้ใหม่แล้ว, next_action: รอระบบโอน ถ้ายังไม่สำเร็จให้ตรวจที่หน้ารายการถอน}
      - {code: 6, label: กำลังขอ OTP, meaning: ระบบกำลังขอรหัส OTP จากธนาคารเพื่อโอน, next_action: รอระบบ ถ้าค้างนานผู้มีสิทธิ์กดทำรายการอีกครั้งได้}
      - {code: 7, label: ขอ OTP สำเร็จ, meaning: ได้รับคำขอ OTP จากธนาคารแล้ว, next_action: รอระบบโอนต่อ ถ้าค้างนานผู้มีสิทธิ์กดทำรายการอีกครั้งได้}
      - {code: 8, label: ขอ OTP ไม่สำเร็จ, meaning: ขอรหัส OTP จากธนาคารไม่สำเร็จ, next_action: ผู้มีสิทธิ์กดทำรายการอีกครั้งที่หน้ารายการถอน}
      - {code: 9, label: ได้รับ OTP รอยืนยัน, meaning: ได้รหัส OTP แล้วแต่ยังไม่ได้ยืนยันการโอน, next_action: ผู้มีสิทธิ์ตรวจแล้วกดยืนยันที่หน้ารายการถอน}
      - {code: 10, label: OTP ไม่ถูกต้อง, meaning: รหัส OTP ที่ใช้โอนไม่ถูกต้อง, next_action: ผู้มีสิทธิ์กดทำรายการอีกครั้งที่หน้ารายการถอน}
      - {code: 11, label: ถูกซ่อน, meaning: รายการถูกซ่อนจากรายการค้างปกติ, next_action: ผู้มีสิทธิ์ตรวจแล้วกดยืนยันได้ที่หน้ารายการถอน}
      - {code: 12, label: ไม่สำเร็จ, aliases: [เกิดข้อผิดพลาด], meaning: ระบบโอนไม่สำเร็จ, next_action: ผู้มีสิทธิ์ดูหมายเหตุของรายการแล้วกดทำรายการอีกครั้งที่หน้ารายการถอน}
      - {code: 13, label: รบกวนตรวจสอบยอดที่ธนาคาร, aliases: [ตรวจสอบยอดที่ธนาคาร], meaning: ระบบไม่แน่ใจว่าโอนออกไปแล้วหรือยัง, next_action: ตรวจสเตทเม้นธนาคารก่อน ถ้าเงินออกแล้วผู้มีสิทธิ์จึงกดยืนยันเป็นสำเร็จ ห้ามทำรายการซ้ำก่อนตรวจ}
      - {code: 14, label: ตัดเครดิตไม่สำเร็จ, meaning: ระบบตัดเครดิตของสมาชิกไม่สำเร็จ, next_action: ยังไม่มีขั้นตอนที่ยืนยันในระบบ ให้ติดต่อทีม support ในห้องแชทประจำของเว็บ}
      - {code: 15, label: ส่งรายการถอนสำเร็จรอยืนยัน, meaning: ส่งรายการถอนออกไปแล้ว รอผลยืนยันกลับมา, next_action: รอระบบยืนยัน}
      - {code: 16, label: รอดำเนินการส่งรายการถอน, meaning: รายการรอส่งไปโอน, next_action: ผู้มีสิทธิ์ตรวจแล้วกดยืนยันได้ที่หน้ารายการถอน}
  deposit:
    label: สถานะรายการฝาก
    source: office-v10x src/views/transection/deposit/DepositTransection.vue (slot status)
    questions: [BQ-29, BQ-02, BQ-06]
    entries:
      - {code: 1, label: สำเร็จ, meaning: เติมเครดิตให้สมาชิกแล้ว, next_action: ไม่ต้องทำอะไรต่อ, final: true}
      - {code: 2, label: รอคิว, meaning: รายการฝากยังไม่ได้เติมเครดิต, next_action: ผู้มีสิทธิ์ตรวจที่หน้ารายการฝาก แล้วกดตกลงเพื่อเติมเครดิต หรือกดเพิ่มเครดิตไปแล้วถ้าเติมมือไปแล้ว}
      - {code: 5, label: ติดกิจกรรม, meaning: รายการฝากยังไม่ได้เติมเครดิตเพราะติดเงื่อนไขกิจกรรม, next_action: ผู้มีสิทธิ์ตรวจที่หน้ารายการฝาก แล้วกดตกลงหรือเพิ่มเครดิตไปแล้วตามกรณี}
      - {code: 6, label: เครดิตค้าง, meaning: สมาชิกยังมีเกมค้างอยู่ จึงยังเติมเครดิตไม่ได้, next_action: กดดูเกมค้างในหน้ารายการฝาก รอให้เกมจบก่อน}
      - {code: 0, label: ไม่สำเร็จ, meaning: รายการฝากไม่สำเร็จ (รวมรายการลบเครดิตที่ระบบบันทึกเป็นสถานะนี้), next_action: ผู้มีสิทธิ์ตรวจรายละเอียดที่หน้ารายการฝาก}
  member_active:
    label: สถานะบัญชีสมาชิก
    source: office-v10x src/views/member/MemberListView.vue (slot active · ค่า ไม่ต้องยืนยัน OTP หน้าจอเปลี่ยนเลขเพื่อเรียงเท่านั้น) · office-api-v10 controller/member.go (ตัดสมาชิกที่ลบออก)
    questions: [BQ-05, BQ-08]
    entries:
      - {code: 1, label: ยืนยันแล้ว, meaning: สมาชิกยืนยันตัวตนแล้ว, final: true}
      - {code: 0, label: ยังไม่ยืนยันตัวตน, meaning: สมาชิกยังไม่ได้ยืนยันตัวตนผ่านเบอร์หรือบัญชีธนาคาร, next_action: ตรวจที่หน้าข้อมูลสมาชิก}
      - {code: 2, label: ไม่ต้องยืนยัน OTP, meaning: บัญชีนี้ตั้งให้ไม่ต้องยืนยันด้วย OTP, final: true}
      - {code: 99, label: ปิดกั้นการใช้งาน, meaning: บัญชีสมาชิกถูกปิดกั้น, next_action: ดูเหตุผลที่หน้าข้อมูลสมาชิก หรือเมนูสมาชิก Block}
      - {code: 4, label: ลบแล้ว, meaning: บัญชีสมาชิกถูกลบ ไม่นับรวมในจำนวนสมาชิก, final: true}
  member_bank:
    label: สถานะบัญชีธนาคารของสมาชิก
    source: office-api-v10 controller/approveBank.go (status 0 รออนุมัติ / 1 SUCCESS / 2 UNSUCCESS) — ป้าย 1/2 อนุมานจากโค้ด backend
    questions: [BQ-05, BQ-09]
    entries:
      - {code: 0, label: รออนุมัติ, meaning: บัญชีธนาคารของสมาชิกรอพนักงานอนุมัติ, next_action: ผู้มีสิทธิ์อนุมัติที่เมนูอนุมัติบัญชีสมาชิก}
      - {code: 1, label: อนุมัติแล้ว, meaning: บัญชีธนาคารผ่านการอนุมัติแล้ว, final: true}
      - {code: 2, label: ไม่อนุมัติ, meaning: บัญชีธนาคารไม่ผ่านการอนุมัติ, final: true}
  bill:
    label: สถานะบิลค่าใช้จ่าย
    source: office-v10x src/components/bill/StatusBill.vue
    questions: [BQ-44, BQ-46, BQ-29]
    entries:
      - {code: 1, label: ฉบับร่าง, meaning: บิลยังไม่ออกให้ชำระ}
      - {code: 2, label: ยกเลิก, meaning: บิลถูกยกเลิก, final: true}
      - {code: 3, label: รอจ่าย, meaning: บิลออกแล้ว รอชำระ, next_action: ชำระตามรายละเอียดในเมนูบิลค่าใช้จ่าย}
      - {code: 4, label: จ่ายแล้ว - รอคอนเฟิร์ม, meaning: แจ้งชำระแล้ว รอทีมตรวจยืนยัน, next_action: รอทีมยืนยัน ถ้านานผิดปกติให้ติดต่อทีม support}
      - {code: 5, label: ค้างชำระ, meaning: เลยกำหนดชำระแล้วยังไม่ได้ชำระ, next_action: ชำระโดยเร็วตามรายละเอียดในเมนูบิลค่าใช้จ่าย}
      - {code: 6, label: สำเร็จ, meaning: ชำระและยืนยันแล้ว, final: true}
  member_topup:
    label: สถานะฝากเงินของสมาชิก
    source: office-v10x src/views/member/MemberListView.vue (slot topup_status · ค่าที่ไม่ใช่ศูนย์แสดงว่า ฝาก)
    questions: [BQ-05]
    entries:
      - {code: 0, label: ไม่ฝาก, meaning: สมาชิกยังไม่เคยฝากเงิน}
      - {code: 1, label: ฝาก, meaning: สมาชิกเคยฝากเงินแล้ว, final: true}
  bank_status:
    label: สถานะบัญชีธนาคารของเว็บ
    source: office-v10x src/views/statement/ManagebankView.vue (slot status แท็บจัดการบัญชีฝาก/ถอน)
    questions: [BQ-10]
    entries:
      - {code: 1, label: เปิดใช้งาน, meaning: บัญชีนี้เปิดใช้งานอยู่}
      - {code: 0, label: ปิดใช้งาน, meaning: บัญชีนี้ถูกปิดใช้งาน, next_action: ผู้มีสิทธิ์เปิดใช้งานได้ที่เมนูจัดการบัญชีธนาคาร}
  bank_show:
    label: การแสดงบัญชีธนาคารบนหน้าเว็บ
    source: office-v10x src/views/statement/ManagebankView.vue (slot is_show · ค่าอื่นที่ไม่ใช่หนึ่งแสดงว่า ไม่แสดง)
    questions: [BQ-10]
    entries:
      - {code: 1, label: แสดง, meaning: บัญชีนี้แสดงให้สมาชิกเห็นบนหน้าเว็บ}
      - {code: 0, label: ไม่แสดง, meaning: บัญชีนี้ไม่แสดงบนหน้าเว็บ}
  bonus_status:
    label: สถานะโบนัส/โปรโมชั่น
    source: office-v10x src/views/setting/BonusList.vue (slot status)
    questions: [BQ-11]
    entries:
      - {code: 1, label: เปิดใช้งาน, meaning: โปรโมชั่นนี้เปิดใช้งานอยู่}
      - {code: 0, label: ปิดใช้งาน, meaning: โปรโมชั่นนี้ปิดใช้งาน}
