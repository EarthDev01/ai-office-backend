# GET /api/GetWithdrawStatementv2/:service (controller/withdraw.go GetWithdrawStatementV2)
#   frontend: api-service/withdraw/index.ts getWithdrawStatementV2 · WithdrawTransection.vue (range_dt วัน 00:00:00~23:59:59 · sort=datetime · order · limit · page)
#   ไม่ส่ง id → บังคับ status ∉ {1 สำเร็จ, 4 ยกเลิก, 11 ถูกซ่อน} เสมอ (= รายการที่ยังไม่จบ) · username = regex (กรองตรงตัวใน values)
#   count = CountStatement (นับจริงทุกหน้า) · หลัง query มี enrich P2P ที่อ่าน Redis/PAYMENT_API แบบ read-through cache (ไม่เขียน DB)
# GET /api/GetWithdrawStatementHistory/:service (controller/withdraw.go GetWithdrawStatementHistory)
#   frontend: GetWithdrawStatementHistory (แท็บ ประวัติรายการถอน) · ไม่ส่ง withdraw_filter → status ∈ {1, 4, 11}
#   ค้นยูส: search=<ยูส> + username=username (selector แบบที่หน้าจอส่ง) → regex บน username
# GET /api/GetWithdrawStatementByID/:service?id= (controller/withdraw.go GetWithdrawStatementByID)
#   frontend: MemberWithdraw2.vue / P2PWithdrawModal.vue · data = withdraw_statement เต็ม รวม comment_time_lime[] (timeline)
#   ไม่พบ/รหัสผิด → code 1 "No Data Withdraw" / "Invalid withdrawal ID" → not_found_codes [1]
questions: [BQ-03, BQ-04, BQ-06]
tools:
  - name: withdraw_pending_by_status
    description: >-
      รายการถอนที่ยังไม่จบ (ไม่นับ สำเร็จ ยกเลิก ถูกซ่อน) แยกตามสถานะ พร้อมจำนวนและยอดรวมของแต่ละสถานะ
      · นับเฉพาะรายการที่สร้างในวันหรือช่วงวันที่ถาม (ไม่ระบุ = วันนี้) ถ้าถามรวมค้างจากวันก่อนให้ระบุช่วงวัน
    questions: [BQ-03]
    permission: withdraw
    freshness: summary
    input:
      date_from: {type: date, description: วันแรกของช่วง (ไม่ระบุ = วันนี้)}
      date_to: {type: date, description: วันสุดท้ายของช่วง รวมทั้งวัน (ไม่ระบุ = เท่ากับวันแรก)}
    calls:
      - id: p
        method: GET
        path: /GetWithdrawStatementv2/{service}
        query:
          range_dt: "{datetime:input.date_from|datetime:today}~{datetime_end:input.date_to|datetime_end:input.date_from|datetime_end:today}"
          sort: datetime
          order: "1"
          limit: "300"
          page: "1"
        envelope: raw
        cache_ttl: 60
        timeout_ms: 25000
        schema: &wlist
          type: object
          required: [code, data, count]
          properties:
            code: {type: integer}
            count: {type: integer}
            data:
              type: array
              nullable: true
              items:
                type: object
                required: [datetime, username, amount, status]
                properties:
                  id: {type: string}
                  datetime: {type: string}
                  update_time: {type: string}
                  username: {type: string}
                  amount: {type: number}
                  status: {type: integer}
                  channel: {type: string}
                  bank_code: {type: string}
                  acc_bank_code: {type: string}
                  operator_name: {type: string}
                  comment: {type: string}
    values:
      - {name: rows, from: p, path: data, group_by: status, field: amount, sort_by: count, order: desc}
      - {name: fetched_count, from: p, path: data, agg: count}
      - {name: total_count, from: p, path: count}
      - {name: fetched_amount, from: p, path: data, agg: sum, field: amount}
      - {name: oldest, from: p, path: data, agg: first, field: datetime}
      - {name: bank_check_count, from: p, path: data, filter: "item.status == 13", agg: count}
    not_found: {when: "total_count == 0", message: ไม่มีรายการถอนค้างในช่วงวันที่ถาม}
    card:
      title: รายการถอนที่ยังไม่สำเร็จ
      fields:
        - {label: รายการค้างทั้งหมด, value: total_count, format: int, suffix: " รายการ"}
        - {label: นับแยกสถานะจากรายการเก่าสุด, value: fetched_count, format: int, suffix: " รายการ", when: "total_count > fetched_count"}
        - {label: ยอดรวมของรายการที่นับ, value: fetched_amount, format: money, suffix: " บาท"}
        - {label: รายการเก่าสุดสร้างเมื่อ, value: oldest, format: datetime}
      table:
        rows: rows
        columns:
          - {label: สถานะ, field: key, format: "status:withdraw"}
          - {label: จำนวน, field: count, format: int, suffix: " รายการ"}
          - {label: ยอดรวม, field: sum, format: money}
      note: นับเฉพาะรายการถอนที่สร้างในช่วงวันที่ถามและยังไม่จบ (ไม่นับ สำเร็จ ยกเลิก ถูกซ่อน)
      link: {label: เปิดรายการถอน, path: /transection/withdraw}
    model_context:
      - {name: has_pending, type: bool, expr: "total_count > 0"}
      - {name: counted_partially, type: bool, expr: "total_count > fetched_count"}
      - {name: needs_bank_check, type: bool, expr: "bank_check_count > 0"}
      - {name: statuses, type: labels, from: rows, pluck: key, format: "status:withdraw"}

  - name: withdraw_pending_oldest
    description: >-
      รายการถอนที่ยังไม่จบ เรียงจากค้างนานสุด (ห้ารายการแรก) พร้อมยูส ยอด สถานะ ผู้ดำเนินการ
      · ใช้เมื่อถามว่าถอนค้างนานสุดคือรายการไหน · ไม่ระบุวัน = รายการที่สร้างวันนี้
    questions: [BQ-04]
    permission: withdraw
    freshness: summary
    input:
      date_from: {type: date, description: วันแรกของช่วง (ไม่ระบุ = วันนี้)}
      date_to: {type: date, description: วันสุดท้ายของช่วง รวมทั้งวัน (ไม่ระบุ = เท่ากับวันแรก)}
    calls:
      - id: o
        method: GET
        path: /GetWithdrawStatementv2/{service}
        query:
          range_dt: "{datetime:input.date_from|datetime:today}~{datetime_end:input.date_to|datetime_end:input.date_from|datetime_end:today}"
          sort: datetime
          order: "1"
          limit: "5"
          page: "1"
        envelope: raw
        cache_ttl: 60
        timeout_ms: 25000
        schema: *wlist
    values:
      - {name: rows, from: o, path: data}
      - {name: pending_total, from: o, path: count}
    not_found: {when: "empty(rows)", message: ไม่มีรายการถอนค้างในช่วงวันที่ถาม}
    card:
      title: รายการถอนที่ค้างนานสุด
      fields:
        - {label: รายการค้างทั้งหมด, value: pending_total, format: int, suffix: " รายการ"}
      table:
        rows: rows
        columns:
          - {label: วันที่, field: datetime, format: datetime}
          - {label: Username, field: username}
          - {label: ยอดถอน, field: amount, format: money}
          - {label: สถานะ, field: status, format: "status:withdraw"}
          - {label: ผู้ดำเนินการ, field: operator_name}
          - {label: หมายเหตุ, field: comment}
      link: {label: เปิดรายการถอน, path: /transection/withdraw}
    model_context:
      - {name: statuses, type: labels, from: rows, pluck: status, format: "status:withdraw"}

  - name: withdraw_find
    description: >-
      ค้นรายการถอนที่ยังไม่จบของยูสเซอร์เนม (ตรงตัว) ในวันหรือช่วงวันที่ถาม แสดงยอด สถานะ ผู้ดำเนินการ หมายเหตุ
      · ถ้าต้องการรายการที่จบแล้ว (สำเร็จ ยกเลิก ถูกซ่อน) ใช้ withdraw_history_find · ไม่ระบุวัน = วันนี้ · ไม่แสดง IP
    questions: [BQ-06]
    permission: withdraw
    freshness: summary
    input:
      username: {type: string, required: true, description: ยูสเซอร์เนมของสมาชิก ตรงตัว, pattern: "^[A-Za-z0-9_.@-]{2,50}$"}
      date_from: {type: date, description: วันแรกของช่วง (ไม่ระบุ = วันนี้)}
      date_to: {type: date, description: วันสุดท้ายของช่วง รวมทั้งวัน (ไม่ระบุ = เท่ากับวันแรก)}
    calls:
      - id: l
        method: GET
        path: /GetWithdrawStatementv2/{service}
        query:
          range_dt: "{datetime:input.date_from|datetime:today}~{datetime_end:input.date_to|datetime_end:input.date_from|datetime_end:today}"
          username: "{input.username}"
          sort: datetime
          order: "-1"
          limit: "20"
          page: "1"
        envelope: raw
        timeout_ms: 25000
        schema: *wlist
    values:
      - {name: rows, from: l, path: data, filter: "lower(item.username) == lower(input.username)"}
      - {name: match_count, expr: "len(rows)"}
    not_found: {when: "empty(rows)", message: ไม่พบรายการถอนที่ยังไม่จบของยูสเซอร์เนมนี้ในช่วงวันที่ถาม}
    card:
      title: รายการถอนที่ยังไม่จบของสมาชิก
      fields:
        - {label: พบ, value: match_count, format: int, suffix: " รายการ"}
      table:
        rows: rows
        max_rows: 20
        columns: &wcols
          - {label: วันที่, field: datetime, format: datetime}
          - {label: Username, field: username}
          - {label: ยอดถอน, field: amount, format: money}
          - {label: สถานะ, field: status, format: "status:withdraw"}
          - {label: ธนาคาร, field: bank_code}
          - {label: ผู้ดำเนินการ, field: operator_name}
          - {label: หมายเหตุ, field: comment}
          - {label: รหัสรายการ, field: id}
      link: {label: เปิดรายการถอน, path: /transection/withdraw}
    model_context:
      - {name: statuses, type: labels, from: rows, pluck: status, format: "status:withdraw"}

  - name: withdraw_history_find
    description: >-
      ค้นรายการถอนที่จบแล้ว (สำเร็จ ยกเลิก ถูกซ่อน) ของยูสเซอร์เนม (ตรงตัว) ในวันหรือช่วงวันที่ถาม เรียงใหม่ไปเก่า
      แสดงยอด สถานะ ผู้ดำเนินการ หมายเหตุ · ไม่ระบุวัน = วันนี้ · ไม่แสดง IP
    questions: [BQ-06]
    permission: withdraw
    freshness: summary
    input:
      username: {type: string, required: true, description: ยูสเซอร์เนมของสมาชิก ตรงตัว, pattern: "^[A-Za-z0-9_.@-]{2,50}$"}
      date_from: {type: date, description: วันแรกของช่วง (ไม่ระบุ = วันนี้)}
      date_to: {type: date, description: วันสุดท้ายของช่วง รวมทั้งวัน (ไม่ระบุ = เท่ากับวันแรก)}
    calls:
      - id: h
        method: GET
        path: /GetWithdrawStatementHistory/{service}
        query:
          range_dt: "{datetime:input.date_from|datetime:today}~{datetime_end:input.date_to|datetime_end:input.date_from|datetime_end:today}"
          search: "{input.username}"
          username: username
          sort: datetime
          order: "-1"
          limit: "20"
          page: "1"
        envelope: raw
        timeout_ms: 25000
        schema: *wlist
    values:
      - {name: rows, from: h, path: data, filter: "lower(item.username) == lower(input.username)"}
      - {name: match_count, expr: "len(rows)"}
    not_found: {when: "empty(rows)", message: ไม่พบรายการถอนที่จบแล้วของยูสเซอร์เนมนี้ในช่วงวันที่ถาม}
    card:
      title: ประวัติรายการถอนของสมาชิก
      fields:
        - {label: พบ, value: match_count, format: int, suffix: " รายการ"}
      table:
        rows: rows
        max_rows: 20
        columns: *wcols
      link: {label: เปิดรายการถอน, path: /transection/withdraw}
    model_context:
      - {name: statuses, type: labels, from: rows, pluck: status, format: "status:withdraw"}

  - name: withdraw_by_id
    description: รายละเอียดรายการถอน 1 รายการตามรหัสรายการ (ObjectID) พร้อมลำดับการเปลี่ยนสถานะและผู้ดำเนินการแต่ละขั้น
    questions: [BQ-06]
    permission: withdraw
    freshness: summary
    input:
      id: {type: string, required: true, description: รหัสรายการถอน (ObjectID), pattern: "^[0-9a-fA-F]{24}$"}
    calls:
      - id: w
        method: GET
        path: /GetWithdrawStatementByID/{service}
        query: {id: "{input.id}"}
        timeout_ms: 15000
        not_found_codes: [1]
        schema:
          type: object
          required: [datetime, username, amount, status]
          properties:
            datetime: {type: string}
            update_time: {type: string}
            username: {type: string}
            amount: {type: number}
            status: {type: integer}
            channel: {type: string}
            operator_name: {type: string}
            comment: {type: string}
            bank_code: {type: string}
            acc_bank_code: {type: string}
            comment_time_lime:
              type: array
              nullable: true
              items:
                type: object
                required: [status]
                properties:
                  datetime: {type: string}
                  status: {type: integer}
                  action: {type: string}
                  comment: {type: string}
                  operator_name: {type: string}
    values:
      - {name: dt, from: w, path: datetime}
      - {name: user, from: w, path: username}
      - {name: amt, from: w, path: amount}
      - {name: st, from: w, path: status}
      - {name: chan, from: w, path: channel}
      - {name: op, from: w, path: operator_name}
      - {name: cmt, from: w, path: comment}
      - {name: bank, from: w, path: bank_code}
      - {name: web_bank, from: w, path: acc_bank_code}
      - {name: steps, from: w, path: comment_time_lime, default: []}
    card:
      title: รายละเอียดรายการถอน
      fields:
        - {label: วันที่, value: dt, format: datetime}
        - {label: Username, value: user}
        - {label: ยอดถอน, value: amt, format: money, suffix: " บาท"}
        - {label: สถานะ, value: st, format: "status:withdraw"}
        - {label: ช่องทาง, value: chan, when: "!empty(chan)"}
        - {label: ธนาคารสมาชิก, value: bank, when: "!empty(bank)"}
        - {label: บัญชีถอนของเว็บ, value: web_bank, when: "!empty(web_bank)"}
        - {label: ผู้ดำเนินการล่าสุด, value: op, when: "!empty(op)"}
        - {label: หมายเหตุ, value: cmt, when: "!empty(cmt)"}
      table:
        rows: steps
        max_rows: 100
        columns:
          - {label: เวลา, field: datetime, format: datetime}
          - {label: สถานะ, field: status, format: "status:withdraw"}
          - {label: การดำเนินการ, field: action}
          - {label: ผู้ดำเนินการ, field: operator_name}
          - {label: หมายเหตุ, field: comment}
      link: {label: เปิดรายการถอน, path: /transection/withdraw}
    model_context:
      - {name: is_success, type: bool, expr: "st == 1"}
      - {name: is_cancelled, type: bool, expr: "st == 4"}
      - {name: needs_bank_check, type: bool, expr: "st == 13"}
      - {name: timeline_statuses, type: labels, from: steps, pluck: status, format: "status:withdraw"}
