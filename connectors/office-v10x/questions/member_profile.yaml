# ข้อมูลรายยูสจากหน้า "ข้อมูลสมาชิก" (office-v10x src/views/member/_id.vue + แท็บ src/components/member/history/*)
# ทุก call = endpoint อ่านอย่างเดียวที่หน้านั้นเรียกอยู่แล้ว (office-api-v10 e7babdd4 · ตรวจ 08/10/2026)
# สิทธิ์: หน้า _id.vue กั้นด้วย MEMBER_INFO (+ แต่ละแท็บมี code ย่อย MEMBER_HISTORY_*) — permissions.yaml ยังไม่มี rule ของแท็บย่อย
#   → ใช้ rule `member` (MEMBER_INFO) ซึ่งใกล้ที่สุด · office-api-v10 เส้นเหล่านี้ไม่ตรวจ code เอง (AuthRequiredDB อย่างเดียว)
# PII: ไม่ประกาศ/ไม่ใช้ password · phone_number · bank_number · full_name · ยูสของเพื่อน (downline) — values เลือกเฉพาะ field ที่ประกาศ
# ⚠️ ไม่ใช้ POST /member-transection-game-detail (member.go:70) — เป็นรายละเอียดของรอบเดียว (ต้องมี id/round_id/transaction_id จากตาราง)
#    ไม่ใช่ยอดรวม · ยอดเล่น/แพ้ชนะของแท็บ "รายการเล่น" มาจาก POST /member-transection-gamev2 (member.go:64) แทน
# ⚠️ ไม่ใช้ POST /member-turnover — ไม่ได้อยู่ในรอบนี้ · ไม่ใช้ GET /GetDepositStatementv2 กับ username (panic · ดู deposit.yaml)
questions: [BQ-05, BQ-06]
keywords: [ยูส, สมาชิก, ตลอดชีพ, ทั้งหมด, กำไร, เล่น, ยอดเล่น, แพ้ชนะ, แพ้, ชนะ, คืนยอดเสีย, ยอดเสีย, cashback, คอม, คอมมิชชั่น, แนะนำ, เพื่อน, ค่าแนะนำ, กิจกรรม, ค้างชำระ, ยอดค้าง, ฝาก, ถอน, 6 เดือน, หกเดือน]   # คัด tool ก่อนส่งให้โมเดล (ไม่ตรงหมวดไหนเลย = ส่งทุก tool)
tools:
  # GET /api/GetMemberAlltimebyUser/:service?username (route/member.go:31 · controller/member.go:1563-1597 GetMemberAlltimebyUser)
  #   frontend: api-service/report/index.ts getMemberAlltimebyUser · _id.vue getReportSummary (ป้าย ยอดฝาก/ยอดถอน/กำไรตลอดชีพ)
  #   aggregate report_active_user_day {username ตรงตัว} → data {deposit, withdraw, profit = deposit - withdraw} · ไม่พบ = ศูนย์ทั้งหมด (code 0)
  - name: member_alltime
    description: >-
      ยอดฝาก ยอดถอน และกำไร (ฝากลบถอน) ตลอดชีพของสมาชิก 1 ยูส เหมือนป้าย ตลอดชีพ ในหน้าข้อมูลสมาชิก
      · ใช้เมื่อถามว่ายูสนี้ฝาก/ถอนทั้งหมดเท่าไหร่ ตั้งแต่สมัคร · กำไรยังไม่หักโบนัส · ระบุช่วงวันไม่ได้ (ช่วงวันใช้ member_summary_range)
    questions: [BQ-05]
    permission: member   # _id.vue MEMBER_INFO (ป้ายบนหัวหน้าข้อมูลสมาชิก)
    freshness: summary
    answer: "ยอดฝาก ยอดถอน และกำไรตลอดชีพของยูส {input.username} แสดงในการ์ดแล้ว"
    input:
      username: {type: string, required: true, description: ยูสเซอร์เนมของสมาชิก ตรงตัว, pattern: "^[A-Za-z0-9_.@-]{2,50}$"}
    calls:
      - id: a
        method: GET
        path: /GetMemberAlltimebyUser/{service}
        query: {username: "{input.username}"}
        cache_ttl: 30
        timeout_ms: 20000
        schema:
          type: object
          required: [deposit, withdraw, profit]
          properties:
            deposit: {type: number}
            withdraw: {type: number}
            profit: {type: number}
    values:
      - {name: dep, from: a, path: deposit}
      - {name: wd, from: a, path: withdraw}
      - {name: profit, from: a, path: profit}
    not_found: {when: "dep == 0 && wd == 0", message: ไม่พบยอดฝากหรือถอนของยูสนี้ (ยูสอาจยังไม่เคยฝากถอน หรือพิมพ์ยูสไม่ตรงตัว)}
    card:
      style: stat
      title: ยอดตลอดชีพของสมาชิก
      fields:
        - {label: ยอดฝากตลอดชีพ, value: dep, format: money, suffix: " บาท"}
        - {label: ยอดถอนตลอดชีพ, value: wd, format: money, suffix: " บาท"}
        - {label: กำไรตลอดชีพ (ฝากลบถอน), value: profit, format: money, suffix: " บาท"}
      note: นับจากรายงานรายวันของระบบ (ตัวเดียวกับป้าย ตลอดชีพ ในหน้าข้อมูลสมาชิก) · ยังไม่หักโบนัส
      link: {label: เปิดข้อมูลสมาชิก, path: "/member/{input.username}"}
    model_context:
      - {name: member_profitable_for_web, type: bool, expr: "profit > 0"}
      - {name: has_withdraw, type: bool, expr: "wd > 0"}
    follow_ups:
      - {label: "ยอด 6 เดือนของ {input.username}", ask: "ยูส {input.username} ช่วง 6 เดือนล่าสุดฝากถอนเท่าไหร่"}
      - {label: "รายการเล่นของ {input.username}", ask: "ยูส {input.username} วันนี้เล่นไปเท่าไหร่ แพ้ชนะเท่าไหร่"}
      - {label: "คืนยอดเสีย/คอมของ {input.username}", ask: "ยูส {input.username} มียอดคืนยอดเสียและค่าคอมสะสมเท่าไหร่"}

  # GET /api/user-summaryv2/:service?start_date&end_date&username (route/member.go:32 · controller/member.go:1600-1641 MemberSummaryV2)
  #   frontend: getReportUserSummaryv2 · _id.vue getReportSummary ส่ง start_date = วันนี้ลบ 6 เดือน · end_date = วันนี้ (YYYY-MM-DD)
  #   report_active_user_day {username, date $gte start $lte end (string)} → data {deposit, withdraw, profit} · ไม่พบ = ศูนย์
  - name: member_summary_range
    description: >-
      ยอดฝาก ยอดถอน และกำไร (ฝากลบถอน) ของสมาชิก 1 ยูส ในช่วงวันที่ถาม
      · ใช้เมื่อถามว่ายูสนี้ช่วงนี้/เดือนนี้/6 เดือนฝากถอนเท่าไหร่ · ไม่ระบุวัน = ประมาณ 6 เดือนล่าสุด (เหมือนป้าย 6 เดือน ในหน้าข้อมูลสมาชิก)
    questions: [BQ-05]
    permission: member   # _id.vue MEMBER_INFO (ป้าย 6 เดือน)
    freshness: summary
    answer: "ยอดฝาก ยอดถอน และกำไรของยูส {input.username} ในช่วงที่ถามแสดงในการ์ดแล้ว"
    input:
      username: {type: string, required: true, description: ยูสเซอร์เนมของสมาชิก ตรงตัว, pattern: "^[A-Za-z0-9_.@-]{2,50}$"}
      date_from: {type: date, description: วันแรกของช่วง (ไม่ระบุ = ย้อนหลังประมาณ 6 เดือน)}
      date_to: {type: date, description: วันสุดท้ายของช่วง รวมทั้งวัน (ไม่ระบุ = วันนี้)}
    calls:
      - id: s
        method: GET
        path: /user-summaryv2/{service}
        query:
          start_date: "{date:input.date_from|date:today-182}"
          end_date: "{date:input.date_to|date:today}"
          username: "{input.username}"
        cache_ttl: 30
        timeout_ms: 20000
        schema:
          type: object
          required: [deposit, withdraw, profit]
          properties:
            deposit: {type: number}
            withdraw: {type: number}
            profit: {type: number}
    values:
      - {name: dep, from: s, path: deposit}
      - {name: wd, from: s, path: withdraw}
      - {name: profit, from: s, path: profit}
    not_found: {when: "dep == 0 && wd == 0", message: ไม่พบยอดฝากหรือถอนของยูสนี้ในช่วงวันที่ถาม}
    card:
      style: stat
      title: ยอดฝากถอนของสมาชิกตามช่วงวัน
      fields:
        - {label: ยอดฝาก, value: dep, format: money, suffix: " บาท"}
        - {label: ยอดถอน, value: wd, format: money, suffix: " บาท"}
        - {label: กำไร (ฝากลบถอน), value: profit, format: money, suffix: " บาท"}
      note: นับจากรายงานรายวันของระบบ ตามช่วงวันที่ถาม (ไม่ระบุ = ย้อนหลังประมาณหกเดือน) · ยังไม่หักโบนัส
      link: {label: เปิดข้อมูลสมาชิก, path: "/member/{input.username}"}
    model_context:
      - {name: member_profitable_for_web, type: bool, expr: "profit > 0"}
      - {name: has_withdraw, type: bool, expr: "wd > 0"}
    follow_ups:
      - {label: "ยอดตลอดชีพของ {input.username}", ask: "ยูส {input.username} ฝากถอนตลอดชีพเท่าไหร่"}
      - {label: "รายการฝากทุกสถานะของ {input.username}", ask: "รายการฝากทุกสถานะของยูส {input.username}"}

  # GET /api/GetDepositStatement/:service (route/deposit.go:17 · controller/deposit.go:45-100 GetDepositStatement)
  #   frontend: api-service/deposit/index.ts getDepositStatement · history/HistoryDeposit.vue (แท็บ ฝาก · MEMBER_HISTORY_DEPOSIT)
  #   query: username (FilterField = ตรงตัว) · range_dt=YYYY-MM-DD HH:mm:ss~... · sort · order · limit · page · status (เท่ากับ)
  #   response ResponseV2 {code, data[] DepositStatement, count, summary = ผลรวม amount ทุกแถวที่ตรง (ทุกสถานะ · deposit.go:85-99)}
  #   ⚠️ DB error → code 0 + data [] + count 0 (ไม่มี summary) = เห็นเป็น "ไม่พบ" · ใช้ v1 เพราะมี $and (v2 + username panic)
  - name: member_deposits
    description: >-
      รายการฝากของสมาชิก 1 ยูส ทุกสถานะ ในช่วงวันที่ถาม (ล่าสุดก่อน) พร้อมยอดฝากสำเร็จ จำนวนรายการ และยอดรวมทุกสถานะ
      · ใช้เมื่อถามว่ายูสนี้เดือนนี้/ช่วงนี้ฝากอะไรบ้าง ฝากกี่ครั้ง · ไม่ระบุวัน = ตั้งแต่สมัคร
    questions: [BQ-06]
    permission: member   # แท็บ ฝาก ในหน้าข้อมูลสมาชิก (MEMBER_INFO + MEMBER_HISTORY_DEPOSIT · ยังไม่มี rule แท็บย่อย)
    freshness: summary
    answer: "รายการฝากของยูส {input.username} แสดงในการ์ดแล้ว"
    input:
      username: {type: string, required: true, description: ยูสเซอร์เนมของสมาชิก ตรงตัว, pattern: "^[A-Za-z0-9_.@-]{2,50}$"}
      date_from: {type: date, description: วันแรกของช่วง (ไม่ระบุ = ตั้งแต่สมัคร)}
      date_to: {type: date, description: วันสุดท้ายของช่วง รวมทั้งวัน (ไม่ระบุ = วันนี้)}
    calls:
      - id: l
        method: GET
        path: /GetDepositStatement/{service}
        query: &dq
          username: "{input.username}"
          range_dt: "{datetime:input.date_from|datetime:beginning}~{datetime_end:input.date_to|datetime_end:today}"
          sort: datetime
          order: "-1"
          limit: "50"
          page: "1"
        envelope: raw
        cache_ttl: 30
        timeout_ms: 25000
        schema: &dsch
          type: object
          required: [code, data]
          properties:
            code: {type: integer}
            count: {type: integer}
            summary: {type: number}
            data:
              type: array
              items:
                type: object
                required: [amount, datetime, status]
                properties:
                  amount: {type: number}
                  datetime: {type: string}
                  status: {type: integer}
                  channel: {type: string}
                  bonus_name: {type: string}
                  bonus: {type: number}
                  operator_name: {type: string}
      - id: ok
        method: GET
        path: /GetDepositStatement/{service}
        query:
          <<: *dq
          status: "1"
          limit: "1"
        envelope: raw
        cache_ttl: 30
        timeout_ms: 25000
        schema: *dsch
    values:
      - {name: rows, from: l, path: data}
      - {name: all_count, from: l, path: count, default: 0}
      - {name: all_sum, from: l, path: summary, default: 0}
      - {name: fetched, from: l, path: data, agg: count}
      - {name: ok_count, from: ok, path: count, default: 0}
      - {name: ok_sum, from: ok, path: summary, default: 0}
    not_found: {when: "empty(rows)", message: ไม่พบรายการฝากของยูสนี้ในช่วงวันที่ถาม (ยูสต้องพิมพ์ตรงตัว)}
    card:
      style: list
      title: รายการฝากของสมาชิก
      fields:
        - {label: ยอดฝากสำเร็จ, value: ok_sum, format: money, suffix: " บาท"}
        - {label: ฝากสำเร็จ, value: ok_count, format: int, suffix: " รายการ"}
        - {label: รายการทั้งหมด (ทุกสถานะ), value: all_count, format: int, suffix: " รายการ"}
        - {label: ยอดรวมทุกสถานะ, value: all_sum, format: money, suffix: " บาท", when: "all_count > ok_count"}
      table:
        rows: rows
        max_rows: 20
        columns:
          - {label: วันที่, field: datetime, format: datetime}
          - {label: ยอดฝาก, field: amount, format: money}
          - {label: สถานะ, field: status, format: "status:deposit"}
          - {label: ช่องทาง, field: channel}
          - {label: โบนัส, field: bonus_name, empty: ไม่รับโบนัส}
          - {label: ผู้ดำเนินการ, field: operator_name, empty: ระบบอัตโนมัติ}
      note: แสดงสูงสุดยี่สิบรายการล่าสุด ยอดและจำนวนด้านบนนับทั้งช่วง ดูทั้งหมดได้ที่แท็บ ฝาก ในหน้าข้อมูลสมาชิก
      link: {label: เปิดข้อมูลสมาชิก, path: "/member/{input.username}"}
    model_context:
      - {name: statuses, type: labels, from: rows, pluck: status, format: "status:deposit"}
      - {name: has_unsuccessful, type: bool, expr: "all_count > ok_count"}
      - {name: may_have_more, type: bool, expr: "all_count > fetched"}
    follow_ups:
      - {label: "รายการถอนทุกสถานะของ {input.username}", ask: "รายการถอนทุกสถานะของยูส {input.username}"}
      - {label: "ยอดตลอดชีพของ {input.username}", ask: "ยูส {input.username} ฝากถอนตลอดชีพเท่าไหร่"}

  # GET /api/GetWithdrawStatement/:service (route/withdraw.go:17 · controller/withdraw.go:37-79 GetWithdrawStatement)
  #   frontend: api-service/withdraw/index.ts getWithdrawStatement · history/HistoryWithdraw.vue (แท็บ ถอน · MEMBER_HISTORY_WITHDRAW)
