  # POST /api/member-transection-gamev2/:service (route/member.go:64 · controller/member.go:3597-3801 GetMemberTransectionGameV2)
  #   frontend: memberTransectionGameV2 · history/HistoryPlaylist.vue getDataGame (แท็บ รายการเล่น · MEMBER_HISTORY_GAME)
  #   body {username, start_date/end_date "YYYY-MM-DD HH:mm:ss", page, limit, order, game_type "ALL"} → ยิง GET {APIURL}/seamless/transaction ของระบบเกม
  #   อ่านอย่างเดียว (ไม่เขียน DB) · มี rate limit ต่อพนักงาน 300 ครั้ง/60 วิ (นับใน Redis ใช้โควตาเดียวกับหน้าจอ)
  #   response {code, data {SummaryAmountData {BetAmount, RefundAmount, WinAmount, WinlossAmount}, TransactionData[]}, count = paginate.total}
  #   ป้ายในหน้า: ยอดเล่น = BetAmount · แพ้ / ชนะ = WinlossAmount (HistoryPlaylist.vue:2163-2164)
  #   ⚠️ ไม่ใช้ /member-transection-game-detail (route member.go:70 · controller 4120) — POST ไปที่ /getdetail ของระบบเกมเพื่อดูรอบเดียว ต้องมี id รอบจากตาราง
  - name: member_games
    description: >-
      ยอดเล่นและยอดแพ้ชนะของสมาชิก 1 ยูส ในวันหรือช่วงวันที่ถาม (ทุกประเภทเกม จากระบบเกม เหมือนป้ายในแท็บ รายการเล่น)
      · ใช้เมื่อถามว่ายูสนี้เล่นไปเท่าไหร่ แพ้ชนะเท่าไหร่ · ไม่ระบุวัน = วันนี้ · ช่วงยาวมากอาจช้า
    questions: [BQ-05]
    permission: member   # แท็บ รายการเล่น ในหน้าข้อมูลสมาชิก (MEMBER_INFO + MEMBER_HISTORY_GAME · ยังไม่มี rule แท็บย่อย)
    freshness: summary
    answer: "ยอดเล่นและแพ้ชนะของยูส {input.username} แสดงในการ์ดแล้ว"
    input:
      username: {type: string, required: true, description: ยูสเซอร์เนมของสมาชิก ตรงตัว, pattern: "^[A-Za-z0-9_.@-]{2,50}$"}
      date_from: {type: date, description: วันแรกของช่วง (ไม่ระบุ = วันนี้)}
      date_to: {type: date, description: วันสุดท้ายของช่วง รวมทั้งวัน (ไม่ระบุ = เท่ากับวันแรก)}
    calls:
      - id: g
        method: POST
        path: /member-transection-gamev2/{service}
        body:
          username: "{input.username}"
          start_date: "{datetime:input.date_from|datetime:today}"
          end_date: "{datetime_end:input.date_to|datetime_end:input.date_from|datetime_end:today}"
          page: 1
          limit: 1
          order: "-1"
          game_type: ALL
        envelope: raw
        cache_ttl: 30
        timeout_ms: 25000
        schema:
          type: object
          required: [code, data]
          properties:
            code: {type: integer}
            count: {type: integer}
            data:
              type: object
              required: [SummaryAmountData]
              properties:
                SummaryAmountData:
                  type: object
                  required: [BetAmount, WinlossAmount]
                  properties:
                    BetAmount: {type: number}
                    WinlossAmount: {type: number}
    values:
      - {name: bet, from: g, path: data.SummaryAmountData.BetAmount, default: 0}
      - {name: winloss, from: g, path: data.SummaryAmountData.WinlossAmount, default: 0}
      - {name: tx_count, from: g, path: count, default: 0}
    not_found: {when: "tx_count == 0 && bet == 0", message: ไม่พบรายการเล่นของยูสนี้ในช่วงวันที่ถาม}
    card:
      style: stat
      title: ยอดเล่นของสมาชิก
      fields:
        - {label: ยอดเล่น, value: bet, format: money, suffix: " บาท"}
        - {label: แพ้ / ชนะ, value: winloss, format: money, suffix: " บาท"}
        - {label: จำนวนรายการเล่น, value: tx_count, format: int, suffix: " รายการ"}
      note: ตัวเลขจากระบบเกมตามช่วงวันที่ถาม ทุกประเภทเกม (ค่าแพ้ / ชนะ แสดงตามที่ระบบเกมส่งมา เหมือนป้ายในแท็บ รายการเล่น)
      link: {label: เปิดข้อมูลสมาชิก, path: "/member/{input.username}"}
    model_context:
      - {name: has_play, type: bool, expr: "bet > 0"}
    follow_ups:
      - {label: "คืนยอดเสีย/คอมของ {input.username}", ask: "ยูส {input.username} มียอดคืนยอดเสียและค่าคอมสะสมเท่าไหร่"}
      - {label: "ยอดตลอดชีพของ {input.username}", ask: "ยูส {input.username} ฝากถอนตลอดชีพเท่าไหร่"}

