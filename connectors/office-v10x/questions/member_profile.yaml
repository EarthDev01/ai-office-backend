      link: {label: เปิดข้อมูลสมาชิก, path: "/member/{input.username}"}
    model_context:
      - {name: may_have_more, type: bool, expr: "server_count > fetched"}
    follow_ups:
      - {label: "แนะนำเพื่อนของ {input.username}", ask: "ยูส {input.username} มีเพื่อนกี่คน ได้ค่าแนะนำเท่าไหร่"}
      - {label: "รายการเล่นของ {input.username}", ask: "ยูส {input.username} วันนี้เล่นไปเท่าไหร่ แพ้ชนะเท่าไหร่"}

  # GET /api/member-overdue-list/:service (route/member.go:59 · controller/member.go:3500-3514 GetMemberOverDueList)
  #   frontend: members/index.ts getMemberOverdueList · history/HistoryOverdue.vue (แท็บ ยอดค้างชำระ · MEMBER_HISTORY_OVERDUE)
  #   member_overdue {username ตรงตัว, range_dt, ...} → data[] MemberOverdue {datetime, amount, balance (คงเหลือหลังรายการ), type_action add|delete, operator_name, comment, is_check}
  #   ยอดค้างปัจจุบัน = balance ของแถว is_check=1 (SaveMemberOverDue member.go:3453 ตั้งแถวใหม่ is_check=1 และล้างแถวเก่าเป็น 0)
  - name: member_overdue
    description: >-
      ยอดค้างชำระของสมาชิก 1 ยูส: ยอดค้างคงเหลือตอนนี้ และประวัติการเพิ่ม/ลดยอดค้างในช่วงวันที่ถาม
      · ใช้เมื่อถามว่ายูสนี้มียอดค้างไหม ค้างเท่าไหร่ · ไม่ระบุวัน = ประวัติตั้งแต่สมัคร
    questions: [BQ-05]
    permission: member   # แท็บ ยอดค้างชำระ ในหน้าข้อมูลสมาชิก (MEMBER_INFO + MEMBER_HISTORY_OVERDUE · ยังไม่มี rule แท็บย่อย)
    freshness: summary
    answer: "ยอดค้างชำระของยูส {input.username} แสดงในการ์ดแล้ว"
    input:
      username: {type: string, required: true, description: ยูสเซอร์เนมของสมาชิก ตรงตัว, pattern: "^[A-Za-z0-9_.@-]{2,50}$"}
      date_from: {type: date, description: วันแรกของประวัติ (ไม่ระบุ = ตั้งแต่สมัคร)}
      date_to: {type: date, description: วันสุดท้ายของประวัติ รวมทั้งวัน (ไม่ระบุ = วันนี้)}
    calls:
      - id: cur
        method: GET
        path: /member-overdue-list/{service}
        query:
          username: "{input.username}"
          is_check: "1"
          sort: datetime
          order: "-1"
          limit: "1"
          page: "1"
        cache_ttl: 30
        timeout_ms: 15000
        schema: &osch
          type: array
          nullable: true
          items:
            type: object
            required: [datetime, amount, balance]
            properties:
              datetime: {type: string}
              amount: {type: number}
              balance: {type: number}
              type_action: {type: string}
              operator_name: {type: string}
      - id: h
        method: GET
        path: /member-overdue-list/{service}
        query:
          username: "{input.username}"
          range_dt: "{datetime:input.date_from|datetime:beginning}~{datetime_end:input.date_to|datetime_end:today}"
          sort: datetime
          order: "-1"
          limit: "50"
          page: "1"
        cache_ttl: 30
        timeout_ms: 15000
        schema: *osch
    values:
      - {name: balance, from: cur, path: "", agg: first, field: balance, default: 0}
      - {name: rows, from: h, path: ""}
      - {name: history_count, expr: "len(rows)"}
    not_found: {when: "balance == 0 && empty(rows)", message: ยูสนี้ไม่มียอดค้างชำระ และไม่มีประวัติยอดค้างในช่วงวันที่ถาม}
    card:
      style: list
      title: ยอดค้างชำระของสมาชิก
      fields:
        - {label: ยอดค้างคงเหลือ, value: balance, format: money, suffix: " บาท"}
        - {label: ประวัติในช่วงที่ถาม, value: history_count, format: int, suffix: " รายการ"}
      table:
        rows: rows
        max_rows: 20
        columns:
          - {label: วันที่, field: datetime, format: datetime}
          - {label: จำนวน, field: amount, format: money}
          - {label: คงเหลือ, field: balance, format: money}
          - {label: ประเภท (add เพิ่ม / delete ลด), field: type_action}
          - {label: แก้ไขโดย, field: operator_name, empty: "—"}
      note: ยอดค้างคงเหลือคือยอดหลังรายการล่าสุด · ไม่แสดงรายละเอียดที่พนักงานพิมพ์ ดูได้ที่แท็บ ยอดค้างชำระ ในหน้าข้อมูลสมาชิก
      link: {label: เปิดข้อมูลสมาชิก, path: "/member/{input.username}"}
    model_context:
      - {name: has_overdue, type: bool, expr: "balance > 0"}
    follow_ups:
      - {label: "ยอดตลอดชีพของ {input.username}", ask: "ยูส {input.username} ฝากถอนตลอดชีพเท่าไหร่"}
      - {label: "รายการถอนทุกสถานะของ {input.username}", ask: "รายการถอนทุกสถานะของยูส {input.username}"}
