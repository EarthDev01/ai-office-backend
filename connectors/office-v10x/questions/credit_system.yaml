# GET /api/credit-agent-balance/:service (route/Agent.go · controller/Agent.go GetBalanceAgent)
#   frontend: api-service/config/index.ts getCreditAgent · Navbar2.vue "เครดิตเอเจ้นคงเหลือ" (ทุกคนที่ล็อกอินเห็น)
#   data BalanceAgentCredit {amount, code, name, unit, updated_at (unix วินาที), service} จาก OFFICE balance_credit_agent (snapshot เอกสารเดียวต่อเว็บ)
#   ไม่มีเอกสาร/DB error → code 1 → ถือเป็น "ไม่พบ"
#   ⚠️ ไม่ใช้ GET /credit-agent-reload/:service (ปุ่มรีเฟรช) — upsert OFFICE balance_credit_agent = เส้นเขียน
# GET /api/credit-sms-balance/:service (controller/Agent.go GetBalanceSMS)
#   frontend: getCreditSms · Navbar2.vue "เครดิต Sms คงเหลือ" · data = number (ยิงผู้ให้บริการ SMS สด)
#   ⚠️ ผู้ให้บริการตอบ Code ≠ 200 → หลังบ้านตอบ code 0 + data 0 (ศูนย์ปลอม) · error อื่น → code 1
questions: [BQ-41, BQ-42, BQ-43]
tools:
  - name: credit_agent_balance
    description: >-
      เครดิตเอเจ้นคงเหลือของเว็บ (ยอดล่าสุดที่ระบบบันทึกไว้ เหมือนแถบด้านบนของหลังบ้าน) พร้อมเวลาที่อัปเดต
      · ใช้เมื่อถามเครดิตระบบเหลือเท่าไหร่ · ผู้ช่วยไม่กดรีเฟรชยอดให้ · ประเมินเวลาเครดิตหมดไม่ได้
    questions: [BQ-41, BQ-43]
    permission: credit_system
    freshness: live
    calls:
      - id: a
        method: GET
        path: /credit-agent-balance/{service}
        timeout_ms: 10000
        not_found_codes: [1]
        schema:
          type: object
          required: [amount, updated_at]
          properties:
            amount: {type: number}
            name: {type: string}
            unit: {type: string}
            updated_at: {type: integer}
    values:
      - {name: amount, from: a, path: amount}
      - {name: unit, from: a, path: unit}
      - {name: updated, from: a, path: updated_at}
    not_found: {when: "false", message: ยังไม่มียอดเครดิตเอเจ้นที่บันทึกไว้ของเว็บนี้ ลองกดรีเฟรชที่แถบด้านบนของหลังบ้าน}
    card:
      title: เครดิตเอเจ้นคงเหลือ
      fields:
        - {label: เครดิตเอเจ้นคงเหลือ, value: amount, format: money}
        - {label: หน่วย, value: unit, when: "!empty(unit)"}
        - {label: อัปเดตล่าสุด, value: updated, format: datetime, when: "updated > 0"}
      note: ยอดล่าสุดที่ระบบบันทึกไว้ ถ้าต้องการยอดล่าสุดจากระบบเกมให้กดไอคอนรีเฟรชข้างยอดที่แถบด้านบนของหลังบ้าน
      link: {label: เปิดหลังบ้าน (ดูแถบด้านบน), path: /}
    model_context:
      - {name: is_low_or_zero, type: bool, expr: "amount <= 0"}
      - {name: never_updated, type: bool, expr: "updated <= 0"}

  - name: credit_sms_balance
    description: เครดิต Sms คงเหลือของเว็บ (ดึงสดจากผู้ให้บริการ SMS เหมือนแถบด้านบนของหลังบ้าน) · ใช้เมื่อถามว่า SMS เหลือเท่าไหร่
    questions: [BQ-42]
    permission: credit_system
    freshness: live
    calls:
      - id: s
        method: GET
        path: /credit-sms-balance/{service}
        timeout_ms: 15000
        schema: {type: number}
    values:
      - {name: sms, from: s, path: ""}
    card:
      title: เครดิต Sms คงเหลือ
      fields:
        - {label: เครดิต Sms คงเหลือ, value: sms, format: number}
      note: ค่าที่ผู้ให้บริการ SMS ตอบกลับ ถ้าผู้ให้บริการตอบผิดพลาด หลังบ้านจะแสดงเป็นศูนย์ ให้ตรวจที่แถบด้านบนอีกครั้งหรือติดต่อทีม support
      link: {label: เปิดหลังบ้าน (ดูแถบด้านบน), path: /}
    model_context:
      - {name: is_zero, type: bool, expr: "sms <= 0"}
      - {name: unit_note, type: text, text: หลังบ้านไม่ได้ระบุหน่วยของเครดิต Sms จึงไม่ควรบอกว่าเป็นจำนวนข้อความ}
