# GET /api/GetDepositStatementv2/:service (controller/deposit.go GetDepositStatementV2)
#   frontend: api-service/deposit/index.ts getDepositStatementV2 · DepositTransection.vue (adjustPayload "deposit")
#   query ที่ UI ส่ง: range_dt=YYYY-MM-DD 00:00:00~YYYY-MM-DD 23:59:59 · search · sort=datetime · order=-1 · limit · page (channel_filter ไม่ส่งเมื่อเลือก ALL)
#   response: {code, data[], count (จำนวนที่ตรงเงื่อนไขทั้งหมด), summary (ผลรวม amount ของที่ตรงทั้งหมด — รวมทุกสถานะถ้าไม่กรอง status)}
#   ⚠️ ห้ามส่ง key username/bank_name/bank_number/bonus_name (เข้าทางที่ filter ไม่มี $and → panic) · ค้นยูสใช้ search (regex หลาย field) แล้วกรองตรงตัวใน values
#   คีย์อื่น = equality ผ่าน helper.FilterField (status=1 → int)
# GET /api/GetDepositStatementRemainToday/:service (controller/deposit.go GetDepositStatementRemainToDay)
#   frontend: getDepositStatementRemainToday · UI ส่ง range_dt=วันนี้ 00:00:00~พรุ่งนี้ 00:00:00 → data = ผลรวม deposit (number), count
#   ตกค้าง = bank_statement status ∉ {1,0,99} และ deposit > 0 · DB error → code 0 + data [] (array) → schema ไม่ตรง = "ดึงไม่ได้" (ไม่ใช่ศูนย์)
questions: [BQ-02, BQ-06]
tools:
  - name: deposit_summary
    description: >-
      สรุปรายการฝากของเว็บตามวันหรือช่วงวันที่ถาม: จำนวนและยอดรวมทุกสถานะ (ตรงกับป้าย ยอดฝากรวม ในหน้ารายการฝาก) จำนวนและยอดที่สำเร็จ
      และธุรกรรมตกค้าง (จำนวน + ยอด) · ใช้เมื่อถามยอดฝากวันนี้ มีฝากกี่รายการ ยอดตกค้าง · ไม่ระบุวัน = วันนี้
    questions: [BQ-02]
    permission: deposit
    freshness: summary
    input:
      date_from: {type: date, description: วันแรกของช่วง (ไม่ระบุ = วันนี้)}
      date_to: {type: date, description: วันสุดท้ายของช่วง รวมทั้งวัน (ไม่ระบุ = เท่ากับวันแรก)}
    calls:
      - id: all
        method: GET
        path: /GetDepositStatementv2/{service}
        query:
          range_dt: "{datetime:input.date_from|datetime:today}~{datetime_end:input.date_to|datetime_end:input.date_from|datetime_end:today}"
          sort: datetime
          order: "-1"
          limit: "1"
          page: "1"
        envelope: raw
        cache_ttl: 30
        timeout_ms: 25000
        schema: &dsum
          type: object
          required: [code, data, count, summary]
          properties:
            code: {type: integer}
            data: {type: array}
            count: {type: integer}
            summary: {type: number}
      - id: ok
        method: GET
        path: /GetDepositStatementv2/{service}
        query:
          range_dt: "{datetime:input.date_from|datetime:today}~{datetime_end:input.date_to|datetime_end:input.date_from|datetime_end:today}"
          status: "1"
          sort: datetime
          order: "-1"
          limit: "1"
          page: "1"
        envelope: raw
        cache_ttl: 30
        timeout_ms: 25000
        schema: *dsum
      - id: remain
        method: GET
        path: /GetDepositStatementRemainToday/{service}
        query:
          range_dt: "{datetime:input.date_from|datetime:today}~{datetime_end:input.date_to|datetime_end:input.date_from|datetime_end:today}"
          sort: datetime
          order: "-1"
        envelope: raw
        cache_ttl: 30
        timeout_ms: 25000
        schema:
          type: object
          required: [code, data, count]
          properties:
            code: {type: integer}
            data: {type: number}
            count: {type: integer}
    values:
      - {name: all_count, from: all, path: count}
      - {name: all_amount, from: all, path: summary}
      - {name: ok_count, from: ok, path: count}
      - {name: ok_amount, from: ok, path: summary}
      - {name: remain_count, from: remain, path: count}
      - {name: remain_amount, from: remain, path: data}
    not_found: {when: "all_count == 0 && remain_count == 0", message: ไม่มีรายการฝากและไม่มีธุรกรรมตกค้างในช่วงวันที่ถาม}
    card:
      title: สรุปรายการฝาก
      fields:
        - {label: รายการฝากทั้งหมด, value: all_count, format: int, suffix: " รายการ"}
        - {label: ยอดฝากรวม (ทุกสถานะ), value: all_amount, format: money, suffix: " บาท"}
        - {label: ฝากสำเร็จ, value: ok_count, format: int, suffix: " รายการ"}
        - {label: ยอดฝากสำเร็จ, value: ok_amount, format: money, suffix: " บาท"}
        - {label: ธุรกรรมตกค้าง, value: remain_count, format: int, suffix: " รายการ"}
        - {label: ยอดตกค้าง, value: remain_amount, format: money, suffix: " บาท"}
      note: นับตามเวลาที่สร้างรายการในช่วงวันที่ถาม · ยอดตกค้างคือยอดเงินเข้าบัญชีที่ยังไม่ได้จับคู่กับสมาชิก (เหมือนป้าย ยอดตกค้างวันนี้ ในหน้ารายการฝาก)
      link: {label: เปิดรายการฝาก, path: /transection/deposit}
    model_context:
      - {name: has_remain, type: bool, expr: "remain_count > 0"}
      - {name: has_unsuccessful, type: bool, expr: "all_count > ok_count"}

  - name: deposit_find
    description: >-
      ค้นรายการฝากของยูสเซอร์เนม (ตรงตัว) ในวันหรือช่วงวันที่ถาม ทุกสถานะ เรียงใหม่ไปเก่า แสดงยอด สถานะ ผู้ดำเนินการ หมายเหตุ
      · ใช้เมื่อถามว่ารายการฝากของยูสนี้สถานะอะไร ใครทำ · ไม่ระบุวัน = วันนี้ · ค้นตามรหัสรายการฝากไม่ได้ · ไม่แสดง IP
    questions: [BQ-06]
    permission: deposit
    freshness: summary
    input:
      username: {type: string, required: true, description: ยูสเซอร์เนมของสมาชิก ตรงตัว, pattern: "^[A-Za-z0-9_.@-]{2,50}$"}
      date_from: {type: date, description: วันแรกของช่วง (ไม่ระบุ = วันนี้)}
      date_to: {type: date, description: วันสุดท้ายของช่วง รวมทั้งวัน (ไม่ระบุ = เท่ากับวันแรก)}
    calls:
      - id: l
        method: GET
        path: /GetDepositStatementv2/{service}
        query:
          range_dt: "{datetime:input.date_from|datetime:today}~{datetime_end:input.date_to|datetime_end:input.date_from|datetime_end:today}"
          search: "{input.username}"
          sort: datetime
          order: "-1"
          limit: "50"
          page: "1"
        envelope: raw
        timeout_ms: 25000
        schema:
          type: object
          required: [code, data, count]
          properties:
            code: {type: integer}
            count: {type: integer}
            data:
              type: array
              items:
                type: object
                required: [username, amount, datetime, status]
                properties:
                  username: {type: string}
                  amount: {type: number}
                  datetime: {type: string}
                  status: {type: integer}
                  channel: {type: string}
                  bank_code: {type: string}
                  bonus_name: {type: string}
                  operator_name: {type: string}
                  comment: {type: string}
    values:
      - {name: rows, from: l, path: data, filter: "lower(item.username) == lower(input.username)"}
      - {name: match_count, expr: "len(rows)"}
      - {name: fetched_count, from: l, path: data, agg: count}
      - {name: server_count, from: l, path: count}
    not_found: {when: "empty(rows)", message: ไม่พบรายการฝากของยูสเซอร์เนมนี้ในช่วงวันที่ถาม}
    card:
      title: รายการฝากของสมาชิก
      fields:
        - {label: พบ, value: match_count, format: int, suffix: " รายการ"}
      table:
        rows: rows
        max_rows: 20
        columns:
          - {label: วันที่, field: datetime, format: datetime}
          - {label: Username, field: username}
          - {label: ยอดฝาก, field: amount, format: money}
          - {label: สถานะ, field: status, format: "status:deposit"}
          - {label: ช่องทาง, field: channel}
          - {label: ธนาคาร, field: bank_code}
          - {label: โบนัส, field: bonus_name}
          - {label: ผู้ดำเนินการ, field: operator_name}
          - {label: หมายเหตุ, field: comment}
      note: แสดงสูงสุดยี่สิบรายการล่าสุดในการ์ด ดูทั้งหมดได้ที่หน้ารายการฝาก
      link: {label: เปิดรายการฝาก, path: /transection/deposit}
    model_context:
      - {name: statuses, type: labels, from: rows, pluck: status, format: "status:deposit"}
      - {name: may_have_more, type: bool, expr: "server_count > fetched_count"}
