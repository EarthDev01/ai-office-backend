# response ตาม controller/deposit.go:45-100 GetDepositStatement (ResponseV2 {code, data[], count, summary ทุกสถานะ})
tool: member_deposits
cases:
  - name: ไม่ระบุวัน = ตั้งแต่สมัคร · มีรายการไม่สำเร็จปน
    input: {username: user01}
    responses:
      l:
        body:
          code: 0
          message: Success
          count: 3
          summary: 1800
          data:
            - {id: 66f2a1b2c3d4e5f601234567, username: user01, bank_name: สมชาย ใจดี, bank_number: "1234567890", bank_code: KBANK, bonus_name: "", bonus: 0, amount: 500, datetime: "2026-09-24T13:05:00+07:00", channel: SMS, status: 2, operator_name: ""}
            - {id: 66f2a1b2c3d4e5f601234568, username: user01, bank_code: SCB, bonus_name: โปรสมาชิกใหม่, bonus: 100, amount: 800, datetime: "2026-09-20T12:00:00+07:00", channel: SMS, status: 1, operator_name: ""}
            - {id: 66f2a1b2c3d4e5f601234569, username: user01, bank_code: KBANK, bonus_name: "", amount: 500, datetime: "2026-09-10T09:30:00+07:00", channel: INSERT_STATEMENT, status: 1, operator_name: admin_a}
      ok: {body: {code: 0, message: Success, count: 2, summary: 1300, data: [{username: user01, amount: 800, datetime: "2026-09-20T12:00:00+07:00", status: 1}]}}
    expect:
      status: ok
      calls:
        l: {path: /GetDepositStatement/DEMO-SVC, query: {username: user01, range_dt: "2000-01-01 00:00:00~2026-09-24 23:59:59", sort: datetime, order: "-1", limit: "50", page: "1"}}
        ok: {path: /GetDepositStatement/DEMO-SVC, query: {username: user01, status: "1", limit: "1", range_dt: "2000-01-01 00:00:00~2026-09-24 23:59:59"}}
      fields:
        ยอดฝากสำเร็จ: "1,300.00 บาท"
        ฝากสำเร็จ: "2 รายการ"
        รายการทั้งหมด (ทุกสถานะ): "3 รายการ"
        ยอดรวมทุกสถานะ: "1,800.00 บาท"
      table_rows: 3
      table_cells:
        - ["24/09/2026 13:05", "500.00", รอคิว, SMS, ไม่รับโบนัส, ระบบอัตโนมัติ]
        - ["20/09/2026 12:00", "800.00", สำเร็จ, SMS, โปรสมาชิกใหม่, ระบบอัตโนมัติ]
        - ["10/09/2026 09:30", "500.00", สำเร็จ, INSERT_STATEMENT, ไม่รับโบนัส, admin_a]
      model_context: {statuses: [รอคิว, สำเร็จ], has_unsuccessful: true, may_have_more: false}
      link: /member/user01
  - name: ระบุเดือน · สำเร็จทั้งหมด (ไม่โชว์ยอดรวมทุกสถานะ)
    input: {username: user01, date_from: "2026-09-01", date_to: "2026-09-30"}
    responses:
      l: {body: {code: 0, count: 1, summary: 800, data: [{username: user01, amount: 800, datetime: "2026-09-20T12:00:00+07:00", channel: SMS, status: 1}]}}
      ok: {body: {code: 0, count: 1, summary: 800, data: [{username: user01, amount: 800, datetime: "2026-09-20T12:00:00+07:00", status: 1}]}}
    expect:
      status: ok
      calls:
        l: {query: {range_dt: "2026-09-01 00:00:00~2026-09-30 23:59:59"}}
      fields: {ยอดฝากสำเร็จ: "800.00 บาท", ฝากสำเร็จ: "1 รายการ"}
      no_fields: [ยอดรวมทุกสถานะ]
      model_context: {has_unsuccessful: false}
  - name: ไม่พบ (DB error ถูกกลืนเป็น data [] count 0 ไม่มี summary)
    input: {username: nobody}
    responses:
      l: {body: {code: 0, message: Success, data: [], count: 0}}
      ok: {body: {code: 0, message: Success, data: [], count: 0}}
    expect: {status: not_found}
  - name: หลังบ้านตอบ JSON พัง
    input: {username: user01}
    responses:
      l: {raw: "{not json"}
      ok: {body: {code: 0, data: [], count: 0}}
    expect: {status: error, error_code: bad_json}
