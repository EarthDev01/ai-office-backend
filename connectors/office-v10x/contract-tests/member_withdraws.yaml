        l: {path: /GetWithdrawStatement/DEMO-SVC, query: {username: user01, range_dt: "2000-01-01 00:00:00~2026-09-24 23:59:59", sort: datetime, order: "-1", limit: "50", page: "1"}}
        ok: {path: /GetWithdrawStatement/DEMO-SVC, query: {status: "1", limit: "1"}}
      fields:
        ยอดถอนสำเร็จ: "1,500.00 บาท"
        ถอนสำเร็จ: "1 รายการ"
        รายการทั้งหมด (ทุกสถานะ): "2 รายการ"
      table_rows: 2
      table_cells:
        - ["24/09/2026 12:00", "700.00", ยกเลิก, SCB, admin_b]
        - ["21/09/2026 11:00", "1,500.00", สำเร็จ, SCB, ระบบอัตโนมัติ]
      model_context: {statuses: [ยกเลิก, สำเร็จ], has_unsuccessful: true, may_have_more: false}
      link: /member/user01
  - name: ไม่พบในช่วงวัน
    input: {username: user01, date_from: "2026-09-01", date_to: "2026-09-02"}
    responses:
      l: {body: {code: 0, data: [], count: 0, summary: 0}}
      ok: {body: {code: 0, data: [], count: 0, summary: 0}}
    expect:
      status: not_found
      calls:
        l: {query: {range_dt: "2026-09-01 00:00:00~2026-09-02 23:59:59"}}
