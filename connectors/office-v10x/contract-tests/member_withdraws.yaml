    input: {username: user01}
    responses:
      l:
        body:
          code: 0
          message: Success
          count: 2
          summary: 1500
          data:
            - {id: 66f2a1b2c3d4e5f601230011, datetime: "2026-09-24T12:00:00+07:00", username: user01, amount: 700, status: 4, bank_code: SCB, bank_number: "9876543210", bank_name: สมชาย ใจดี, operator_name: admin_b}
            - {id: 66f2a1b2c3d4e5f601230012, datetime: "2026-09-21T11:00:00+07:00", username: user01, amount: 1500, status: 1, bank_code: SCB, operator_name: ""}
      ok: {body: {code: 0, message: Success, count: 1, summary: 1500, data: [{username: user01, amount: 1500, datetime: "2026-09-21T11:00:00+07:00", status: 1}]}}
