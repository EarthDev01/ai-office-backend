    input: {username: user02}
    responses:
      c: {body: {code: 0, data: {commission: {all: 0}, cashback: {all: 0}}}}
    expect:
      status: ok
      fields: {คืนยอดเสียสะสม (Cashback): "0.00 บาท"}
      model_context: {has_cashback: false, has_commission: false}
  - name: ระบบหน้าบ้านไม่ตอบ (code 1)
