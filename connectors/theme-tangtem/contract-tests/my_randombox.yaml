            history: []
            ticket_left_all: 3
            ticket_left:
              - {amount: 2, title: กล่องทอง, ticket_type: deposit_one, enable: true, is_not_show: false}
              - {amount: 1, title: กล่องเงิน, ticket_type: turnover_cron_job_one, enable: true, is_not_show: false}
