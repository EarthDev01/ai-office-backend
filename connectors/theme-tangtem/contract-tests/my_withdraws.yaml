tool: my_withdraws
cases:
  - name: ถอนสำเร็จ 1 ไม่สำเร็จ 1
    username: somchai01
    responses:
      h:
        body:
          status: {code: 200, message: ok}
          message: {code: 0, message: สำเร็จ}
          data:
            deposit: []
            withdraw:
              - {username: somchai01, datetime: "2026-09-24T05:00:00Z", amount: 1000, status: 1, bank_code: SCB, bank_number: "9876543210"}
              - {username: somchai01, datetime: "2026-09-22T05:00:00Z", amount: 200, status: 4, bank_code: SCB, bank_number: "9876543210"}
            bonus: []
    expect:
      status: ok
      calls:
        h: {path: /history, body: {username: somchai01}}
      table_rows: 2
      table_cells: [["24/09/2026 12:00", "1,000.00", สำเร็จ], ["22/09/2026 12:00", "200.00", ไม่สำเร็จ]]
      model_context: {has_pending: false}
      link: /
  - name: ยังไม่เคยถอน
    responses:
      h: {body: {status: {code: 200, message: ok}, message: {code: 0, message: สำเร็จ}, data: {deposit: [], withdraw: [], bonus: []}}}
    expect: {status: not_found}
