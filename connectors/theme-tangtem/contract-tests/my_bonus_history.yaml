    expect:
      status: ok
      calls:
        h: {path: /history, body: {username: somchai01}}
      table_rows: 2
      table_cells: [["05/10/2026 12:00", "100.00", สำเร็จ, เครดิตฟรีวันเกิด, "500.00"]]
      link: /
