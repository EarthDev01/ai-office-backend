      h:
        body:
          status: {code: 200, message: ok}
          message: {code: 0, message: สำเร็จ}
          data:
            deposit: []
            withdraw: []
            bonus:
              - {username: somchai01, datetime: "2026-10-05T05:00:00Z", amount: 0, bonus: 100, bonus_name: เครดิตฟรีวันเกิด, withdraw_fix: 500, status: 1, bank_code: KBANK, bank_number: "1234567890"}
