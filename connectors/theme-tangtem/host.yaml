# theme-tangtem → หน้าเว็บผู้เล่น platform_Tangtem (Nuxt 2) · API topupserie_mootui · โหมด browser (ไม่แก้ธีม/API นอกจากแปะ script)
# widget ยิง API เดิมที่หน้าเว็บใช้อยู่ ด้วย token ของผู้เล่นที่ล็อกอินอยู่ — ผู้เล่นเห็นได้แค่ข้อมูลของตัวเอง (API ตรวจเอง)
#
# ที่มา (ตรวจกับโค้ดจริง platform_Tangtem main 99dad92 · topupserie_mootui · 06/10/2026):
#   token   : @nuxtjs/auth-next ค่าเริ่มต้น (nuxt.config.js:182-293 ไม่ได้ปิด localStorage)
#             → localStorage["auth._token.<strategy>"] = "Bearer <jwt>" · strategy ที่ใช้อยู่ = localStorage["auth.strategy"]
#             (local = ล็อกอินปกติ · local2 = LINE · logintoken = ล็อกอินด้วย token) · ออกจากระบบ = "false"
#             widget ตัดคำว่า Bearer ออกเอง (page.ts stripScheme)
#   header  : plugins/axios.js:31-43 แนบ Authorization ตามค่าที่เก็บ (มี Bearer อยู่แล้ว)
#   base    : plugins/axios.js:2-3 prod = location.origin + "/api" · dev = https://tangtem-24-dev.24plusv3.vip/api (ตั้งในคอนโซล)
#   service : ไม่มีตัวเลือกเว็บในหน้า — 1 โดเมน = 1 แบรนด์ = 1 deployment ของ topupserie → source: office
#   identity: topupserie service/authJWT.go:16-20 claims {username, session_id, exp, iss, iat} · ไม่มีชื่อแบรนด์ใน token
#   envelope: service/mainService.go Resp → {status:{code,message}, message:{code,message}, data} · message.code 0 = สำเร็จ
#             ยูสใน body ไม่ตรง token → HTTP 200 body ว่าง (Resp 401 ไม่เขียนอะไร) = schema_mismatch = "ดึงไม่ได้"
#   ⚠️ ห้ามใช้ /is_login (เขียน session + คืนรหัสผ่าน) · /get/bonus /get/wallet /withdraw /set/* (เขียนข้อมูล)
kind: theme-tangtem
label: หน้าเว็บผู้เล่น Tangtem
mode: browser
audience: player
page_auth:
  token:
    source: localStorage
    key: "auth._token.{key_from}"
    key_from: {source: localStorage, key: auth.strategy, default: local}
    format: raw
  service: {source: office}
  host_api_base: "{origin}/api"
  session_path: ""
  auth_scheme: Bearer
  identity:
    source: jwt
    root: ""
    id: username
    username: username
host_api:
  envelope: {code_field: message.code, ok_codes: [0], data_field: data, message_field: message.message}
  timeout_ms: 10000
timezone: Asia/Bangkok
day_cutoff: "00:00"
support_message: ติดต่อแอดมินของเว็บผ่านช่องทางติดต่อที่หน้าเว็บ
# สีของแบรนด์: plugins/setRootStyle.js ตั้งบน :root จากค่า /prefix (themecolor1/2) — หัวเว็บไล่สีด้วยคู่นี้
# ไม่ใช้ fontcolor1 เป็นสีตัวอักษร (บางแบรนด์ตั้งดำบนสีม่วง อ่านยาก) — widget เลือกขาว/เข้มตามความสว่างเอง
page_colors: {accent: --theme-color-1, accent_2: --theme-color-2}
facts:
  - id: assistant_scope
    title: ผู้ช่วยทำอะไรได้บ้าง
    text: >-
      ผู้ช่วยเป็นระบบอัตโนมัติ ดูข้อมูลบัญชีของคุณเองได้อย่างเดียว เช่น ยอดเครดิต รายการฝาก รายการถอน ถอนได้หรือยัง โปรที่ติดอยู่ คืนยอดเสีย คอมมิชชั่น แรงก์ แต้ม เช็คอิน กล่องสุ่ม ภารกิจ และการแนะนำเพื่อน
      แต่ฝาก ถอน รับโปรโมชั่น กดรับรางวัล หรือแก้ข้อมูลแทนไม่ได้ ต้องทำเองที่หน้าเว็บ เรื่องที่ผู้ช่วยตอบไม่ได้ให้ติดต่อแอดมินของเว็บ
    keywords: [ทำอะไรได้, เป็นใคร, คุยกับคน, ติดต่อแอดมิน, ช่วยอะไรได้]
  - id: deposit_not_arrived
    title: ฝากเงินแล้วยอดยังไม่เข้า
    text: >-
      ผู้ช่วยดูรายการฝากล่าสุดของคุณได้ ถ้ารายการขึ้นสถานะรอดำเนินการ ให้รอสักครู่ ถ้ารอนานผิดปกติหรือไม่มีรายการฝากเลย
      ให้ติดต่อแอดมินของเว็บพร้อมสลิปการโอน
    keywords: [ฝากไม่เข้า, ยอดไม่เข้า, เงินไม่เข้า, โอนแล้วไม่เข้า, เครดิตไม่เข้า]
  - id: no_other_user
    title: ข้อมูลของคนอื่น
    text: ผู้ช่วยดูได้เฉพาะข้อมูลบัญชีของคุณที่ล็อกอินอยู่เท่านั้น ดูข้อมูลของสมาชิกคนอื่นไม่ได้
    keywords: [บัญชีคนอื่น, ยูสคนอื่น, เพื่อน]
# ผู้ที่ยังไม่ล็อกอินคุยได้ (D-20 · D-24) — ถามได้วันละ 6 ข้อความต่อ guest_id (widget สุ่มเก็บใน localStorage)
# ดูข้อมูลบัญชีไม่ได้ · ใช้ได้แค่ตอบทั่วไป + ปุ่ม when: guest/any
guest: {daily_limit: 6}
# ปุ่มใต้คำตอบ (D-22 · D-23) — กดแล้ว widget ปิดกล่องแชทแล้วสั่งหน้าเว็บ (ตรวจกับโค้ดจริง platform_Tangtem 08/10/2026):
#   bv_modal : modal ของ bootstrap-vue → $nuxt.$bvModal.show(id) · modal ฝั่งสมาชิกอยู่ใน <div v-if="$auth.loggedIn"> (layouts/default.vue:9-47)
#              จึงเป็น when: member · register/login/forgot-password/download มีทุกคน (layouts/default.vue:50-56)
#   click    : ปุ่มแถบล่าง #buttonFooter<name> (components/Layout/Footer.vue:6) — กดให้แทนการเปิด modal ตรง
#              เพื่อได้เงื่อนไขเดิมของหน้า (ยังไม่ยืนยัน OTP → otpverify · ยังไม่ผูกบัญชี → addbank · ถอนแบบ P2P → withdraw-transaction)
#              ปุ่มที่แบรนด์ปิดไว้ (enable: false) กดแล้วไม่มีอะไรเกิดขึ้น — หน้าเว็บโชว์แม่กุญแจเอง
#   path     : /guide = หน้าคู่มือ (pages/guide/index.vue)
#   ชื่อปุ่มตาม plugins/i18n/th.js
page_actions:
  - {id: promotion, label: ดูโปรโมชั่น, when: member, open: {bv_modal: bv-modal-promotion},
     about: "หน้าต่างโปรโมชั่นของเว็บ ดูรายละเอียดและกดรับโปรได้"}
  - {id: deposit, label: ฝากเงิน, when: member, open: {click: "#buttonFooterdeposit a"},
     about: "หน้าฝากเงิน (ถ้ายังไม่ผูกบัญชี/ยืนยันเบอร์ หน้าเว็บจะพาไปทำก่อนเอง)"}
  - {id: withdraw, label: ถอนเงิน, when: member, open: {click: "#buttonFooterwithdraw a"},
     about: "หน้าถอนเงิน ดูยอดเทิร์นและเงื่อนไขก่อนถอน"}
  - {id: history, label: ประวัติการใช้งาน, when: member, open: {bv_modal: bv-modal-history},
     about: "ประวัติฝาก ถอน โบนัส และการเล่นเกม"}
  - {id: bonus_free, label: โบนัสฟรี, when: member, open: {bv_modal: bv-modal-bonus},
     about: "โบนัสฟรีที่กดรับได้"}
  - {id: event, label: กิจกรรม, when: member, open: {bv_modal: bv-modal-event},
     about: "กิจกรรมของเว็บ"}
  - {id: wheel, label: กงล้อ, when: member, open: {click: "#buttonFooterwheel a"},
     about: "หมุนกงล้อลุ้นรางวัล"}
  - {id: cashback, label: รับเงินคืน, when: member, open: {click: "#buttonFootercashback a"},
     about: "รับยอดเสียคืน (แคชแบ็ก)"}
  - {id: commission, label: คอมมิชชั่น, when: member, open: {click: "#buttonFootercommission a"},
     about: "รับค่าคอมมิชชั่น"}
  - {id: affiliate, label: ช่องทางรวย, when: member, open: {bv_modal: bv-modal-affiliate},
     about: "ชวนเพื่อน แนะนำเพื่อนรับค่าแนะนำ"}
  # กิจกรรม (เมนู กิจกรรม → Activity.vue:162-163 เปิด bv-modal-<key>) · modal โหลดข้อมูลเองตอน bv::modal::show
  #   Ranking/index.vue:3,128 · Checkin.vue:3,281 · Randombox/index.vue:7,113 · Mission.vue:3,138 (key mission_reward → missionreward)
  - {id: rank, label: Ranking, when: member, open: {bv_modal: bv-modal-ranking},
     about: "แรงก์ (Ranking/VIP) เงื่อนไขอัปแรงก์และรางวัลแต่ละแรงก์"}
  - {id: checkin, label: เช็คอิน, when: member, open: {bv_modal: bv-modal-checkin},
     about: "เช็คอินรายวัน กดรับรางวัลเช็คอิน"}
  - {id: randombox, label: กล่องสุ่ม, when: member, open: {bv_modal: bv-modal-randombox},
     about: "เปิดกล่องสุ่มด้วยตั๋วที่มี"}
  - {id: missions, label: ภารกิจ, when: member, open: {bv_modal: bv-modal-missionreward},
     about: "ภารกิจ ดูเงื่อนไขและกดรับรางวัลภารกิจ"}
  - {id: profile, label: ข้อมูลสมาชิก, when: member, open: {bv_modal: bv-modal-profile},
     about: "ข้อมูลสมาชิก ยูสเซอร์ เบอร์โทร บัญชีธนาคารที่ผูกไว้"}
  - {id: change_password, label: เปลี่ยนรหัสผ่าน, when: member, open: {bv_modal: bv-modal-changepassword},
     about: "เปลี่ยนรหัสผ่านเข้าสู่ระบบ"}
  - {id: register, label: สมัครสมาชิก, when: guest, open: {bv_modal: bv-modal-register},
     about: "สมัครสมาชิกใหม่ (เบอร์โทร → OTP → รหัสผ่าน → บัญชีธนาคาร)"}
  - {id: login, label: เข้าสู่ระบบ, when: guest, open: {bv_modal: bv-modal-login},
     about: "เข้าสู่ระบบสำหรับคนที่เป็นสมาชิกแล้ว"}
  - {id: forgot_password, label: ลืมรหัสผ่าน, when: guest, open: {bv_modal: bv-modal-forgot-password},
     about: "ตั้งรหัสผ่านใหม่เมื่อลืมรหัสผ่าน"}
  - {id: download_app, label: ดาวน์โหลดแอป, open: {bv_modal: bv-modal-download},
     about: "ดาวน์โหลดแอปของเว็บ"}
  - {id: guide, label: คู่มือการใช้งาน, open: {path: /guide},
     about: "หน้าคู่มือการใช้งานเว็บ"}
# ปุ่มถามต่อตั้งต้น — ใช้เมื่อคำตอบไม่ได้ปุ่มจากคำถามข้อมูล (ทักทาย ถามวิธีทำ ฯลฯ)
follow_ups:
  - {label: เครดิตคงเหลือ, ask: ตอนนี้เครดิตเหลือเท่าไหร่, when: member}
  - {label: ถอนได้หรือยัง, ask: ตอนนี้ถอนได้หรือยัง, when: member}
  - {label: สมัครยังไง, ask: สมัครสมาชิกยังไง, when: guest}
  - {label: มีโปรอะไรบ้าง, ask: มีโปรโมชั่นอะไรบ้าง}
  - {label: เว็บนี้ทำอะไรได้บ้าง}
