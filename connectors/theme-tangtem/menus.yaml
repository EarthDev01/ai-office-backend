guides:
  - id: how_deposit
    title: ฝากเงิน
    menu: deposit
    steps: [กดปุ่ม ฝากเงิน ที่หน้าเว็บ, เลือกช่องทางและทำตามขั้นตอนที่หน้าเว็บแสดง, ถ้าโอนแล้วยอดยังไม่เข้า ดูรายการได้ที่ ประวัติการใช้งาน]
    keywords: [ฝากยังไง, วิธีฝาก, เติมเงินยังไง]
  - id: how_withdraw
    title: ถอนเงิน
    menu: withdraw
    steps: [กดปุ่ม ถอนเงิน ที่หน้าเว็บ, ตรวจยอดเทิร์นและเงื่อนไขโปรโมชั่นที่หน้าถอนเงิน, ใส่จำนวนเงินแล้วยืนยัน]
    keywords: [ถอนยังไง, วิธีถอน]
  # ขั้นตอนตาม components/Modal/Register.vue (4 ขั้น · บางแบรนด์ปิด OTP จะข้ามขั้น 2) — ผู้เล่นกรอกเองในหน้าสมัครของเว็บ ไม่ผ่านผู้ช่วย
  - id: how_register
    title: สมัครสมาชิก
    menu: register
    steps:
      - กดปุ่ม สมัครสมาชิก
      - กรอกเบอร์โทร 10 หลัก ติ๊กยอมรับเงื่อนไข แล้วกดขอรหัส OTP
      - กรอกรหัส OTP 6 หลักที่ได้ทาง SMS
      - ตั้งรหัสผ่านอย่างน้อย 6 ตัว แล้วกรอกยืนยันอีกครั้ง
      - เลือกธนาคาร กรอกเลขบัญชี และเลือกช่องทางที่รู้จักเว็บ แล้วกดสมัคร
      - สมัครเสร็จระบบจะเข้าสู่ระบบให้อัตโนมัติ
    note: บางเว็บไม่มีขั้น OTP · ชื่อบัญชีต้องตรงกับชื่อที่ใช้สมัคร
    keywords: [สมัครยังไง, วิธีสมัคร, สมัครสมาชิก, เปิดยูส, สมัครไม่ได้]
