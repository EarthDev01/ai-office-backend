# BQ-02 / BQ-06 (ฝาก) · host R2 deposit-summary · R3 deposit-list · R4 deposit-by-id (AIRequire any_of P003)
questions: [BQ-02]
tools:
  - name: deposit_summary
    description: >-
      สรุปรายการฝากของวัน: ยอดเงินเข้าบัญชีฝากแต่ละบัญชี ยอดตกค้าง และรายการเติมเครดิตสำเร็จ
      ใช้เมื่อถามจำนวนรายการฝาก ยอดฝากรวม หรือยอดตกค้าง
    questions: [BQ-02]
    permission: deposit
    freshness: summary
    input:
      date: {type: date, description: วันที่ต้องการดู ไม่ใส่ = วันนี้}
    calls:
      - id: sum
        method: GET
        path: /api/ai/read/deposit-summary/{service}
        query: {date: "{date:input.date|date:today}"}
        cache_ttl: 60
        schema:
          type: object
          required: [date, bank_accounts, bank_totals, remain_items, credit_statements]
          properties:
            date: {type: string}
            bank_accounts:
              type: array
              items:
                type: object
                required: [bank_code, account_last4, deposit, remain, total, count]
                properties:
                  bank_code: {type: string}
                  account_name: {type: string}
                  account_last4: {type: string}
                  deposit: {type: number}
                  remain: {type: number}
                  total: {type: number}
                  count: {type: integer}
                  last_statement_at: {type: string}
            bank_totals:
              type: object
              required: [accounts, deposit, remain, total, count]
              properties:
                accounts: {type: integer}
                deposit: {type: number}
                remain: {type: number}
                total: {type: number}
                count: {type: integer}
            remain_items:
              type: object
              required: [count, amount, by_status_comment]
              properties:
                count: {type: integer}
                amount: {type: number}
                by_status_comment:
                  type: array
                  items: {type: object, required: [status, count, amount], properties: {status: {type: integer}, comment: {type: string}, count: {type: integer}, amount: {type: number}}}
            credit_statements:
              type: object
              required: [deposit]
              properties:
                deposit:
                  type: object
                  required: [count, amount, success_count, success_amount, success_bonus]
                  properties:
                    count: {type: integer}
                    amount: {type: number}
                    success_count: {type: integer}
                    success_amount: {type: number}
                    success_bonus: {type: number}
    values:
      - {name: day, from: sum, path: date}
      - {name: accounts, from: sum, path: bank_accounts, sort_by: total, order: desc}
      - {name: bank_deposit, from: sum, path: bank_totals.deposit}
      - {name: bank_remain, from: sum, path: bank_totals.remain}
      - {name: bank_total, from: sum, path: bank_totals.total}
      - {name: bank_count, from: sum, path: bank_totals.count}
      - {name: remain_count, from: sum, path: remain_items.count}
      - {name: remain_amount, from: sum, path: remain_items.amount}
      - {name: remain_groups, from: sum, path: remain_items.by_status_comment, filter: "in(item.status, 0, 1, 2, 3, 99)"}
      - {name: credit_ok_count, from: sum, path: credit_statements.deposit.success_count}
      - {name: credit_ok_amount, from: sum, path: credit_statements.deposit.success_amount}
      - {name: credit_ok_bonus, from: sum, path: credit_statements.deposit.success_bonus}
      - {name: credit_all_count, from: sum, path: credit_statements.deposit.count}
    card:
      title: สรุปยอดฝาก
      fields:
        - {label: วันที่, value: day, format: date}
        - {label: ยอดฝากเข้าบัญชี (สำเร็จ), value: bank_deposit, format: money, suffix: " บาท"}
        - {label: ยอดตกค้าง, value: bank_remain, format: money, suffix: " บาท"}
        - {label: ยอดฝากทั้งหมด, value: bank_total, format: money, suffix: " บาท"}
        - {label: รายการเงินเข้าบัญชีทั้งหมด, value: bank_count, format: int, suffix: " รายการ"}
        - {label: รายการตกค้าง, value: remain_count, format: int, suffix: " รายการ"}
        - {label: ยอดรายการตกค้าง, value: remain_amount, format: money, suffix: " บาท"}
        - {label: เติมเครดิตสำเร็จ, value: credit_ok_count, format: int, suffix: " รายการ"}
        - {label: ยอดเติมเครดิตสำเร็จ, value: credit_ok_amount, format: money, suffix: " บาท"}
        - {label: โบนัสที่ได้จากการฝาก, value: credit_ok_bonus, format: money, suffix: " บาท"}
        - {label: รายการเติมเครดิตทั้งหมด, value: credit_all_count, format: int, suffix: " รายการ"}
      table:
        rows: accounts
        max_rows: 20
        columns:
          - {label: ธนาคาร, field: bank_code}
          - {label: ชื่อบัญชี, field: account_name}
          - {label: เลขบัญชีท้าย, field: account_last4}
          - {label: ยอดฝาก, field: deposit, format: money}
          - {label: ตกค้าง, field: remain, format: money}
          - {label: จำนวน, field: count, format: int, suffix: " รายการ"}
      note: ยอดเงินเข้าบัญชี (สเตทเม้นธนาคาร) กับรายการเติมเครดิต เป็นคนละแหล่ง ห้ามนำมาบวกกัน · ตามแท็บ สรุปยอดเงินในบัญชีฝาก และ รายการตกค้าง
      link: {label: เปิดรายการฝาก, path: "/Deposit?service={service_b64}&web={service}"}
    model_context:
      - {name: has_remain, type: bool, expr: "remain_count > 0"}
      - {name: remain_statuses, type: labels, from: remain_groups, pluck: status, format: "status:bank_statement"}
      - {name: has_bank_accounts, type: bool, expr: "len(accounts) > 0"}
      - {name: note, type: text, text: ยอดและจำนวนแสดงในการ์ดแล้ว}

  - name: deposit_find
    description: >-
      ค้นรายการฝาก (รายการเติมเครดิต) ของวัน กรองด้วยยูสเซอร์เนมหรือสถานะได้ ใช้หารายการฝากล่าสุดของสมาชิก
      หรือดูว่ารายการฝากสถานะอะไร ใครทำรายการ
    questions: [BQ-06, BQ-02]
    permission: deposit
    freshness: summary
    input:
      username: {type: string, description: ยูสเซอร์เนมของสมาชิก (ตรงตัว), pattern: "^[A-Za-z0-9_.@-]{2,64}$"}
      date: {type: date, description: วันที่ของรายการ ไม่ใส่ = วันนี้}
      status: {type: integer, description: รหัสสถานะรายการฝาก ถ้าต้องการกรอง, min: 0, max: 99}
    calls:
      - id: list
        method: GET
        path: /api/ai/read/deposit-list/{service}
        query: {date: "{date:input.date|date:today}", username: "{input.username}", status: "{input.status}", limit: "20"}
        cache_ttl: 30
        schema:
          type: object
          required: [date, items, count]
          properties:
            date: {type: string}
            count: {type: integer}
            count_capped: {type: boolean}
            items:
              type: array
              items: &dep_item
                type: object
                required: [id, datetime, username, amount, bonus, status, operator_name]
                properties:
                  id: {type: string}
                  datetime: {type: string}
                  username: {type: string}
                  amount: {type: number}
                  bonus: {type: number}
                  bonus_name: {type: string}
                  channel: {type: string}
                  status: {type: integer}
                  operator_name: {type: string}
                  comment: {type: string}
    values:
      - {name: rows, from: list, path: items}
      - {name: known_rows, from: list, path: items, filter: "in(item.status, 0, 1, 2, 5, 6)"}
      - {name: total_count, from: list, path: count}
      - {name: day, from: list, path: date}
    not_found: {when: "empty(rows)", message: ไม่พบรายการฝากตามเงื่อนไขในวันที่เลือก}
    card:
      title: รายการฝาก
      fields:
        - {label: วันที่, value: day, format: date}
        - {label: จำนวนที่พบ, value: total_count, format: int, suffix: " รายการ"}
      table:
        rows: rows
        max_rows: 20
        columns:
          - {label: เวลา, field: datetime, format: datetime}
          - {label: ยูสเซอร์เนม, field: username}
          - {label: ยอด, field: amount, format: money}
          - {label: โบนัส, field: bonus, format: money}
          - {label: สถานะ, field: status, format: "status:deposit"}
          - {label: ผู้ทำรายการ, field: operator_name}
      note: ผู้ทำรายการว่าง = ระบบทำรายการอัตโนมัติ (auto) · แสดงล่าสุดก่อน สูงสุดยี่สิบรายการ
      link: {label: เปิดรายการฝาก, path: "/Deposit?service={service_b64}&web={service}"}
    model_context:
      - {name: statuses_found, type: labels, from: known_rows, pluck: status, format: "status:deposit"}
      - {name: has_unknown_status, type: bool, expr: "count(known_rows) < count(rows)"}
      - {name: note, type: text, text: รายการแสดงในการ์ดแล้ว ถ้าต้องการรายละเอียดรายการเดียวให้ใช้รหัสรายการ}

  - name: deposit_by_id
    description: รายละเอียดรายการฝาก 1 รายการจากรหัสรายการ (id) — สถานะ ยอด โบนัส ผู้ทำรายการ
    questions: [BQ-06]
    permission: deposit
    freshness: summary
    input:
      id: {type: string, required: true, description: รหัสรายการฝาก (ObjectID ยาวยี่สิบสี่ตัว), pattern: "^[0-9a-fA-F]{24}$"}
    calls:
      - id: one
        method: GET
        path: /api/ai/read/deposit-by-id/{service}
        query: {id: "{input.id}"}
        cache_ttl: 15
        not_found_codes: [404]
        schema:
          type: object
          required: [item]
          properties:
            item: *dep_item
    values:
      - {name: when, from: one, path: item.datetime}
      - {name: user, from: one, path: item.username}
      - {name: amt, from: one, path: item.amount}
      - {name: bonus_amt, from: one, path: item.bonus}
      - {name: bonus_label, from: one, path: item.bonus_name}
      - {name: st, from: one, path: item.status}
      - {name: operator, from: one, path: item.operator_name}
      - {name: channel, from: one, path: item.channel}
      - {name: remark, from: one, path: item.comment}
    card:
      title: รายละเอียดรายการฝาก
      fields:
        - {label: เวลา, value: when, format: datetime}
        - {label: ยูสเซอร์เนม, value: user}
        - {label: ยอดฝาก, value: amt, format: money, suffix: " บาท"}
        - {label: โบนัส, value: bonus_amt, format: money, suffix: " บาท"}
        - {label: ชื่อโบนัส, value: bonus_label, when: "!empty(bonus_label)"}
        - {label: สถานะ, value: st, format: "status:deposit"}
        - {label: ผู้ทำรายการ, value: operator, when: "!empty(operator)"}
        - {label: ช่องทาง, value: channel}
        - {label: หมายเหตุ, value: remark, when: "!empty(remark)"}
      note: ไม่มีผู้ทำรายการ = ระบบทำรายการอัตโนมัติ · ข้อมูลนี้ไม่มี IP
      link: {label: เปิดรายการฝาก, path: "/Deposit?service={service_b64}&web={service}"}
    model_context:
      - {name: is_success, type: bool, expr: "st == 1"}
      - {name: is_waiting_queue, type: bool, expr: "st == 2"}
      - {name: is_stuck_activity, type: bool, expr: "st == 5"}
      - {name: is_stuck_credit, type: bool, expr: "st == 6"}
      - {name: is_failed, type: bool, expr: "!in(st, 1, 2, 5, 6)"}
      - {name: done_by_system, type: bool, expr: "empty(operator)"}
      - {name: note, type: text, text: สถานะและรายละเอียดแสดงในการ์ดแล้ว ถ้าผู้ใช้ถามว่าต้องทำอะไรต่อให้ใช้ตารางสถานะรายการฝาก}
