# BQ-35 · host R17 working-log · R18 login-log (AIRequire any_of M005)
# BQ-50 · host R22 member-credit-history (AIRequire any_of P008)
# detail/operator/username อยู่บนการ์ดเท่านั้น — ห้ามเข้า model_context (B-4)
questions: [BQ-35]
tools:
  - name: staff_working_log
    description: >-
      ประวัติการทำงานของพนักงานในเว็บนี้ (ใครทำอะไร กับสมาชิกคนไหน เมื่อไหร่) กรองด้วยชื่อพนักงาน ยูสเซอร์เนมสมาชิก หรือชื่อรายการได้
      ใช้ตอบว่าใครแก้รายการนี้ · ช่วงวันที่ไม่เกินสามสิบเอ็ดวัน (ค่าเริ่มต้นวันนี้)
    questions: [BQ-35]
    permission: staff_log
    freshness: summary
    input:
      date: {type: date, description: วันที่ต้องการดู ไม่ใส่ = วันนี้}
      start_date: {type: date, description: วันเริ่มต้น (ใช้คู่กับ end_date)}
      end_date: {type: date, description: วันสิ้นสุด (ใช้คู่กับ start_date)}
      operator: {type: string, description: ชื่อพนักงานที่ทำรายการ (บางส่วนของชื่อก็ได้), pattern: "^[\\p{Thai}A-Za-z0-9 ._@-]{2,40}$"}
      username: {type: string, description: ยูสเซอร์เนมของสมาชิกที่ถูกทำรายการ (ตรงตัว), pattern: "^[A-Za-z0-9_.@-]{2,64}$"}
      action: {type: string, description: ชื่อรายการ เช่น แจกโบนัสฟรี คืนเครดิต (บางส่วนของคำก็ได้), pattern: "^[\\p{Thai}A-Za-z0-9 ._-]{2,40}$"}
    calls:
      - id: wl
        method: GET
        path: /api/ai/read/working-log/{service}
        query:
          date: "{date:input.date|date:today}"
          start_date: "{date:input.start_date}"
          end_date: "{date:input.end_date}"
          operator: "{input.operator}"
          username: "{input.username}"
          action: "{input.action}"
          limit: "50"
        cache_ttl: 30
        schema: &wl_schema
          type: object
          required: [start_date, end_date, items, truncated]
          properties:
            start_date: {type: string}
            end_date: {type: string}
            count: {type: integer}
            truncated: {type: boolean}
            items:
              type: array
              items:
                type: object
                required: [datetime, operator_name, action, username, detail]
                properties: {datetime: {type: string}, operator_name: {type: string}, action: {type: string}, change: {type: string}, username: {type: string}, detail: {type: string}}
    values:
      - {name: rows, from: wl, path: items}
      - {name: from_day, from: wl, path: start_date}
      - {name: to_day, from: wl, path: end_date}
      - {name: more, from: wl, path: truncated}
    not_found: {when: "empty(rows)", message: ไม่พบประวัติการทำงานตามเงื่อนไขในช่วงวันที่เลือก}
    card:
      title: ประวัติการทำงานของพนักงาน
      fields:
        - {label: ตั้งแต่วันที่, value: from_day, format: date}
        - {label: ถึงวันที่, value: to_day, format: date}
        - {label: มีรายการมากกว่าที่แสดง, value: more, format: bool, when: "more == true"}
      table:
        rows: rows
        max_rows: 50
        columns:
          - {label: เวลา, field: datetime, format: datetime}
          - {label: พนักงาน, field: operator_name}
          - {label: รายการ, field: action}
          - {label: ยูสเซอร์เนม, field: username}
          - {label: จำนวน, field: change}
          - {label: รายละเอียด, field: detail}
      note: ตามเมนูรายงานการทำงานของพนักงาน · เฉพาะเว็บนี้ · ไม่มี IP ของพนักงาน
      link: {label: เปิดรายงานการทำงานของพนักงาน, path: "/Logs/Working"}
    model_context:
      - {name: has_more_rows, type: bool, expr: "more == true"}
      - {name: note, type: text, text: รายการ ชื่อพนักงาน และรายละเอียดแสดงในการ์ดแล้ว ห้ามพิมพ์ชื่อหรือตัวเลขเอง}

  - name: staff_login_log
    description: >-
      ประวัติเข้าสู่ระบบของพนักงานที่เข้าเว็บนี้ได้ (ใครเข้าระบบตอนไหน) กรองด้วยชื่อหรือยูสเซอร์เนมพนักงานได้ · IP แสดงแบบปิดท้าย
      ช่วงวันที่ไม่เกินสามสิบเอ็ดวัน (ค่าเริ่มต้นวันนี้)
    questions: [BQ-35]
    permission: staff_log
    freshness: summary
    input:
      date: {type: date, description: วันที่ต้องการดู ไม่ใส่ = วันนี้}
      start_date: {type: date, description: วันเริ่มต้น (ใช้คู่กับ end_date)}
      end_date: {type: date, description: วันสิ้นสุด (ใช้คู่กับ start_date)}
      employee: {type: string, description: ชื่อ ยูสเซอร์เนม หรือชื่อเล่นของพนักงาน (ตรงตัว ไม่สนตัวพิมพ์), pattern: "^[\\p{Thai}A-Za-z0-9 ._@-]{2,64}$"}
    calls:
      - id: ll
        method: GET
        path: /api/ai/read/login-log/{service}
        query:
          date: "{date:input.date|date:today}"
          start_date: "{date:input.start_date}"
          end_date: "{date:input.end_date}"
          employee: "{input.employee}"
          limit: "50"
        cache_ttl: 30
        not_found_codes: [404]
        schema:
          type: object
          required: [start_date, end_date, items, truncated]
          properties:
            start_date: {type: string}
            end_date: {type: string}
            truncated: {type: boolean}
            items:
              type: array
              items:
                type: object
                required: [datetime, action, employee_name, ip_masked, ip_kind]
                properties: {datetime: {type: string}, action: {type: string}, employee_name: {type: string}, employee_username: {type: string}, ip_masked: {type: string}, ip_kind: {type: string}}
    values:
      - {name: rows, from: ll, path: items}
      - {name: from_day, from: ll, path: start_date}
      - {name: to_day, from: ll, path: end_date}
      - {name: more, from: ll, path: truncated}
    not_found: {when: "empty(rows)", message: ไม่พบประวัติเข้าสู่ระบบในช่วงวันที่เลือก}
    card:
      title: ประวัติเข้าสู่ระบบของพนักงาน
      fields:
        - {label: ตั้งแต่วันที่, value: from_day, format: date}
        - {label: ถึงวันที่, value: to_day, format: date}
        - {label: มีรายการมากกว่าที่แสดง, value: more, format: bool, when: "more == true"}
      table:
        rows: rows
        max_rows: 50
        columns:
          - {label: เวลา, field: datetime, format: datetime}
          - {label: พนักงาน, field: employee_name}
          - {label: ยูสเซอร์เนมพนักงาน, field: employee_username}
          - {label: การเข้าระบบ, field: action}
          - {label: IP (ปิดท้าย), field: ip_masked}
      note: IP แสดงเฉพาะส่วนต้น · เข้าระบบผ่าน LINE จะไม่มี IP จริง · IP เต็มดูได้ที่เมนูจัดการพนักงาน ตามสิทธิ์
      link: {label: เปิดจัดการพนักงาน, path: "/Employee"}
    model_context:
      - {name: has_more_rows, type: bool, expr: "more == true"}
      - {name: note, type: text, text: ชื่อพนักงานและเวลาแสดงในการ์ดแล้ว ห้ามพิมพ์ชื่อหรือ IP เอง}

  - name: member_credit_history
    description: >-
      ประวัติการจัดการเครดิต โบนัส แต้ม เทิร์น ตั๋ว ของสมาชิกรายคน (ใครทำ เมื่อไหร่ เท่าไหร่) จากรายงานการทำงาน
      ค่าเริ่มต้นเจ็ดวันล่าสุด ช่วงไม่เกินสามสิบเอ็ดวัน · ไม่รวมการเติมเครดิตอัตโนมัติจากการฝาก (ใช้ deposit_find)
    questions: [BQ-50]
    permission: credit
    freshness: summary
    input:
      username: {type: string, required: true, description: ยูสเซอร์เนมของสมาชิก (ตรงตัว), pattern: "^[A-Za-z0-9_.@-]{2,64}$"}
      start_date: {type: date, description: วันเริ่มต้น (ใช้คู่กับ end_date · ไม่ใส่ = เจ็ดวันล่าสุด)}
      end_date: {type: date, description: วันสิ้นสุด (ใช้คู่กับ start_date)}
    calls:
      - id: ch
        method: GET
        path: /api/ai/read/member-credit-history/{service}
        query:
          username: "{input.username}"
          start_date: "{date:input.start_date}"
          end_date: "{date:input.end_date}"
          limit: "50"
        cache_ttl: 30
        schema: *wl_schema
    values:
      - {name: rows, from: ch, path: items}
      - {name: from_day, from: ch, path: start_date}
      - {name: to_day, from: ch, path: end_date}
      - {name: more, from: ch, path: truncated}
    not_found: {when: "empty(rows)", message: ไม่พบประวัติการจัดการเครดิตของสมาชิกนี้ในช่วงวันที่เลือก}
    card:
      title: ประวัติจัดการเครดิตของสมาชิก
      fields:
        - {label: ตั้งแต่วันที่, value: from_day, format: date}
        - {label: ถึงวันที่, value: to_day, format: date}
        - {label: มีรายการมากกว่าที่แสดง, value: more, format: bool, when: "more == true"}
      table:
        rows: rows
        max_rows: 50
        columns:
          - {label: เวลา, field: datetime, format: datetime}
          - {label: พนักงาน, field: operator_name}
          - {label: รายการ, field: action}
          - {label: จำนวน, field: change}
          - {label: รายละเอียด, field: detail}
      note: จากรายงานการทำงานของพนักงาน (ไม่ใช่สมุดบัญชีเครดิต) · การเติมเครดิตอัตโนมัติจากการฝากดูที่รายการฝาก
      link: {label: เปิดระบบจัดการเครดิตสมาชิก, path: "/Credit?service={service_b64}&web={service}"}
    model_context:
      - {name: has_more_rows, type: bool, expr: "more == true"}
      - {name: note, type: text, text: รายการและยอดแสดงในการ์ดแล้ว ห้ามพิมพ์ชื่อหรือตัวเลขเอง}
