# BQ-12 · host R15 POST /api/ai/read/profit-loss-range/:service (H4 · AIRequire any_of P019)
# body {start_date, end_date} บังคับทั้งคู่ · รวมปลาย · ≤ 62 วัน · end ≤ วันนี้ (เกิน = HTTP 400 → การ์ด "ดึงไม่ได้")
# BQ-13 · host R16 GET /api/ai/read/menus/:service (logged_in)
questions: [BQ-12]
tools:
  - name: profit_loss_range
    description: >-
      กำไรขาดทุนตามช่วงวันที่ (รวมทั้งช่วงและรายวัน) ตามรายงานกำไรขาดทุน — ยอดฝาก ยอดถอน โบนัส กำไร
      ไม่ใส่วันที่ = ตั้งแต่วันที่หนึ่งของเดือนนี้ถึงวันนี้ · ช่วงยาวได้ไม่เกินหกสิบสองวัน และวันสิ้นสุดต้องไม่เกินวันนี้
    questions: [BQ-12]
    permission: profit_loss
    freshness: summary
    input:
      from: {type: date, description: วันเริ่มต้น YYYY-MM-DD (ไม่ใส่ = วันแรกของเดือนนี้)}
      to: {type: date, description: วันสิ้นสุด YYYY-MM-DD (ไม่ใส่ = วันนี้ · ห่างจากวันเริ่มไม่เกินหกสิบสองวัน)}
    calls:
      - id: pl
        method: POST
        path: /api/ai/read/profit-loss-range/{service}
        body: {start_date: "{date:input.from|date:month_start}", end_date: "{date:input.to|date:today}"}
        cache_ttl: 60
        timeout_ms: 30000
        schema:
          type: object
          required: [start_date, end_date, rows, summary]
          properties:
            start_date: {type: string}
            end_date: {type: string}
            rows:
              type: array
              items:
                type: object
                required: [date, deposit, withdraw, bonus, profit]
                properties: {date: {type: string}, deposit: {type: number}, withdraw: {type: number}, bonus: {type: number}, profit: {type: number}, source: {type: string}}
            summary:
              type: object
              required: [deposit, withdraw, bonus, profit, days_requested, days_with_data]
              properties:
                deposit: {type: number}
                withdraw: {type: number}
                bonus: {type: number}
                profit: {type: number}
                days_requested: {type: integer}
                days_with_data: {type: integer}
                days_from_snapshot: {type: integer}
                missing_dates: {type: array, items: {type: string}}
    values:
      - {name: from_day, from: pl, path: start_date}
      - {name: to_day, from: pl, path: end_date}
      - {name: rows, from: pl, path: rows}
      - {name: s_deposit, from: pl, path: summary.deposit}
      - {name: s_withdraw, from: pl, path: summary.withdraw}
      - {name: s_bonus, from: pl, path: summary.bonus}
      - {name: s_profit, from: pl, path: summary.profit}
      - {name: d_req, from: pl, path: summary.days_requested}
      - {name: d_data, from: pl, path: summary.days_with_data}
      - {name: d_snap, from: pl, path: summary.days_from_snapshot, default: 0}
      - {name: missing, from: pl, path: summary.missing_dates}
    not_found: {when: "d_data == 0", message: ไม่มีข้อมูลกำไรขาดทุนในช่วงวันที่เลือก (ไม่มีรายการเงินเข้าบัญชีเลย)}
    card:
      title: กำไรขาดทุนตามช่วงวันที่
      fields:
        - {label: ตั้งแต่วันที่, value: from_day, format: date}
        - {label: ถึงวันที่, value: to_day, format: date}
        - {label: ยอดฝากรวม, value: s_deposit, format: money, suffix: " บาท"}
        - {label: ยอดถอนรวม, value: s_withdraw, format: money, suffix: " บาท"}
        - {label: โบนัสรวม, value: s_bonus, format: money, suffix: " บาท"}
        - {label: กำไร (ฝาก - ถอน), value: s_profit, format: money, suffix: " บาท"}
        - {label: วันที่มีข้อมูล, value: d_data, format: int, suffix: " วัน"}
        - {label: จำนวนวันในช่วง, value: d_req, format: int, suffix: " วัน"}
        - {label: วันที่ใช้ข้อมูลที่บันทึกไว้แล้ว, value: d_snap, format: int, suffix: " วัน", when: "d_snap > 0"}
      table:
        rows: rows
        max_rows: 62
        columns:
          - {label: วันที่, field: date, format: date}
          - {label: ยอดฝาก, field: deposit, format: money}
          - {label: ยอดถอน, field: withdraw, format: money}
          - {label: โบนัส, field: bonus, format: money}
          - {label: กำไร, field: profit, format: money}
      note: ยอดฝาก = เงินเข้าบัญชีธนาคาร · กำไร = ยอดฝากลบยอดถอน ตามหน้ารายงานกำไรขาดทุน · วันที่ไม่มีเงินเข้าบัญชีเลยจะไม่มีแถว · ย้อนหลังเกินหนึ่งสัปดาห์มักเป็นข้อมูลที่บันทึกไว้แล้ว
      link: {label: เปิดรายงานกำไรขาดทุน, path: "/report?service={service_b64}&web={service}"}
    model_context:
      - {name: is_profitable, type: bool, expr: "s_profit > 0"}
      - {name: has_missing_days, type: bool, expr: "len(missing) > 0"}
      - {name: note, type: text, text: ยอดรวมและรายวันแสดงในการ์ดแล้ว}

  - name: menu_access_check
    description: >-
      ตรวจว่าเมนูหนึ่งเปิดใช้ในหลังบ้านนี้หรือไม่ และบัญชีของผู้ถามมีสิทธิ์เมนูนั้นหรือไม่ (อ่านสด)
      ใช้หลัง lookup_menu เมื่อผู้ใช้บอกว่าไม่เห็นเมนู · ส่งรหัสสิทธิ์ของเมนู (ดูได้จากคำอธิบายเมนูใน lookup_menu เช่น P001 หรือ M005)
    questions: [BQ-13]
    permission: logged_in
    freshness: summary
    input:
      code: {type: string, required: true, description: รหัสสิทธิ์ของเมนู เช่น P001 M005 CRM01, pattern: "^(P[0-9]{3}|M[0-9]{3,4}|CRM[0-9]{2})$"}
    calls:
      - id: mn
        method: GET
        path: /api/ai/read/menus/{service}
        cache_ttl: 30
        schema:
          type: object
          required: [submenu, mainmenu]
          properties:
            submenu: &menu_block
              type: object
              required: [found, codes, user]
              properties:
                found: {type: boolean}
                codes: {type: array, items: {type: string}}
                user:
                  type: array
                  items: {type: object, required: [code, active], properties: {code: {type: string}, active: {type: boolean}, view: {type: boolean, nullable: true}}}
            mainmenu: *menu_block
            permissions_source: {type: string}
    values:
      - {name: menu_code, expr: "input.code"}
      - {name: sub_codes, from: mn, path: submenu.codes}
      - {name: main_codes, from: mn, path: mainmenu.codes}
      - {name: enabled, expr: "contains(sub_codes, input.code) || contains(main_codes, input.code)"}
      - {name: mine_sub, from: mn, path: submenu.user, filter: "item.code == input.code && item.active"}
      - {name: mine_main, from: mn, path: mainmenu.user, filter: "item.code == input.code && item.active"}
      - {name: has_access, expr: "count(mine_sub) > 0 || count(mine_main) > 0"}
      - {name: view_flag, from: mn, path: submenu.user, filter: "item.code == input.code && item.active", agg: first, field: view}
    card:
      title: ตรวจสิทธิ์เมนู
      fields:
        - {label: รหัสเมนู, value: menu_code}
        - {label: เปิดใช้ในหลังบ้านนี้, value: enabled, format: bool}
        - {label: บัญชีของคุณมีสิทธิ์เมนูนี้, value: has_access, format: bool}
        - {label: มีสิทธิ์ดู (ใช้กับเมนูบริการเสริม), value: view_flag, format: bool, when: "view_flag != null"}
      note: เมนูจะแสดงเมื่อเปิดใช้ในหลังบ้านนี้และบัญชีมีสิทธิ์ · เมนูกลุ่มบริการเสริมต้องมีสิทธิ์ดูด้วย · ถ้าไม่มีสิทธิ์ให้หัวหน้าเปิดในเมนูตั้งค่าสิทธิ์การใช้งาน
      link: {label: กลับหน้าแรกหลังบ้าน, path: "/"}
    model_context:
      - {name: menu_enabled, type: bool, expr: "enabled"}
      - {name: user_has_access, type: bool, expr: "has_access"}
      - {name: view_blocked, type: bool, expr: "view_flag == false"}
