# BQ-05 / BQ-07 / BQ-09 / BQ-47 · host R9 member · R10 member-credit · R11 member-count (P006) · R12 bank-pending-summary (P061)
questions: [BQ-05]
tools:
  - name: member_info
    description: >-
      ข้อมูลสมาชิกรายคนจากยูสเซอร์เนมหรือเบอร์โทรที่ใช้สมัคร: วันสมัคร สถานะบัญชี ฝากเงินแล้วหรือยัง ฝากล่าสุด รับโบนัส
      และบัญชีธนาคาร (ไม่มีเครดิต — ถามเครดิตให้ใช้ member_credit)
    questions: [BQ-05]
    permission: member
    freshness: summary
    input:
      username: {type: string, required: true, description: ยูสเซอร์เนม หรือ เบอร์โทรที่ใช้สมัคร (ตรงตัว), pattern: "^[A-Za-z0-9_.@-]{2,64}$"}
    calls:
      - id: m
        method: GET
        path: /api/ai/read/member/{service}
        query: {username: "{input.username}"}
        cache_ttl: 30
        not_found_codes: [404]
        schema:
          type: object
          required: [member]
          properties:
            matched_by: {type: string}
            member:
              type: object
              required: [username, date_regis, active, topup_status, is_bonus, bank_list, bank_count, bank_approved_count]
              properties:
                username: {type: string}
                date_regis: {type: string}
                active: {type: integer}
                topup_status: {type: integer}
                user_type: {type: string}
                rank: {type: integer}
                is_bonus: {type: integer}
                point: {type: number}
                last_deposit: {type: string}
                tags: {type: array, items: {type: string}}
                bank_count: {type: integer}
                bank_approved_count: {type: integer}
                bank_list:
                  type: array
                  items:
                    type: object
                    required: [bank_code, account_last4, approved]
                    properties: {bank_code: {type: string}, account_last4: {type: string}, approved: {type: boolean}, status: {type: integer}, active: {type: integer}, verify_status: {type: string}}
    values:
      - {name: user, from: m, path: member.username}
      - {name: regis, from: m, path: member.date_regis}
      - {name: acc_status, from: m, path: member.active}
      - {name: topup, from: m, path: member.topup_status}
      - {name: last_dep, from: m, path: member.last_deposit}
      - {name: bonus_on, from: m, path: member.is_bonus}
      - {name: points, from: m, path: member.point}
      - {name: banks, from: m, path: member.bank_list}
      - {name: bank_total, from: m, path: member.bank_count}
      - {name: bank_ok, from: m, path: member.bank_approved_count}
      - {name: matched, from: m, path: matched_by}
    card:
      title: ข้อมูลสมาชิก
      fields:
        - {label: ยูสเซอร์เนม, value: user}
        - {label: วันที่สมัคร, value: regis, format: datetime}
        - {label: สถานะ, value: acc_status, format: "status:member_active"}
        - {label: ลูกค้าฝากเงินแล้ว, value: topup, format: bool}
        - {label: ฝากล่าสุด, value: last_dep, format: datetime, when: "!empty(last_dep)"}
        - {label: รับโบนัส, value: bonus_on, format: bool}
        - {label: แต้ม, value: points, format: number}
        - {label: บัญชีธนาคาร, value: bank_total, format: int, suffix: " บัญชี"}
        - {label: บัญชีที่อนุมัติแล้ว, value: bank_ok, format: int, suffix: " บัญชี"}
      table:
        rows: banks
        columns:
          - {label: ธนาคาร, field: bank_code}
          - {label: เลขบัญชีท้าย, field: account_last4}
          - {label: อนุมัติแล้ว, field: approved, format: bool}
          - {label: บัญชีหลัก, field: active, format: bool}
          - {label: ผลตรวจบัญชี, field: verify_status}
      note: ข้อมูลนี้ไม่มีเครดิตคงเหลือและเวลาออนไลน์ล่าสุด · ค้นด้วยยูสเซอร์เนมก่อน ไม่พบจึงค้นด้วยเบอร์โทร
      link: {label: เปิดรายการสมาชิก, path: "/Member?service={service_b64}&web={service}"}
    model_context:
      - {name: has_deposited, type: bool, expr: "topup != 0"}
      - {name: is_blocked, type: bool, expr: "acc_status == 99"}
      - {name: is_verified, type: bool, expr: "acc_status == 1"}
      - {name: has_pending_bank, type: bool, expr: "bank_ok < bank_total"}
      - {name: found_by_phone, type: bool, expr: "matched == 'phone_number'"}

  - name: member_credit
    description: >-
      เครดิตคงเหลือของสมาชิกรายคน ดึงสดจากระบบเกม (ไม่แคช) — เครดิตเกม หรือกระเป๋าเงินสด
      ทุกครั้งที่เช็คจะถูกบันทึกในรายงานการทำงานของพนักงานเหมือนกดเช็คเครดิตเอง
    questions: [BQ-47]
    permission: member
    freshness: live
    input:
      username: {type: string, required: true, description: ยูสเซอร์เนม หรือ เบอร์โทรที่ใช้สมัคร (ตรงตัว), pattern: "^[A-Za-z0-9_.@-]{2,64}$"}
      wallet: {type: string, description: "ชนิดเครดิต: 1001 = เครดิตเกม (ค่าเริ่มต้น) · 1003 = กระเป๋าเงินสด", enum: ["1001", "1003"]}
    calls:
      - id: cr
        method: GET
        path: /api/ai/read/member-credit/{service}
        query: {username: "{input.username}", asset_code: "{input.wallet}"}
        cache_ttl: 0
        timeout_ms: 10000
        not_found_codes: [404]
        schema:
          type: object
          required: [username, asset_code, current_credit]
          properties:
            username: {type: string}
            asset_code: {type: string}
            current_credit: {type: number, nullable: true}
            wallets: {type: object, nullable: true}
            source: {type: string}
    values:
      - {name: user, from: cr, path: username}
      - {name: credit, from: cr, path: current_credit}
      - {name: w_wallet, from: cr, path: wallets.WALLET}
      - {name: w_abatech, from: cr, path: wallets.ABATECH}
      - {name: w_ufabet, from: cr, path: wallets.UFABET}
      - {name: asset, from: cr, path: asset_code}
    card:
      title: เครดิตสมาชิก (ดึงสด)
      fields:
        - {label: ยูสเซอร์เนม, value: user}
        - {label: เครดิตคงเหลือ, value: credit, format: money, suffix: " บาท"}
        - {label: กระเป๋า WALLET, value: w_wallet, format: money, suffix: " บาท", when: "w_wallet != null"}
        - {label: กระเป๋า ABATECH, value: w_abatech, format: money, suffix: " บาท", when: "w_abatech != null"}
        - {label: กระเป๋า UFABET, value: w_ufabet, format: money, suffix: " บาท", when: "w_ufabet != null"}
      note: ดึงสดจากระบบเกม · ขีด (—) = ระบบเกมไม่ส่งยอดมา ไม่ใช่ศูนย์ · การเช็คนี้ถูกบันทึกในรายงานการทำงานว่าเช็คผ่านผู้ช่วย
      link: {label: เปิดระบบจัดการเครดิตสมาชิก (แท็บเช็คเครดิต), path: "/Credit?service={service_b64}&web={service}"}
    model_context:
      - {name: credit_known, type: bool, expr: "credit != null"}
      - {name: is_cash_wallet, type: bool, expr: "asset == '1003'"}
      - {name: note, type: text, text: ยอดเครดิตแสดงในการ์ดแล้ว ห้ามพิมพ์ยอดเอง}

  - name: member_new_count
    description: จำนวนสมาชิกใหม่ของวันที่เลือก (ค่าเริ่มต้นวันนี้) และจำนวนสมาชิกทั้งหมด
    questions: [BQ-07]
    permission: member
    freshness: summary
    input:
      date: {type: date, description: วันที่ต้องการดู ไม่ใส่ = วันนี้}
    calls:
      - id: cnt
        method: GET
        path: /api/ai/read/member-count/{service}
        query: {date: "{date:input.date|date:today}"}
        cache_ttl: 60
        schema:
          type: object
          required: [date, new_members, total_members]
          properties: {date: {type: string}, new_members: {type: integer}, total_members: {type: integer}}
    values:
      - {name: day, from: cnt, path: date}
      - {name: new_count, from: cnt, path: new_members}
      - {name: all_count, from: cnt, path: total_members}
    card:
      title: สมาชิกใหม่
      fields:
        - {label: วันที่, value: day, format: date}
        - {label: สมาชิกใหม่, value: new_count, format: int, suffix: " คน"}
        - {label: สมาชิกทั้งหมด, value: all_count, format: int, suffix: " คน"}
      note: นับตามวันสมัครเวลาไทย · ไม่รวมจำนวนคนออนไลน์ (ดูแท็บจำนวนคนออนไลน์ในรายงานภาพรวม)
      link: {label: เปิดรายการสมาชิก, path: "/Member?service={service_b64}&web={service}"}
    model_context:
      - {name: has_new_members, type: bool, expr: "new_count > 0"}

  - name: bank_pending_summary
    description: จำนวนบัญชีธนาคารของสมาชิกที่รอตรวจสอบ แยกตามผลตรวจ (เหมือนหน้า รายการสมาชิกที่รอตรวจสอบ)
    questions: [BQ-09]
    permission: bank_pending
    freshness: summary
    calls:
      - id: bp
        method: GET
        path: /api/ai/read/bank-pending-summary/{service}
        cache_ttl: 60
        schema:
          type: object
          required: [total_accounts, members, breakdown]
          properties:
            total_accounts: {type: integer}
            members: {type: integer}
            by_verify_status: {type: object}
            breakdown:
              type: array
              items: {type: object, required: [verify_status, count, members], properties: {verify_status: {type: string}, count: {type: integer}, members: {type: integer}}}
    values:
      - {name: acc_total, from: bp, path: total_accounts}
      - {name: people, from: bp, path: members}
      - {name: rows, from: bp, path: breakdown}
    not_found: {when: "acc_total == 0", message: ไม่มีบัญชีธนาคารของสมาชิกที่รอตรวจสอบ}
    card:
      title: บัญชีสมาชิกที่รอตรวจสอบ
      fields:
        - {label: รายการบัญชีรอตรวจสอบ, value: acc_total, format: int, suffix: " รายการ"}
        - {label: จำนวนสมาชิก, value: people, format: int, suffix: " คน"}
      table:
        rows: rows
        columns:
          - {label: ผลตรวจบัญชี, field: verify_status}
          - {label: จำนวนบัญชี, field: count, format: int, suffix: " รายการ"}
          - {label: จำนวนสมาชิก, field: members, format: int, suffix: " คน"}
      note: นับบัญชีที่ยังไม่อนุมัติ ไม่รวมสมาชิกที่ถูกปิดกั้น
      link: {label: เปิดรายการสมาชิกที่รอตรวจสอบ, path: "/Member/BankPending?service={service_b64}&web={service}"}
    model_context:
      - {name: has_pending, type: bool, expr: "acc_total > 0"}
