# BQ-03 / BQ-04 / BQ-06 (ถอน) · host R5 withdraw-status-summary · R6 withdraw-oldest-pending
#   R7 withdraw-list · R8 withdraw-by-id (AIRequire any_of P004)
questions: [BQ-03]
tools:
  - name: withdraw_pending_by_status
    description: >-
      รายการถอนที่ยังไม่สำเร็จ แยกตามสถานะ พร้อมจำนวนและยอดรวม ของวันที่เลือกหรือช่วงวันที่ (ไม่เกินสามสิบเอ็ดวัน)
      ใช้เมื่อถามว่ามีถอนค้างกี่รายการ ค้างสถานะอะไรบ้าง
    questions: [BQ-03]
    permission: withdraw
    freshness: summary
    input:
      date: {type: date, description: วันที่ต้องการดู ไม่ใส่ = วันนี้}
      start_date: {type: date, description: วันเริ่มต้น (ใช้คู่กับ end_date เมื่อถามเป็นช่วง)}
      end_date: {type: date, description: วันสิ้นสุด (ใช้คู่กับ start_date)}
    calls:
      - id: sum
        method: GET
        path: /api/ai/read/withdraw-status-summary/{service}
        query:
          date: "{date:input.date|date:today}"
          start_date: "{date:input.start_date}"
          end_date: "{date:input.end_date}"
        cache_ttl: 60
        schema:
          type: object
          required: [start_date, end_date, by_status, totals, p2p_remain_count]
          properties:
            start_date: {type: string}
            end_date: {type: string}
            by_status:
              type: array
              items:
                type: object
                required: [status, count, amount, closed]
                properties: {status: {type: integer}, count: {type: integer}, amount: {type: number}, closed: {type: boolean}, known: {type: boolean}}
            totals:
              type: object
              required: [all, not_success, open]
              properties:
                all: &cnt_amt {type: object, required: [count, amount], properties: {count: {type: integer}, amount: {type: number}}}
                not_success: *cnt_amt
                open: *cnt_amt
            p2p_remain_count: {type: integer}
    values:
      - {name: rows, from: sum, path: by_status, filter: "item.status != 1 && item.count > 0", sort_by: count, order: desc}
      - {name: known_rows, from: sum, path: by_status, filter: "item.status != 1 && item.count > 0 && item.known", sort_by: count, order: desc}
      - {name: unknown_rows, from: sum, path: by_status, filter: "item.count > 0 && !item.known"}
      - {name: from_day, from: sum, path: start_date}
      - {name: to_day, from: sum, path: end_date}
      - {name: not_ok_count, from: sum, path: totals.not_success.count}
      - {name: not_ok_amount, from: sum, path: totals.not_success.amount}
      - {name: open_count, from: sum, path: totals.open.count}
      - {name: open_amount, from: sum, path: totals.open.amount}
      - {name: all_count, from: sum, path: totals.all.count}
      - {name: p2p_left, from: sum, path: p2p_remain_count}
    not_found: {when: "not_ok_count == 0 && p2p_left == 0", message: ไม่มีรายการถอนที่ยังไม่สำเร็จในช่วงวันที่เลือก}
    card:
      title: รายการถอนที่ยังไม่สำเร็จ
      fields:
        - {label: ตั้งแต่วันที่, value: from_day, format: date}
        - {label: ถึงวันที่, value: to_day, format: date}
        - {label: ยังไม่จบ (ต้องติดตาม), value: open_count, format: int, suffix: " รายการ"}
        - {label: ยอดที่ยังไม่จบ, value: open_amount, format: money, suffix: " บาท"}
        - {label: ไม่สำเร็จทั้งหมด (รวมยกเลิก/ซ่อน), value: not_ok_count, format: int, suffix: " รายการ"}
        - {label: ยอดไม่สำเร็จทั้งหมด, value: not_ok_amount, format: money, suffix: " บาท"}
        - {label: รายการถอนทั้งหมด, value: all_count, format: int, suffix: " รายการ"}
        - {label: ถอน P2P ที่ยังมียอดเหลือต้องจัดการ, value: p2p_left, format: int, suffix: " รายการ", when: "p2p_left > 0"}
      table:
        rows: rows
        columns:
          - {label: สถานะ, field: status, format: "status:withdraw"}
          - {label: จำนวน, field: count, format: int, suffix: " รายการ"}
          - {label: ยอดรวม, field: amount, format: money}
      note: ยังไม่จบ = ไม่ใช่ สำเร็จ ยกเลิก หรือ ถูกซ่อน · วันตามเวลาไทย
      link: {label: เปิดรายการถอน, path: "/Withdraw?service={service_b64}&web={service}"}
    model_context:
      - {name: has_open, type: bool, expr: "open_count > 0"}
      - {name: has_p2p_remainder, type: bool, expr: "p2p_left > 0"}
      - {name: statuses, type: labels, from: known_rows, pluck: status, format: "status:withdraw"}
      - {name: has_unknown_status, type: bool, expr: "count(unknown_rows) > 0"}

  - name: withdraw_oldest_pending
    description: >-
      รายการถอนที่ค้างนานที่สุด (ยังไม่สำเร็จ ไม่ถูกยกเลิก ไม่ถูกซ่อน) เรียงจากเก่าสุด ดูย้อนหลังได้ไม่เกินสามสิบเอ็ดวัน (ค่าเริ่มต้นเจ็ดวัน)
    questions: [BQ-04]
    permission: withdraw
    freshness: summary
    input:
      days: {type: integer, description: จำนวนวันย้อนหลังที่ดู รวมวันนี้ (ค่าเริ่มต้นเจ็ด), min: 1, max: 31}
    calls:
      - id: old
        method: GET
        path: /api/ai/read/withdraw-oldest-pending/{service}
        query: {days: "{input.days}", limit: "10"}
        cache_ttl: 30
        schema:
          type: object
          required: [window, items, pending_count]
          properties:
            window: {type: object, required: [start_date, end_date], properties: {days: {type: integer}, start_date: {type: string}, end_date: {type: string}}}
            pending_count: {type: integer}
            pending_count_capped: {type: boolean}
            items:
              type: array
              items: &wd_item
                type: object
                required: [id, datetime, username, amount, status, operator_name]
                properties:
                  id: {type: string}
                  datetime: {type: string}
                  update_time: {type: string}
                  username: {type: string}
                  amount: {type: number}
                  status: {type: integer}
                  channel: {type: string}
                  operator_name: {type: string}
                  comment: {type: string}
                  is_peer_to_peer: {type: boolean}
                  age_minutes: {type: integer}
    values:
      - {name: rows, from: old, path: items}
      - {name: known_rows, from: old, path: items, filter: "item.status >= 1 && item.status <= 16"}
      - {name: pending_total, from: old, path: pending_count}
      - {name: from_day, from: old, path: window.start_date}
      - {name: to_day, from: old, path: window.end_date}
    not_found: {when: "empty(rows)", message: ไม่มีรายการถอนค้างในช่วงวันที่ดู}
    card:
      title: รายการถอนที่ค้างนานที่สุด
      fields:
        - {label: ช่วงที่ดู ตั้งแต่, value: from_day, format: date}
        - {label: ถึง, value: to_day, format: date}
        - {label: ค้างทั้งหมดในช่วงนี้, value: pending_total, format: int, suffix: " รายการ"}
      table:
        rows: rows
        columns:
          - {label: เวลาแจ้งถอน, field: datetime, format: datetime}
          - {label: ยูสเซอร์เนม, field: username}
          - {label: ยอด, field: amount, format: money}
          - {label: สถานะ, field: status, format: "status:withdraw"}
          - {label: ค้างมาแล้ว, field: age_minutes, format: int, suffix: " นาที"}
      note: รายการที่เก่ากว่าช่วงที่ดูจะไม่ถูกนับ
      link: {label: เปิดรายการถอน, path: "/Withdraw?service={service_b64}&web={service}"}
    model_context:
      - {name: statuses, type: labels, from: known_rows, pluck: status, format: "status:withdraw"}
      - {name: note, type: text, text: รายการและเวลาที่ค้างแสดงในการ์ดแล้ว}

  - name: withdraw_find
    description: >-
      ค้นรายการถอนของวัน กรองด้วยยูสเซอร์เนมหรือสถานะได้ ใช้หารายการถอนของสมาชิก หรือดูว่ารายการถอนสถานะอะไร ใครทำรายการ
    questions: [BQ-06]
    permission: withdraw
    freshness: summary
    input:
      username: {type: string, description: ยูสเซอร์เนมของสมาชิก (ตรงตัว), pattern: "^[A-Za-z0-9_.@-]{2,64}$"}
      date: {type: date, description: วันที่ของรายการ ไม่ใส่ = วันนี้}
      status: {type: integer, description: รหัสสถานะรายการถอน ถ้าต้องการกรอง, min: 0, max: 99}
    calls:
      - id: list
        method: GET
        path: /api/ai/read/withdraw-list/{service}
        query: {date: "{date:input.date|date:today}", username: "{input.username}", status: "{input.status}", limit: "20"}
        cache_ttl: 30
        schema:
          type: object
          required: [date, items, count]
          properties:
            date: {type: string}
            count: {type: integer}
            items: {type: array, items: *wd_item}
    values:
      - {name: rows, from: list, path: items}
      - {name: known_rows, from: list, path: items, filter: "item.status >= 1 && item.status <= 16"}
      - {name: total_count, from: list, path: count}
      - {name: day, from: list, path: date}
    not_found: {when: "empty(rows)", message: ไม่พบรายการถอนตามเงื่อนไขในวันที่เลือก}
    card:
      title: รายการถอน
      fields:
        - {label: วันที่, value: day, format: date}
        - {label: จำนวนที่พบ, value: total_count, format: int, suffix: " รายการ"}
      table:
        rows: rows
        max_rows: 20
        columns:
          - {label: เวลา, field: datetime, format: datetime}
          - {label: ยูสเซอร์เนม, field: username}
          - {label: ยอด, field: amount, format: money}
          - {label: สถานะ, field: status, format: "status:withdraw"}
          - {label: ผู้ทำรายการ, field: operator_name}
      note: ผู้ทำรายการว่าง = ระบบทำรายการอัตโนมัติ · แสดงล่าสุดก่อน สูงสุดยี่สิบรายการ
      link: {label: เปิดรายการถอน, path: "/Withdraw?service={service_b64}&web={service}"}
    model_context:
      - {name: statuses_found, type: labels, from: known_rows, pluck: status, format: "status:withdraw"}

  - name: withdraw_by_id
    description: รายละเอียดรายการถอน 1 รายการจากรหัสรายการ (id) — สถานะ ยอด ผู้ทำรายการ และลำดับการดำเนินการ
    questions: [BQ-06]
    permission: withdraw
    freshness: summary
    input:
      id: {type: string, required: true, description: รหัสรายการถอน (ObjectID ยาวยี่สิบสี่ตัว), pattern: "^[0-9a-fA-F]{24}$"}
    calls:
      - id: one
        method: GET
        path: /api/ai/read/withdraw-by-id/{service}
        query: {id: "{input.id}"}
        cache_ttl: 15
        not_found_codes: [404]
        schema:
          type: object
          required: [item]
          properties:
            item:
              type: object
              required: [id, datetime, username, amount, status, operator_name, timeline]
              properties:
                id: {type: string}
                datetime: {type: string}
                username: {type: string}
                amount: {type: number}
                status: {type: integer}
                operator_name: {type: string}
                comment: {type: string}
                manual_override_by: {type: string}
                timeline:
                  type: array
                  items: {type: object, required: [datetime, status], properties: {datetime: {type: string}, operator_name: {type: string}, status: {type: integer}, action: {type: string}, comment: {type: string}}}
    values:
      - {name: when, from: one, path: item.datetime}
      - {name: user, from: one, path: item.username}
      - {name: amt, from: one, path: item.amount}
      - {name: st, from: one, path: item.status}
      - {name: operator, from: one, path: item.operator_name}
      - {name: remark, from: one, path: item.comment}
      - {name: override_by, from: one, path: item.manual_override_by}
      - {name: steps, from: one, path: item.timeline}
      - {name: known_steps, from: one, path: item.timeline, filter: "item.status >= 1 && item.status <= 16"}
    card:
      title: รายละเอียดรายการถอน
      fields:
        - {label: เวลาแจ้งถอน, value: when, format: datetime}
        - {label: ยูสเซอร์เนม, value: user}
        - {label: ยอดถอน, value: amt, format: money, suffix: " บาท"}
        - {label: สถานะ, value: st, format: "status:withdraw"}
        - {label: ผู้ทำรายการ, value: operator, when: "!empty(operator)"}
        - {label: ปรับสถานะเองโดย, value: override_by, when: "!empty(override_by)"}
        - {label: หมายเหตุ, value: remark, when: "!empty(remark)"}
      table:
        rows: steps
        columns:
          - {label: เวลา, field: datetime, format: datetime}
          - {label: ผู้ดำเนินการ, field: operator_name}
          - {label: สถานะ, field: status, format: "status:withdraw"}
          - {label: การดำเนินการ, field: action}
          - {label: หมายเหตุ, field: comment}
      note: ไม่มีผู้ทำรายการ = ระบบทำรายการอัตโนมัติ · ข้อมูลนี้ไม่มี IP (ดูประวัติเข้าสู่ระบบของพนักงานที่เมนูจัดการพนักงาน)
      link: {label: เปิดรายการถอน, path: "/Withdraw?service={service_b64}&web={service}"}
    model_context:
      - {name: timeline_statuses, type: labels, from: known_steps, pluck: status, format: "status:withdraw"}
      - {name: is_success, type: bool, expr: "st == 1"}
      - {name: is_closed, type: bool, expr: "in(st, 1, 4, 11)"}
      - {name: done_by_system, type: bool, expr: "empty(operator)"}
      - {name: note, type: text, text: สถานะปัจจุบันแสดงในการ์ดแล้ว ถ้าผู้ใช้ถามว่าต้องทำอะไรต่อให้ใช้ตารางสถานะรายการถอน}
