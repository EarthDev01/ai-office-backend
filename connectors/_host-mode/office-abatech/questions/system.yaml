# BQ-41 · host R19 agent-balance (logged_in · reload=1 = รีเฟรชจาก gateway + upsert snapshot · D-89)
# BQ-42 · host R20 sms-balance (logged_in · สด)
# BQ-44 · host R21 bills (min_level 7 · สด)
questions: [BQ-41]
tools:
  - name: system_credit_balance
    description: เครดิตระบบ (Agent Credit) คงเหลือของเว็บนี้ รีเฟรชจากผู้ให้บริการก่อนอ่านทุกครั้ง (ไม่แคช)
    questions: [BQ-41]
    permission: logged_in
    freshness: live
    calls:
      - id: ag
        method: GET
        path: /api/ai/read/agent-balance/{service}
        query: {reload: "1"}
        cache_ttl: 0
        timeout_ms: 12000
        schema:
          type: object
          required: [found, reload]
          properties:
            found: {type: boolean}
            amount: {type: number}
            unit: {type: string}
            name: {type: string}
            updated_at: {type: integer}
            reload:
              type: object
              required: [requested]
              properties: {requested: {type: boolean}, ok: {type: boolean}, error: {type: string}, skipped: {type: string}}
    values:
      - {name: has_snapshot, from: ag, path: found}
      - {name: balance, from: ag, path: amount}
      - {name: unit, from: ag, path: unit}
      - {name: updated, from: ag, path: updated_at}
      - {name: refreshed, from: ag, path: reload.ok}
    not_found: {when: "!has_snapshot", message: ยังไม่มีข้อมูลเครดิตระบบของเว็บนี้ (ยังรีเฟรชจากผู้ให้บริการไม่สำเร็จ) ห้ามถือว่าเป็นศูนย์}
    card:
      title: เครดิตระบบ (Agent Credit)
      fields:
        - {label: เครดิตระบบคงเหลือ, value: balance, format: money}
        - {label: หน่วย, value: unit, when: "!empty(unit)"}
        - {label: อัปเดตจากผู้ให้บริการเมื่อ, value: updated, format: datetime, when: "updated != null && updated > 0"}
        - {label: รีเฟรชยอดล่าสุดสำเร็จ, value: refreshed, format: bool}
      note: ถ้ารีเฟรชไม่สำเร็จ ยอดนี้คือค่าที่บันทึกไว้ครั้งล่าสุด · ถ้าเครดิตระบบหมดจะทำรายการฝากถอนไม่ได้ ให้แจ้งทีม support เพื่อเติม
      link: {label: เปิดรายงานภาพรวม (แท็บเครดิตคงเหลือในระบบ), path: "/DashboardOnce?service={service_b64}&web={service}"}
    model_context:
      - {name: refresh_ok, type: bool, expr: "refreshed == true"}
      - {name: note, type: text, text: ยอดเครดิตระบบแสดงในการ์ดแล้ว การเติมเครดิตระบบต้องติดต่อทีม support}

  - name: sms_credit_balance
    description: เครดิต SMS คงเหลือของเว็บนี้ ดึงสดจากผู้ให้บริการ SMS (ไม่แคช)
    questions: [BQ-42]
    permission: logged_in
    freshness: live
    calls:
      - id: sms
        method: GET
        path: /api/ai/read/sms-balance/{service}
        cache_ttl: 0
        schema:
          type: object
          required: [configured, balance]
          properties:
            provider: {type: string}
            configured: {type: boolean}
            provider_code: {type: integer}
            balance: {type: number, nullable: true}
    values:
      - {name: configured, from: sms, path: configured}
      - {name: sms_balance, from: sms, path: balance}
      - {name: provider, from: sms, path: provider}
    not_found: {when: "!configured", message: เว็บนี้ยังไม่ได้ตั้งค่าบริการ SMS}
    card:
      title: เครดิต SMS
      fields:
        - {label: SMS Credit คงเหลือ, value: sms_balance, format: number}
        - {label: ผู้ให้บริการ, value: provider, when: "!empty(provider)"}
      note: หน่วยเป็นเครดิตของผู้ให้บริการ SMS (ไม่ใช่จำนวนข้อความโดยตรง) · ขีด (—) = ผู้ให้บริการตอบกลับผิดปกติ ยังไม่รู้ยอด
      link: {label: เปิดรายงานภาพรวม, path: "/DashboardOnce?service={service_b64}&web={service}"}
    model_context:
      - {name: balance_known, type: bool, expr: "sms_balance != null"}

  - name: bills_outstanding
    description: บิลค่าใช้จ่ายระบบของเว็บนี้ที่ยังค้าง (รอจ่าย หรือ ค้างชำระ) พร้อมเลขที่บิล ยอด และวันครบกำหนด ดึงสด
    questions: [BQ-44]
    permission: bills
    freshness: live
    calls:
      - id: bl
        method: GET
        path: /api/ai/read/bills/{service}
        cache_ttl: 0
        schema:
          type: object
          required: [items, count, outstanding_count]
          properties:
            count: {type: integer}
            outstanding_count: {type: integer}
            items:
              type: array
              items:
                type: object
                required: [billpayment_id, title, total, end_date, status]
                properties:
                  billpayment_id: {type: [string, number], nullable: true}
                  title: {type: string, nullable: true}
                  billpayment_name: {type: string, nullable: true}
                  total: {type: number, nullable: true}
                  end_date: {type: string, nullable: true}
                  status: {type: number, nullable: true}
    values:
      - {name: rows, from: bl, path: items, filter: "in(item.status, 3, 5)"}
      - {name: all_bills, from: bl, path: count}
      - {name: owe_count, from: bl, path: outstanding_count}
      - {name: owe_total, from: bl, path: items, filter: "in(item.status, 3, 5)", agg: sum, field: total}
    not_found: {when: "all_bills == 0", message: ไม่มีบิลค่าใช้จ่ายระบบของเว็บนี้}
    card:
      title: บิลค่าใช้จ่ายระบบที่ค้าง
      fields:
        - {label: บิลที่ค้าง (รอจ่าย/ค้างชำระ), value: owe_count, format: int, suffix: " ใบ"}
        - {label: ยอดที่ค้างรวม, value: owe_total, format: money, suffix: " บาท", when: "owe_count > 0"}
        - {label: บิลทั้งหมด, value: all_bills, format: int, suffix: " ใบ"}
      table:
        rows: rows
        columns:
          - {label: เลขที่บิล, field: billpayment_id}
          - {label: รายการ, field: title}
          - {label: รอบบิล, field: billpayment_name}
          - {label: ยอด, field: total, format: money}
          - {label: ครบกำหนด, field: end_date, format: date}
          - {label: สถานะ, field: status, format: "status:bill"}
      note: ตามหน้าบิลค่าใช้จ่ายระบบ · วันครบกำหนดแสดงตามที่ระบบบิลส่งมา
      link: {label: เปิดบิลค่าใช้จ่ายระบบ, path: "/BillPayment"}
    model_context:
      - {name: has_outstanding, type: bool, expr: "owe_count > 0"}
      - {name: statuses, type: labels, from: rows, pluck: status, format: "status:bill"}
