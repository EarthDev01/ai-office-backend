# ตารางสถานะของ office-abatech (BQ-29) · host ส่งแค่เลข ความหมายอยู่ที่นี่
# ข้อความ meaning / next_action ห้ามมีตัวเลข (output guard ตัดตัวเลขที่โมเดลพูดซ้ำ)
unknown_message: >-
  สถานะนี้ยังไม่มีคำอธิบายในระบบผู้ช่วย ให้เปิดดูรายการนั้นในหน้าจอจริง หรือติดต่อทีม support เพื่อตรวจสอบ
tables:
  withdraw:
    label: สถานะรายการถอน
    # label ใช้ตามตารางที่แอดมินทำงานจริง (WithdrawStatementV2) · ชื่อจากจออื่นใส่ใน aliases
    source: >-
      office-abatech components/Withdraw/WithdrawStatementV2.vue:221-285 (label + ปุ่มจัดการในตาราง :229-278)
      · components/History/HistoryWithdraw.vue:89-103 · components/Withdraw/Withdrawinfo.vue:12-26,183-300
      · GOTOPOPOFFICE ai/read_withdraw.go (ปิดแล้ว = สำเร็จ ยกเลิก ถูกซ่อน) · appendix-abatech-auth.md §5.1
    questions: [BQ-29]
    entries:
      - code: 1
        label: สำเร็จ
        aliases: [โอนแล้ว, ต้องโอนเอง]
        meaning: รายการถอนสำเร็จแล้ว ถ้าเป็นการถอนแบบ PeerToPeer ที่ยังมียอดเหลือ หน้าจอจะขึ้นว่า ต้องโอนเอง
        next_action: ไม่ต้องทำอะไรต่อ ยกเว้นหน้าจอขึ้นว่า ต้องโอนเอง ให้ตรวจยอดคงเหลือแล้วจัดการในหน้ารายการถอน
        final: true
      - code: 2
        label: รอโอน
        aliases: [รอคิว]
        meaning: รายการรอคิวให้ระบบโอนเงินให้สมาชิก
        next_action: รอระบบโอน ถ้าค้างนานให้กดที่สถานะในหน้ารายการถอน แล้วเลือก ตกลง เพื่อให้ระบบโอนใหม่ หรือเปลี่ยนบัญชี หรือเปลี่ยนเป็นสำเร็จเมื่อโอนเองเรียบร้อยแล้ว
      - code: 3
        label: กำลังตรวจสอบ
        aliases: [รอตรวจสอบ, กำลังตรวจสอบ..]
        meaning: รายการรอแอดมินตรวจสอบก่อนโอนเงิน
        next_action: เปิดปุ่มตรวจสอบของรายการ เลือกบัญชีแล้วกด โอนเงิน หรือ โอนเงินอัตโนมัติ หรือกด ยกเลิก ถ้าไม่อนุมัติ ต้องมีสิทธิ์จัดการรายการถอน
      - code: 4
        label: ยกเลิก
        meaning: รายการถอนถูกยกเลิกแล้ว
        next_action: ไม่ต้องทำอะไรต่อ ถ้าตรวจพบว่าโอนเงินไปแล้วจริง ให้เปิดปุ่มตรวจสอบแล้วกด โอนเงินเรียบร้อย หรือกด ซ่อนรายการ
        final: true
      - code: 5
        label: ทำรายการอีกครั้ง
        meaning: รายการถูกสั่งให้ระบบโอนใหม่ และกำลังรอระบบทำรายการ
        next_action: รอระบบทำรายการ ถ้าค้างนานให้กดที่สถานะในหน้ารายการถอนเพื่อเลือกโอนใหม่ เปลี่ยนบัญชี หรือเปลี่ยนเป็นสำเร็จ
      - code: 6
        label: กำลังขอ OTP
        meaning: ระบบกำลังขอรหัส OTP จากธนาคารเพื่อโอนเงิน
        next_action: รอสักครู่ ถ้าค้างนานให้กดที่สถานะในหน้ารายการถอนเพื่อสั่งโอนใหม่หรือเปลี่ยนบัญชี
      - code: 7
        label: ขอ OTP สำเร็จ รอ OTP
        aliases: [ขอ OTP สำเร็จ]
        meaning: ธนาคารส่งรหัส OTP แล้ว ระบบกำลังรอรับรหัส
        next_action: รอระบบรับรหัส ถ้าค้างนานให้กดที่สถานะในหน้ารายการถอนเพื่อสั่งโอนใหม่หรือเปลี่ยนบัญชี
      - code: 8
        label: ขอ OTP ไม่สำเร็จ
        meaning: ระบบขอรหัส OTP จากธนาคารไม่สำเร็จ เงินยังไม่ถูกโอน
        next_action: กดที่สถานะในหน้ารายการถอนเพื่อสั่งโอนใหม่ หรือเปลี่ยนบัญชีโอน
      - code: 9
        label: ได้รับ OTP รอยืนยัน
        meaning: ระบบได้รับรหัส OTP แล้ว กำลังรอธนาคารยืนยันการโอน
        next_action: ตรวจสเตทเม้นธนาคารว่าเงินออกแล้วหรือยัง ถ้าออกแล้วกดที่สถานะในหน้ารายการถอนเพื่อปรับเป็นสำเร็จ
      - code: 10
        label: ไม่ได้รับ OTP
        aliases: [OTP ไม่ถูกต้อง]
        meaning: ระบบไม่ได้รับรหัส OTP หรือรหัสไม่ถูกต้อง เงินยังไม่ถูกโอน (หน้าจอบางหน้าเรียกสถานะนี้ว่า OTP ไม่ถูกต้อง)
        next_action: กดที่สถานะในหน้ารายการถอนเพื่อสั่งโอนใหม่ หรือเปลี่ยนบัญชีโอน
      - code: 11
        label: ถูกซ่อน
        meaning: รายการถูกซ่อนจากรายการถอนแล้ว
        next_action: ไม่ต้องทำอะไรต่อ
        final: true
      - code: 12
        label: เกิดข้อผิดพลาด
        meaning: การโอนเกิดข้อผิดพลาด
        next_action: ตรวจสเตทเม้นธนาคารก่อน แล้วกดที่สถานะในหน้ารายการถอนเพื่อสั่งโอนใหม่ เปลี่ยนบัญชี หรือยกเลิก ถ้าไม่แน่ใจให้ติดต่อทีม support
      - code: 13
        label: ตรวจสอบยอดธนาคาร
        aliases: [รบกวนตรวจสอบยอดที่ธนาคาร]
        meaning: ระบบไม่แน่ใจว่าเงินออกจากบัญชีแล้วหรือยัง ต้องให้แอดมินตรวจยอดที่ธนาคาร
        next_action: ตรวจสเตทเม้นธนาคารก่อน ถ้าเงินออกแล้วให้กดที่สถานะในหน้ารายการถอนเพื่อปรับเป็นสำเร็จ
      - code: 14
        label: ตัดเครดิตไม่สำเร็จ
        meaning: ระบบตัดเครดิตของสมาชิกไม่สำเร็จ จึงยังไม่โอนเงิน
        next_action: หน้ารายการถอนไม่มีปุ่มจัดการสถานะนี้ ให้ติดต่อทีม support เพื่อตรวจสอบ
      - code: 15
        label: ส่งรายการถอนสำเร็จ รอยืนยัน
        meaning: ส่งรายการถอนให้ระบบ Payment แล้ว กำลังรอผลยืนยัน
        next_action: ตรวจสเตทเม้นของ Payment ก่อน แล้วกดที่สถานะในหน้ารายการถอนเพื่อปรับเป็นสำเร็จหรือยกเลิกรายการ
      - code: 16
        label: ได้รับรายการถอน รอยืนยัน
        meaning: ระบบ Payment รับรายการถอนแล้ว กำลังรอยืนยันผล
        next_action: รอระบบ Payment ยืนยัน หน้ารายการถอนไม่มีปุ่มจัดการสถานะนี้ ถ้าค้างนานให้ติดต่อทีม support

  deposit:
    label: สถานะรายการเติมเครดิต (รายการฝาก)
    # หน้าจอแสดง ไม่สำเร็จ สำหรับทุกค่าที่ไม่ใช่สถานะด้านล่าง (fallback) · ความหมาย worker จาก Docs/go_deposit_mootui.md §5.4
    source: >-
      office-abatech components/Deposit/DepositStatementV2.vue:311-337 (label) + :689-765 (manageStatement / DeleteOutstanding)
      · components/History/HistoryDeposit.vue:115-119 · Docs/go_deposit_mootui.md §5.4 · appendix-abatech-auth.md §5.2
    questions: [BQ-29]
    entries:
      - code: 0
        label: ไม่สำเร็จ
        meaning: การเติมเครดิตไม่สำเร็จ เช่น ระบบเกมตอบกลับผิดพลาด (หน้าจอแสดงคำว่าไม่สำเร็จกับทุกสถานะที่ไม่รู้จักด้วย)
        next_action: กดที่สถานะในหน้ารายการฝาก แล้วเลือก ตกลง ให้ระบบเติมเครดิตใหม่ หรือ เพิ่มเครดิตไปแล้ว ถ้าเติมให้เองเรียบร้อยแล้ว
      - code: 1
        label: สำเร็จ
        meaning: เติมเครดิตให้สมาชิกเรียบร้อยแล้ว
        next_action: ไม่ต้องทำอะไรต่อ
        final: true
      - code: 2
        label: รอคิว
        meaning: สร้างรายการแล้ว กำลังรอระบบเติมเครดิต
        next_action: รอระบบเติมเครดิต ถ้าค้างนานให้กดที่สถานะในหน้ารายการฝาก แล้วเลือก ตกลง ให้ระบบเติมใหม่ หรือ เพิ่มเครดิตไปแล้ว ถ้าเติมให้เองแล้ว
      - code: 5
        label: ติดกิจกรรม
        meaning: สมาชิกยังมีเครดิตเหลือจากกิจกรรมหรือโบนัสเดิม ระบบจึงรอให้เครดิตเดิมลดลงก่อนแล้วค่อยเติมให้อัตโนมัติ
        next_action: รอระบบเติมให้อัตโนมัติ ถ้าต้องการเติมทันทีให้กดที่สถานะในหน้ารายการฝากเพื่อจัดการ
      - code: 6
        label: เครดิตค้าง
        meaning: สมาชิกมีเครดิตหรือเกมค้างอยู่ในระบบเกม ระบบจึงยังเติมเครดิตไม่ได้
        next_action: ให้สมาชิกเล่นเกมที่ค้างให้จบก่อน หรือกดที่สถานะในหน้ารายการฝากเพื่อเปิดหน้าต่างจัดการเครดิตค้าง

  bank_statement:
    label: สถานะรายการเงินเข้าบัญชีฝาก (สเตทเม้นธนาคาร)
    source: >-
      Docs/go_deposit_mootui.md §5.4 · GOTOPOPOFFICE ai/read_deposit.go (ตกค้าง = สถานะที่ไม่ใช่ ยังไม่ประมวลผล ประมวลผลแล้ว ซ่อน)
      · office-abatech components/Deposit/DepositRemain.vue (แท็บ รายการตกค้าง แสดง comment ของรายการ)
    questions: [BQ-29]
    entries:
      - {code: 0, label: ยังไม่ประมวลผล, meaning: รายการเงินเข้ายังไม่ถูกระบบจับคู่กับสมาชิก, next_action: รอระบบประมวลผล ถ้าค้างนานให้ติดต่อทีม support}
      - {code: 1, label: ประมวลผลแล้ว, meaning: ระบบจับคู่รายการเงินเข้ากับสมาชิกและสร้างรายการเติมเครดิตแล้ว, next_action: ไม่ต้องทำอะไรต่อ, final: true}
      - {code: 2, label: ตกค้าง, aliases: [ผิดพลาด, ไม่พบสมาชิก], meaning: ระบบจับคู่ไม่สำเร็จ เช่น ไม่พบสมาชิก บัญชีปิด หรือเช็คเครดิตไม่ได้ ดูสาเหตุในช่องหมายเหตุ, next_action: เปิดแท็บ รายการตกค้าง ในเมนูรายการฝาก ตรวจสาเหตุแล้วเลือกสมาชิกที่ถูกต้องเพื่อเติมเครดิต}
      - {code: 3, label: ตกค้างโปรโมชั่น, aliases: [โปรโมชั่นผิดพลาด], meaning: ระบบเติมไม่ได้เพราะปัญหาโปรโมชั่น เช่น สมาชิกยังไม่เลือกรับโบนัส, next_action: เปิดแท็บ รายการตกค้าง ในเมนูรายการฝาก ตรวจสาเหตุแล้วจัดการรายการ}
      - {code: 99, label: ซ่อน, aliases: [whitelist], meaning: รายการถูกซ่อนหรือเป็นบัญชีที่ระบบไม่ต้องดำเนินการ, next_action: ไม่ต้องทำอะไรต่อ, final: true}

  member_active:
    label: สถานะบัญชีสมาชิก
    source: office-abatech components/Member/MemberList.vue:160-171 (ค่าอื่นที่ไม่ใช่ยืนยันแล้วและปิดกั้น หน้าจอแสดง ยังไม่ยืนยันตัวตน)
    entries:
      - {code: 1, label: ยืนยันแล้ว, meaning: สมาชิกยืนยันตัวตนแล้ว ใช้งานได้ปกติ}
      - {code: 0, label: ยังไม่ยืนยันตัวตน, meaning: สมาชิกยังไม่ได้ยืนยันตัวตน, next_action: ตรวจข้อมูลและยืนยันได้ที่เมนูรายการสมาชิก}
      - {code: 99, label: ปิดกั้นการใช้งาน, meaning: บัญชีสมาชิกถูกปิดกั้นการใช้งาน, next_action: ถ้าต้องการเปิดใช้งานให้จัดการที่เมนูรายการสมาชิก ตามสิทธิ์ที่มี}

  bill:
    label: สถานะบิลค่าใช้จ่ายระบบ
    source: office-abatech components/billpayment/statuscard.vue:1-24 · GOTOPOPOFFICE ai/read_system.go (ค้างชำระ = รอจ่าย และ ค้างชำระ)
    entries:
      - {code: 1, label: ฉบับร่าง, meaning: บิลยังเป็นฉบับร่าง}
      - {code: 2, label: ยกเลิก, meaning: บิลถูกยกเลิก, final: true}
      - {code: 3, label: รอจ่าย, meaning: บิลออกแล้ว รอชำระ, next_action: เปิดหน้าบิลค่าใช้จ่ายระบบเพื่อดูรายละเอียดและชำระตามช่องทางในบิล}
      - {code: 4, label: จ่ายแล้ว - รอคอนเฟิร์ม, meaning: แจ้งชำระแล้ว รอผู้ให้บริการยืนยัน, next_action: รอการยืนยัน ถ้านานผิดปกติให้ติดต่อทีม support}
      - {code: 5, label: ค้างชำระ, meaning: บิลเลยกำหนดและยังไม่ได้ชำระ, next_action: รีบชำระตามรายละเอียดในหน้าบิลค่าใช้จ่ายระบบ หรือติดต่อทีม support}
      - {code: 6, label: สำเร็จ, meaning: ชำระบิลเรียบร้อยแล้ว, final: true}
