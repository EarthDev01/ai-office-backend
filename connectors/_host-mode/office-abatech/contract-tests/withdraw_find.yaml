# R7 GET /api/ai/read/withdraw-list/:service — catalog §6 R7
tool: withdraw_find
cases:
  - name: ค้นด้วยยูสเซอร์เนมและสถานะ
    input: {username: abc0812345678, status: 2}
    responses:
      list:
        body:
          code: 0
          payload:
            date: "2026-09-24"
            items:
              - {id: 66f2c3d4e5f60718293a4b5c, datetime: "2026-09-24T10:00:00+07:00", update_time: "", username: abc0812345678, amount: 2500, status: 2, channel: AUTO, operator_name: "", comment: "", is_checked: 0, is_peer_to_peer: false, actual_amount: 0, remain_amount: 0, remainder_status: "", withdraw_mode: "", manual_override_status: 0, age_minutes: 272}
            count: 1
            count_capped: false
            limit: 20
            sort: datetime_desc
    expect:
      status: ok
      calls: {list: {path: /api/ai/read/withdraw-list/DEMO-SVC, query: {date: "2026-09-24", username: abc0812345678, status: "2", limit: "20"}}}
      fields: {จำนวนที่พบ: "1 รายการ"}
      table_cells: [["24/09/2026 10:00", abc0812345678, "2,500.00", รอโอน, ""]]
      model_context: {statuses_found: [รอโอน]}
  - name: ไม่พบ + ข้ามเที่ยงคืน
    now: "2026-09-24T17:05:00Z"
    responses:
      list: {body: {code: 0, payload: {date: "2026-09-25", items: [], count: 0}}}
    expect: {status: not_found, calls: {list: {query: {date: "2026-09-25"}}}}
  - name: host ผิดรูป (item ไม่มี amount)
    responses:
      list: {body: {code: 0, payload: {date: "2026-09-24", items: [{id: x, datetime: "", username: u, status: 2, operator_name: ""}], count: 1}}}
    expect: {status: error, error_code: schema_mismatch}
