# R12 GET /api/ai/read/bank-pending-summary/:service — catalog §6 R12 + ai/read_member.go
tool: bank_pending_summary
cases:
  - name: มีบัญชีรอตรวจสอบ
    responses:
      bp:
        body:
          code: 0
          message: SUCCESS
          payload:
            total_accounts: 17
            members: 15
            by_verify_status: {PENDING: 12, UNSUCCESS: 3, FAIL: 1, DUPLICATE: 1}
            breakdown:
              - {verify_status: PENDING, count: 12, members: 11}
              - {verify_status: UNSUCCESS, count: 3, members: 3}
            fetched_at: "2026-09-24T14:32:00+07:00"
    expect:
      status: ok
      calls: {bp: {path: /api/ai/read/bank-pending-summary/DEMO-SVC}}
      fields: {รายการบัญชีรอตรวจสอบ: "17 รายการ", จำนวนสมาชิก: "15 คน"}
      table_cells: [[PENDING, "12 รายการ", "11 คน"]]
      model_context: {has_pending: true}
      link: /Member/BankPending?service=REVNTy1TVkM=&web=DEMO-SVC
  - name: ไม่มีรอตรวจ = ไม่พบ
    responses:
      bp: {body: {code: 0, payload: {total_accounts: 0, members: 0, by_verify_status: {PENDING: 0, UNSUCCESS: 0, FAIL: 0, DUPLICATE: 0}, breakdown: []}}}
    expect: {status: not_found}
  - name: host 500
    responses:
      bp: {status: 500, body: {code: 500, message: INTERNAL_ERROR, error: อ่านข้อมูลไม่สำเร็จ, payload: null}}
    expect: {status: error, error_code: http_error}
