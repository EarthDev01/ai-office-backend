# R3 GET /api/ai/read/deposit-list/:service — catalog §6 R3 + ai/read_deposit.go depositSafe.toJSON
tool: deposit_find
cases:
  - name: ค้นด้วยยูสเซอร์เนม
    input: {username: abc0812345678}
    responses:
      list:
        body:
          code: 0
          message: SUCCESS
          payload:
            date: "2026-09-24"
            items:
              - {id: 66f2b0c1d2e3f40516273849, datetime: "2026-09-24T09:10:11+07:00", username: abc0812345678, amount: 500, bonus: 50, bonus_id: 3, bonus_name: ฝากแรก, before_credit: 12.5, after_credit: 562.5, channel: AUTO, status: 1, is_check: 1, operator_name: "", comment: "", withdraw_fix: 1650, fix_withdraw: 0, tx_id: ""}
              - {id: 66f2b0c1d2e3f40516273850, datetime: "2026-09-24T08:00:00+07:00", username: abc0812345678, amount: 300, bonus: 0, bonus_id: 0, bonus_name: "", before_credit: 0, after_credit: 0, channel: AUTO, status: 6, is_check: 0, operator_name: Admin A, comment: "", withdraw_fix: 0, fix_withdraw: 0, tx_id: ""}
            count: 2
            count_capped: false
            limit: 20
            sort: datetime_desc
    expect:
      status: ok
      calls: {list: {path: /api/ai/read/deposit-list/DEMO-SVC, query: {date: "2026-09-24", username: abc0812345678, status: "", limit: "20"}}}
      fields: {วันที่: 24/09/2026, จำนวนที่พบ: "2 รายการ"}
      table_rows: 2
      table_cells:
        - ["24/09/2026 09:10", abc0812345678, "500.00", "50.00", สำเร็จ, ""]
        - ["24/09/2026 08:00", abc0812345678, "300.00", "0.00", เครดิตค้าง, Admin A]
      model_context: {statuses_found: [สำเร็จ, เครดิตค้าง]}
  - name: กรองสถานะ + ไม่พบ = ไม่พบ ไม่ใช่ศูนย์
    input: {status: 2, date: "2026-09-20"}
    responses:
      list: {body: {code: 0, payload: {date: "2026-09-20", items: [], count: 0, count_capped: false, limit: 20}}}
    expect:
      status: not_found
      calls: {list: {query: {date: "2026-09-20", status: "2"}}}
  - name: ข้ามเที่ยงคืน
    now: "2026-09-24T17:05:00Z"
    responses:
      list: {body: {code: 0, payload: {date: "2026-09-25", items: [], count: 0}}}
    expect: {status: not_found, calls: {list: {query: {date: "2026-09-25"}}}}
  - name: host 400 (วันที่อนาคต) = ดึงไม่ได้
    input: {date: "2026-12-01"}
    responses:
      list: {status: 400, body: {code: 400, message: BAD_REQUEST, error: "date: ห้ามเป็นวันในอนาคต", payload: null}}
    expect: {status: error, error_code: http_error}
