# R1 GET /api/ai/read/dashboard-summary/:service — ตัวอย่างจาก host-read-catalog-abatech.md §6 R1 + ai/read_dashboard.go
tool: dashboard_today_vs_yesterday
cases:
  - name: วันนี้เทียบเมื่อวาน
    responses:
      dash:
        body:
          code: 0
          message: SUCCESS
          payload:
            date: "2026-09-24"
            compare_date: "2026-09-23"
            is_today: true
            timezone: Asia/Bangkok
            current: {date: "2026-09-24", deposit: 152300, deposit_count: 412, deposit_accounts: 380, deposit_avg: 369.66, withdraw: 98000, withdraw_count: 133, withdraw_members: 120, withdraw_avg: 736.84, bonus: 4200, bonus_count: 88, profit: 54300}
            previous: {date: "2026-09-23", deposit: 160500, deposit_count: 398, deposit_accounts: 371, deposit_avg: 403.27, withdraw: 101000, withdraw_count: 140, withdraw_members: 126, withdraw_avg: 721.43, bonus: 3900, bonus_count: 80, profit: 59500}
            change:
              deposit: {diff: -8200, pct: -5.11}
              withdraw: {diff: -3000, pct: -2.97}
              bonus: {diff: 300, pct: 7.69}
              profit: {diff: -5200, pct: -8.74}
              deposit_count: {diff: 14, pct: 3.52}
              withdraw_count: {diff: -7, pct: -5}
            fetched_at: "2026-09-24T14:32:00+07:00"
    expect:
      status: ok
      calls:
        dash: {path: /api/ai/read/dashboard-summary/DEMO-SVC, query: {date: "2026-09-24"}}
      fields:
        วันที่: 24/09/2026
        เทียบกับวันที่: 23/09/2026
        ยอดฝาก: "152,300.00 บาท"
        ยอดฝาก วันก่อนหน้า: "160,500.00 บาท"
        ยอดฝาก ต่างจากวันก่อนหน้า: "-8,200.00 บาท"
        ยอดฝาก เปลี่ยนแปลง: "-5.1%"
        จำนวนรายการฝาก: "412 รายการ"
        ยอดถอน: "98,000.00 บาท"
        โบนัส: "4,200.00 บาท"
        กำไร (ฝาก - ถอน): "54,300.00 บาท"
        กำไร ต่างจากวันก่อนหน้า: "-5,200.00 บาท"
      model_context: {selected_day_is_today: true, deposit_increased: false, profit_increased: false, profit_negative: false}
      link: /DashboardOnce?service=REVNTy1TVkM=&web=DEMO-SVC
  - name: เมื่อวานเป็นศูนย์ = pct null ไม่แสดงเปอร์เซ็นต์
    input: {date: "2026-09-01"}
    responses:
      dash:
        body:
          code: 0
          payload:
            date: "2026-09-01"
            compare_date: "2026-08-31"
            is_today: false
            current: {deposit: 1000, deposit_count: 2, withdraw: 0, withdraw_count: 0, bonus: 0, profit: 1000}
            previous: {deposit: 0, deposit_count: 0, withdraw: 0, withdraw_count: 0, bonus: 0, profit: 0}
            change: {deposit: {diff: 1000, pct: null}, withdraw: {diff: 0, pct: null}, bonus: {diff: 0, pct: null}, profit: {diff: 1000, pct: null}}
    expect:
      status: ok
      calls: {dash: {query: {date: "2026-09-01"}}}
      fields: {ยอดฝาก: "1,000.00 บาท", ยอดฝาก วันก่อนหน้า: "0.00 บาท"}
      no_fields: [ยอดฝาก เปลี่ยนแปลง]
      model_context: {selected_day_is_today: false, deposit_increased: true}
  - name: ข้ามเที่ยงคืน — วันใหม่ตามเวลาไทย
    now: "2026-09-24T17:05:00Z"
    responses:
      dash: {status: 500, body: {code: 500, message: INTERNAL_ERROR, error: อ่านข้อมูลไม่สำเร็จ, payload: null}}
    expect:
      status: error
      error_code: http_error
      calls: {dash: {query: {date: "2026-09-25"}}}
  - name: host ตอบผิดรูป (ไม่มี previous) = ดึงไม่ได้
    responses:
      dash: {body: {code: 0, payload: {date: "2026-09-24", compare_date: "2026-09-23", current: {deposit: 1, deposit_count: 1, withdraw: 0, withdraw_count: 0, bonus: 0, profit: 1}, change: {}}}}
    expect: {status: error, error_code: schema_mismatch}
  - name: สิทธิ์ไม่ถึง (host 403)
    responses:
      dash: {status: 403, body: {code: 403, message: PERMISSION_DENIED}}
    expect: {status: denied}
