# R9 GET /api/ai/read/member/:service?username= — catalog §6 R9 + ai/read_member.go (404 "ไม่พบสมาชิกนี้")
tool: member_info
cases:
  - name: พบสมาชิก
    input: {username: abc123}
    responses:
      m:
        body:
          code: 0
          message: SUCCESS
          payload:
            member:
              username: abc123
              date_regis: "2026-09-01T10:15:00+07:00"
              active: 1
              topup_status: 1
              user_type: member
              rank: 2
              is_bonus: 1
              point: 120
              last_deposit: "2026-09-23T12:00:00+07:00"
              withdraw_status: 0
              tags: [VIP]
              bank_list:
                - {bank_code: KBANK, account_last4: "4321", approved: true, status: 1, active: 1, verify_status: SUCCESS, verify_tier: 4}
                - {bank_code: SCB, account_last4: "8765", approved: false, status: 0, active: 0, verify_status: PENDING, verify_tier: 0}
              bank_count: 2
              bank_approved_count: 1
              event_config: {cashback_status: 0, commission_status: 0, coupon_status: 0}
            matched_by: username
            fetched_at: "2026-09-24T14:32:00+07:00"
    expect:
      status: ok
      calls: {m: {path: /api/ai/read/member/DEMO-SVC, query: {username: abc123}}}
      fields: {ยูสเซอร์เนม: abc123, วันที่สมัคร: "01/09/2026 10:15", สถานะ: ยืนยันแล้ว, ลูกค้าฝากเงินแล้ว: ใช่, ฝากล่าสุด: "23/09/2026 12:00", รับโบนัส: ใช่, แต้ม: "120", บัญชีธนาคาร: "2 บัญชี", บัญชีที่อนุมัติแล้ว: "1 บัญชี"}
      table_rows: 2
      table_cells:
        - [KBANK, "4321", ใช่, ใช่, SUCCESS]
        - [SCB, "8765", ไม่ใช่, ไม่ใช่, PENDING]
      model_context: {has_deposited: true, is_blocked: false, is_verified: true, has_pending_bank: true, found_by_phone: false}
      link: /Member?service=REVNTy1TVkM=&web=DEMO-SVC
  - name: พบด้วยเบอร์ ยังไม่ยืนยัน ยังไม่เคยฝาก
    input: {username: "0812345678"}
    responses:
      m: {body: {code: 0, payload: {member: {username: u2, date_regis: "2026-09-20T08:00:00+07:00", active: 0, topup_status: 0, is_bonus: 0, point: 0, last_deposit: "", tags: [], bank_list: [], bank_count: 0, bank_approved_count: 0}, matched_by: phone_number}}}
    expect:
      status: ok
      fields: {สถานะ: ยังไม่ยืนยันตัวตน, ลูกค้าฝากเงินแล้ว: ไม่ใช่}
      no_fields: [ฝากล่าสุด]
      table_rows: 0
      model_context: {has_deposited: false, is_verified: false, found_by_phone: true}
  - name: host ตอบ 404 = ไม่พบสมาชิก
    input: {username: nobody}
    responses:
      m: {status: 404, body: {code: 404, message: NOT_FOUND, error: ไม่พบสมาชิกนี้, payload: null}}
    expect: {status: not_found}
