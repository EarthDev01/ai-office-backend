# R5 GET /api/ai/read/withdraw-status-summary/:service — catalog §6 R5 + ai/read_withdraw.go (เติมครบสถานะ 1..16 เสมอ)
tool: withdraw_pending_by_status
cases:
  - name: มีถอนค้างหลายสถานะ
    responses:
      sum:
        body:
          code: 0
          message: SUCCESS
          payload:
            start_date: "2026-09-24"
            end_date: "2026-09-24"
            timezone: Asia/Bangkok
            by_status:
              - {status: 1, count: 120, amount: 95000, closed: true, known: true}
              - {status: 2, count: 4, amount: 6000, closed: false, known: true}
              - {status: 3, count: 2, amount: 3000, closed: false, known: true}
              - {status: 4, count: 1, amount: 500, closed: true, known: true}
              - {status: 5, count: 0, amount: 0, closed: false, known: true}
              - {status: 13, count: 0, amount: 0, closed: false, known: true}
            totals: {all: {count: 127, amount: 104500}, not_success: {count: 7, amount: 9500}, open: {count: 6, amount: 9000}}
            p2p_remain_count: 3
            fetched_at: "2026-09-24T14:32:00+07:00"
    expect:
      status: ok
      calls: {sum: {path: /api/ai/read/withdraw-status-summary/DEMO-SVC, query: {date: "2026-09-24", start_date: "", end_date: ""}}}
      fields:
        ยังไม่จบ (ต้องติดตาม): "6 รายการ"
        ยอดที่ยังไม่จบ: "9,000.00 บาท"
        ไม่สำเร็จทั้งหมด (รวมยกเลิก/ซ่อน): "7 รายการ"
        รายการถอนทั้งหมด: "127 รายการ"
        ถอน P2P ที่ยังมียอดเหลือต้องจัดการ: "3 รายการ"
      table_rows: 3
      table_cells:
        - [รอโอน, "4 รายการ", "6,000.00"]
        - [กำลังตรวจสอบ, "2 รายการ", "3,000.00"]
        - [ยกเลิก, "1 รายการ", "500.00"]
      model_context: {has_open: true, has_p2p_remainder: true, statuses: [รอโอน, กำลังตรวจสอบ, ยกเลิก]}
      link: /Withdraw?service=REVNTy1TVkM=&web=DEMO-SVC
  - name: ช่วงวันที่ + สถานะที่ไม่รู้จัก
    input: {start_date: "2026-09-01", end_date: "2026-09-07"}
    responses:
      sum:
        body:
          code: 0
          payload:
            start_date: "2026-09-01"
            end_date: "2026-09-07"
            by_status: [{status: 0, count: 1, amount: 100, closed: false, known: false}, {status: 1, count: 5, amount: 900, closed: true, known: true}]
            totals: {all: {count: 6, amount: 1000}, not_success: {count: 1, amount: 100}, open: {count: 1, amount: 100}}
            p2p_remain_count: 0
    expect:
      status: ok
      calls: {sum: {query: {start_date: "2026-09-01", end_date: "2026-09-07"}}}
      table_cells: [["สถานะ 0 (ยังไม่มีคำอธิบาย)", "1 รายการ", "100.00"]]
      no_fields: [ถอน P2P ที่ยังมียอดเหลือต้องจัดการ]
      model_context: {statuses: [], has_unknown_status: true}
  - name: ไม่มีค้าง = ไม่พบ ไม่ใช่ศูนย์ + ข้ามเที่ยงคืน
    now: "2026-09-24T17:05:00Z"
    responses:
      sum:
        body:
          code: 0
          payload:
            start_date: "2026-09-25"
            end_date: "2026-09-25"
            by_status: [{status: 1, count: 3, amount: 900, closed: true, known: true}, {status: 2, count: 0, amount: 0, closed: false, known: true}]
            totals: {all: {count: 3, amount: 900}, not_success: {count: 0, amount: 0}, open: {count: 0, amount: 0}}
            p2p_remain_count: 0
    expect: {status: not_found, calls: {sum: {query: {date: "2026-09-25"}}}}
  - name: host ตอบผิดรูป (ไม่มี totals.open)
    responses:
      sum: {body: {code: 0, payload: {start_date: "2026-09-24", end_date: "2026-09-24", by_status: [], totals: {all: {count: 0, amount: 0}, not_success: {count: 0, amount: 0}}, p2p_remain_count: 0}}}
    expect: {status: error, error_code: schema_mismatch}
