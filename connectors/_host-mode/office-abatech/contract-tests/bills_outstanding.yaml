# R21 GET /api/ai/read/bills/:service — catalog §6 R21 + ai/read_system.go normalizeBills (ค่าที่ upstream ไม่ส่ง = null)
tool: bills_outstanding
cases:
  - name: มีบิลค้าง
    responses:
      bl:
        body:
          code: 0
          message: SUCCESS
          payload:
            items:
              - {id: 65f000000000000000000001, billpayment_id: INV-0012, datetime: "2026-09-01T03:00:00Z", title: ค่าบริการระบบ, billpayment_name: ก.ย. 2026, to_name: DEMOSLOT, total: 15000, end_date: "2026-09-30T00:00:00Z", status: 3}
              - {id: 65f000000000000000000002, billpayment_id: INV-0010, datetime: "2026-08-01T03:00:00Z", title: ค่าบริการระบบ, billpayment_name: ส.ค. 2026, to_name: DEMOSLOT, total: 14000, end_date: "2026-08-31T00:00:00Z", status: 6}
            count: 2
            by_status: {"3": 1, "6": 1}
            outstanding_count: 1
            fetched_at: "2026-09-24T14:32:00+07:00"
            source: live_bill_console
    expect:
      status: ok
      calls: {bl: {path: /api/ai/read/bills/DEMO-SVC}}
      fields: {บิลที่ค้าง (รอจ่าย/ค้างชำระ): "1 ใบ", ยอดที่ค้างรวม: "15,000.00 บาท", บิลทั้งหมด: "2 ใบ"}
      table_rows: 1
      table_cells: [[INV-0012, ค่าบริการระบบ, ก.ย. 2026, "15,000.00", 30/09/2026, รอจ่าย]]
      model_context: {has_outstanding: true, statuses: [รอจ่าย]}
      link: /BillPayment
  - name: ไม่มีบิลค้าง แต่มีบิลจ่ายแล้ว
    responses:
      bl: {body: {code: 0, payload: {items: [{id: a, billpayment_id: INV-1, datetime: null, title: ค่าบริการ, billpayment_name: null, to_name: null, total: 100, end_date: null, status: 6}], count: 1, by_status: {"6": 1}, outstanding_count: 0}}}
    expect:
      status: ok
      fields: {บิลที่ค้าง (รอจ่าย/ค้างชำระ): "0 ใบ"}
      no_fields: [ยอดที่ค้างรวม]
      table_rows: 0
      model_context: {has_outstanding: false}
  - name: ไม่มีบิล = ไม่พบ
    responses:
      bl: {body: {code: 0, payload: {items: [], count: 0, by_status: {}, outstanding_count: 0}}}
    expect: {status: not_found}
  - name: ระบบบิลล่ม (502)
    responses:
      bl: {status: 502, body: {code: 502, message: UPSTREAM_ERROR, error: ติดต่อระบบบิลไม่สำเร็จ, payload: null}}
    expect: {status: error, error_code: http_error}
