# R22 GET /api/ai/read/member-credit-history/:service — catalog §6 R22 (รูปเดียวกับ R17 + username/action_filter/source)
tool: member_credit_history
cases:
  - name: มีประวัติ 7 วันล่าสุด
    input: {username: user01}
    responses:
      ch:
        body:
          code: 0
          message: SUCCESS
          payload:
            username: user01
            start_date: "2026-09-18"
            end_date: "2026-09-24"
            timezone: Asia/Bangkok
            action_filter: "เครดิต|โบนัส|แต้ม|เทิร์น|ตั๋ว|แนะนำเพื่อน|กิจกรรมแชร์"
            items:
              - {datetime: "2026-09-23T11:12:09+07:00", operator_name: Admin A, action: คืนเครดิต, change: "200", username: user01, detail: "คืนเครดิต user : user01 จำนวน 200", description: ""}
            count: 1
            truncated: false
            limit: 50
            sort: datetime_desc
            source: working_log
    expect:
      status: ok
      calls: {ch: {path: /api/ai/read/member-credit-history/DEMO-SVC, query: {username: user01, start_date: "", end_date: "", limit: "50"}}}
      fields: {ตั้งแต่วันที่: 18/09/2026, ถึงวันที่: 24/09/2026}
      table_cells: [["23/09/2026 11:12", Admin A, คืนเครดิต, "200", "คืนเครดิต user : user01 จำนวน 200"]]
      model_context: {has_more_rows: false}
      link: /Credit?service=REVNTy1TVkM=&web=DEMO-SVC
  - name: ไม่มีประวัติ = ไม่พบ
    input: {username: user02, start_date: "2026-09-01", end_date: "2026-09-10"}
    responses:
      ch: {body: {code: 0, payload: {username: user02, start_date: "2026-09-01", end_date: "2026-09-10", items: [], count: 0, truncated: false, limit: 50}}}
    expect: {status: not_found, calls: {ch: {query: {start_date: "2026-09-01", end_date: "2026-09-10"}}}}
  - name: สิทธิ์ไม่ถึง
    input: {username: user01}
    responses:
      ch: {status: 403, body: {code: 403, message: PERMISSION_DENIED}}
    expect: {status: denied}
