tool: bills_unpaid
cases:
  - name: มีบิลค้างชำระ (ตัวอย่าง catalog R20)
    responses:
      b:
        body:
          code: 0
          message: SUCCESS
          count: 2
          limit: 20
          fetched_at: "2026-09-24T14:03:45+07:00"
          data:
            - {id: b1, billpayment_id: 11, title: ค่าบริการ ก.ย., billpayment_name: ค่าบริการรายเดือน, billpayment_type_name: รายเดือน, description: "", total: 1000, overdue_amount: 1000, confirm_amount: 0, status: 5, status_label: ค้างชำระ, start_date: "2026-09-01T07:00:00+07:00", end_date: "2026-09-10T07:00:00+07:00", created_at: "2026-09-01T07:00:00+07:00", updated_at: null, is_topup: false, product_list: [{name: SMS, description: "", amount: 1000}]}
            - {id: b2, billpayment_id: 12, title: ค่าบริการ ต.ค., total: 2500, overdue_amount: 2500, confirm_amount: 0, status: 3, status_label: รอจ่าย, end_date: "2026-10-10T07:00:00+07:00", updated_at: null}
          summary:
            by_status: [{status: 3, status_label: รอจ่าย, count: 1, total: 2500, overdue_amount: 2500}, {status: 5, status_label: ค้างชำระ, count: 1, total: 1000, overdue_amount: 1000}]
    expect:
      status: ok
      calls:
        b: {path: /api/ai/read/bills/DEMO-SVC, query: {status: "3,5", limit: "20"}}
      fields: {บิลที่ต้องชำระ: "2 ใบ", ยอดค้างรวม (บิลในการ์ด): "3,500.00 บาท"}
      table_rows: 2
      table_cells:
        - ["11", ค่าบริการ ก.ย., "1,000.00", "1,000.00", 10/09/2026, ค้างชำระ]
        - ["12", ค่าบริการ ต.ค., "2,500.00", "2,500.00", 10/10/2026, รอจ่าย]
      model_context: {has_overdue: true, statuses: [ค้างชำระ, รอจ่าย]}
      link: /bill
  - name: ไม่มีบิลต้องชำระ = ไม่พบ
    responses:
      b: {body: {code: 0, count: 0, limit: 20, data: [], summary: {by_status: []}}}
    expect: {status: not_found}
  - name: ระบบบิลล่ม = 502
    responses:
      b: {status: 502, body: {code: 502, message: UPSTREAM_ERROR, data: null}}
    expect: {status: error, error_code: http_error}
