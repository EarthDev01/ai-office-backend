tool: promotions_open
cases:
  - name: โปรฯ ที่เปิดอยู่ (response เดิมของ GetBonusList)
    responses:
      b:
        body:
          code: 0
          message: Success
          count: 2
          data:
            - {id: 66aa00000000000000000001, title: "", bonus_id: 801, bonus_name: สมาชิกใหม่ รับเพิ่ม, fix_deposit: 100, bonus_percent: 50, bonus_limit: 500, fix_multiple: 5, fix_withdraw: 1000, status: 1, start_date: "2026-09-01T00:00:00Z", end_date: "2026-09-30T16:59:59Z", create_at: "2026-08-30T03:00:00Z", update_at: "2026-08-30T03:00:00Z", order: 1, min_amount_cond: {}, tag: []}
            - {id: 66aa00000000000000000002, bonus_name: ฝากประจำวัน, fix_deposit: 300, bonus_percent: 10, bonus_limit: 300, fix_multiple: 1.5, fix_withdraw: 0, status: 1, start_date: "2026-01-01T00:00:00Z", end_date: "2026-12-31T16:59:59Z"}
    expect:
      status: ok
      calls:
        b: {path: /api/ai/read/bonus-list/DEMO-SVC, query: {status: "1", limit: "100", sort: order, order: "1"}}
      fields: {โปรโมชั่นที่เปิดอยู่: "2 รายการ"}
      table_rows: 2
      table_cells:
        - [สมาชิกใหม่ รับเพิ่ม, "100.00", "50", "500.00", "5", "1,000.00", 01/09/2026, 30/09/2026]
        - [ฝากประจำวัน, "300.00", "10", "300.00", "1.5", "0.00", 01/01/2026, 31/12/2026]
      link: /setting/bonus
  - name: ไม่มีโปรฯ เปิด = ไม่พบ
    responses:
      b: {body: {code: 0, message: Success, data: [], count: 0}}
    expect: {status: not_found}
  - name: handler เดิมเขียน JSON สองก้อนตอน DB error = ดึงไม่ได้
    responses:
      b: {raw: '{"code":1,"message":"err","data":[]}{"code":0,"message":"Success","data":[],"count":0}'}
    expect: {status: error, error_code: bad_json}
  - name: code 1 = host error
    responses:
      b: {body: {code: 1, message: mongo error, data: []}}
    expect: {status: error, error_code: host_error}
