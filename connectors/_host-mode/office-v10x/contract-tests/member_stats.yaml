tool: member_stats
cases:
  - name: สมัครใหม่วันนี้ + ยังไม่ยืนยัน (ตัวอย่าง catalog R10)
    responses:
      s:
        body:
          code: 0
          message: SUCCESS
          data:
            date_from: "2026-09-24"
            date_to: "2026-09-24"
            timezone: Asia/Bangkok
            total: 15230
            new_registered: 37
            unverified: 412
            by_active: [{active: 0, count: 412}, {active: 1, count: 14650}, {active: 2, count: 150}, {active: 4, count: 88}, {active: 99, count: 18}, {active: null, count: 3}]
    expect:
      status: ok
      calls:
        s: {path: /api/ai/read/member-stats/DEMO-SVC, query: {from: "2026-09-24", to: "2026-09-24"}}
      fields:
        ตั้งแต่วันที่: 24/09/2026
        สมัครใหม่ในช่วงนี้: "37 คน"
        ยังไม่ยืนยันตัวตน (ทั้งหมด): "412 คน"
        สมาชิกทั้งหมด (ไม่รวมที่ลบ): "15,230 คน"
      table_rows: 6
      table_cells:
        - [ยืนยันแล้ว, "14,650 คน"]
        - [ยังไม่ยืนยันตัวตน, "412 คน"]
      model_context: {has_new: true, has_unverified: true}
      link: /member/memberlist
  - name: ข้ามเที่ยงคืน
    now: "2026-09-24T17:05:00Z"
    responses:
      s: {status: 503, body: {code: 503, message: SERVICE_UNAVAILABLE, data: null}}
    expect:
      status: error
      calls:
        s: {query: {from: "2026-09-25", to: "2026-09-25"}}
  - name: ผิดรูป (ไม่มี unverified)
    responses:
      s: {body: {code: 0, data: {date_from: "2026-09-24", date_to: "2026-09-24", total: 1, new_registered: 0, by_active: []}}}
    expect: {status: error, error_code: schema_mismatch}
