tool: member_lookup
cases:
  - name: พบสมาชิก (ตัวอย่าง catalog R9)
    input: {username: user01}
    responses:
      m:
        body:
          code: 0
          message: SUCCESS
          data:
            username: user01
            full_name: สมชาย ใจดี
            date_regis: "2026-03-02T14:20:00+07:00"
            active: 1
            topup_status: 1
            user_type: member
            rank: 2
            last_deposit: "2026-09-24T10:15:02+07:00"
            overdue: 0
            bank_list:
              - {bank_code: KBANK, bank_name: สมชาย ใจดี, bank_number: "1234567890", status: 1, active: 1, verify_status: SUCCESS, update_at: "2026-03-02T14:25:00+07:00"}
              - {bank_code: SCB, bank_name: สมชาย ใจดี, bank_number: "5550001111", status: 0, active: 1, verify_status: PENDING, update_at: null}
            tags: [VIP]
            last_active_date: "2026-09-24"
            active_dates_7d: ["2026-09-20", "2026-09-24"]
            activity_window: {from: "2026-08-26", to: "2026-09-24", timezone: Asia/Bangkok, source: report_active_user_day}
    expect:
      status: ok
      calls:
        m: {path: /api/ai/read/member/DEMO-SVC, query: {username: user01}}
      fields:
        ยูสเซอร์เนม: user01
        ชื่อ-นามสกุล: สมชาย ใจดี
        วันสมัคร: "02/03/2026 14:20"
        สถานะบัญชี: ยืนยันแล้ว
        เคยฝากเงิน: ใช่
        ฝากล่าสุด: "24/09/2026 10:15"
        วันล่าสุดที่มีรายการ (ในสามสิบวัน): 24/09/2026
        ยอดค้างชำระ: "0.00 บาท"
      table_rows: 2
      table_cells:
        - [KBANK, สมชาย ใจดี, "1234567890", อนุมัติแล้ว, SUCCESS]
        - [SCB, สมชาย ใจดี, "5550001111", รออนุมัติ, PENDING]
      model_context: {is_blocked: false, is_unverified: false, never_deposited: false, has_pending_bank: true, bank_statuses: [อนุมัติแล้ว, รออนุมัติ]}
      link: /member/user01
  - name: สมาชิกใหม่ยังไม่เคยฝาก ไม่มีบัญชี ค่าเวลาเป็น null
    input: {username: newbie}
    responses:
      m: {body: {code: 0, data: {username: newbie, full_name: "", date_regis: null, active: 0, topup_status: 0, rank: 0, last_deposit: null, overdue: 0, bank_list: [], tags: [], last_active_date: null, active_dates_7d: []}}}
    expect:
      status: ok
      fields: {สถานะบัญชี: ยังไม่ยืนยันตัวตน, เคยฝากเงิน: ไม่ใช่, ฝากล่าสุด: "—", วันสมัคร: "—"}
      table_rows: 0
      model_context: {is_unverified: true, never_deposited: true, has_pending_bank: false}
  - name: host ตอบ 404 = ไม่พบสมาชิก
    input: {username: nobody}
    responses:
      m: {status: 404, body: {code: 404, message: NOT_FOUND, data: null}}
    expect: {status: not_found, link: /member/nobody}
