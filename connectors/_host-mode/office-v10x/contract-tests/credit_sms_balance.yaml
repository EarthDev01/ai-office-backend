tool: credit_sms_balance
cases:
  - name: มีเครดิต SMS
    responses:
      s: {body: {code: 0, message: Success, data: 1520.5}}
    expect:
      status: ok
      calls:
        s: {path: /api/ai/read/credit-sms-balance/DEMO-SVC}
      fields: {เครดิต Sms คงเหลือ: "1,520.5"}
      model_context: {is_zero: false}
      link: /
  - name: ผู้ให้บริการตอบ error (code 1) = ดึงไม่ได้
    responses:
      s: {body: {code: 1, message: provider error, data: null}}
    expect: {status: error, error_code: host_error}
  - name: panic ใน handler เดิม = HTTP 500 body ว่าง
    responses:
      s: {status: 500, raw: ""}
    expect: {status: error, error_code: http_error}
