tool: bank_accounts_withdraw
cases:
  - name: บัญชีถอนแยกธนาคาร
    responses:
      b:
        body:
          code: 0
          message: SUCCESS
          count: 2
          limit: 200
          data: []
          summary:
            by_bank: [{bank_code: SCB, count: 1, active_count: 1, shown_count: 0}, {bank_code: KBANK, count: 1, active_count: 1, shown_count: 0}]
    expect:
      status: ok
      calls:
        b: {path: /api/ai/read/bank-config-withdraw/DEMO-SVC}
      fields: {บัญชีทั้งหมด: "2 บัญชี", เปิดใช้งาน: "2 บัญชี"}
      table_rows: 2
      model_context: {has_inactive: false}
      link: /statement/managebank
  - name: ไม่มีบัญชีถอน = ไม่พบ
    responses:
      b: {body: {code: 0, count: 0, data: [], summary: {by_bank: []}}}
    expect: {status: not_found}
  - name: ผิดรูป (ไม่มี summary)
    responses:
      b: {body: {code: 0, count: 1, data: []}}
    expect: {status: error, error_code: schema_mismatch}
