tool: credit_agent_balance
cases:
  - name: มียอดเครดิตเอเจ้น (response เดิมของ GetBalanceAgent)
    responses:
      a: {body: {code: 0, message: Success, data: {amount: 250000.5, code: 1001, name: CREDIT, unit: THB, updated_at: 1790219702, service: DEMO-SVC}}}
    expect:
      status: ok
      calls:
        a: {path: /api/ai/read/credit-agent-balance/DEMO-SVC}
      fields: {เครดิตเอเจ้นคงเหลือ: "250,000.50", หน่วย: THB, อัปเดตล่าสุด: "24/09/2026 10:15"}
      link: /
  - name: ยังไม่มีเอกสาร (code 1) = ไม่พบ
    responses:
      a: {body: {code: 1, message: "mongo: no documents in result", data: null}}
    expect: {status: not_found}
  - name: host ล่ม
    responses:
      a: {error: timeout}
    expect: {status: error, error_code: timeout}
