tool: withdraw_find
cases:
  - name: พบรายการถอนของยูส
    input: {username: user01, date_from: "2026-09-20", date_to: "2026-09-24"}
    responses:
      l:
        body:
          code: 0
          count: 1
          limit: 20
          data:
            - {id: 66f2a2d1e4b0a1b2c3d4e5f7, datetime: "2026-09-24T09:58:11+07:00", update_time: "2026-09-24T10:03:40+07:00", username: user01, amount: 500, status: 13, operator_name: somchai, comment: รอตรวจสอบยอด, bank_code: SCB}
    expect:
      status: ok
      calls:
        l: {path: /api/ai/read/withdraw-list/DEMO-SVC, query: {username: user01, from: "2026-09-20", to: "2026-09-24", limit: "20"}}
      fields: {พบทั้งหมด: "1 รายการ"}
      table_cells:
        - ["24/09/2026 09:58", "24/09/2026 10:03", user01, "500.00", รบกวนตรวจสอบยอดที่ธนาคาร, somchai, รอตรวจสอบยอด]
      model_context: {statuses: [รบกวนตรวจสอบยอดที่ธนาคาร], more_than_shown: false}
  - name: ไม่พบ
    input: {username: nobody}
    responses:
      l: {body: {code: 0, count: 0, data: []}}
    expect: {status: not_found}
  - name: ข้ามเที่ยงคืน
    now: "2026-09-24T17:05:00Z"
    responses:
      l: {body: {code: 0, count: 0, data: []}}
    expect:
      status: not_found
      calls:
        l: {query: {from: "2026-09-25", to: "2026-09-25"}}
