tool: bank_member_pending
cases:
  - name: มีบัญชีรออนุมัติ (ตัวอย่าง catalog R11)
    responses:
      c: {body: {code: 0, message: SUCCESS, data: {count: 7}}}
    expect:
      status: ok
      calls:
        c: {path: /api/ai/read/bank-member-pending/DEMO-SVC}
      fields: {รออนุมัติ: "7 บัญชี"}
      model_context: {has_pending_accounts: true}
      link: /member/approvebank
  - name: ไม่มีรออนุมัติ = ไม่พบ
    responses:
      c: {body: {code: 0, data: {count: 0}}}
    expect: {status: not_found}
  - name: host error 500
    responses:
      c: {status: 500, body: {code: 500, message: INTERNAL_ERROR, data: null}}
    expect: {status: error, error_code: http_error}
