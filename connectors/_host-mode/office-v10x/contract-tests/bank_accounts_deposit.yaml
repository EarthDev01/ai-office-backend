tool: bank_accounts_deposit
cases:
  - name: บัญชีฝากแยกธนาคาร (ตัวอย่าง catalog R12)
    responses:
      b:
        body:
          code: 0
          message: SUCCESS
          count: 3
          limit: 200
          data:
            - {id: 65f0c1a2e4b0a1b2c3d4e5f8, bank_name: บจก. เว็บ, bank_code: KBANK, bank_number: "0987654321", type: deposit, status: 1, is_show: 1, scope: ALL, balance: 152340.25, online_updated: "2026-09-24T10:20:00+07:00", open_time: "00:00", close_time: "23:59", max_withdraw: 0, bank_layer: 1}
          summary:
            by_bank: [{bank_code: KBANK, count: 2, active_count: 2, shown_count: 1}, {bank_code: SCB, count: 1, active_count: 0, shown_count: 0}]
    expect:
      status: ok
      calls:
        b: {path: /api/ai/read/bank-config-deposit/DEMO-SVC}
      fields: {บัญชีทั้งหมด: "3 บัญชี", เปิดใช้งาน: "2 บัญชี", แสดงหน้าเว็บ: "1 บัญชี"}
      table_rows: 2
      table_cells:
        - [KBANK, "2 บัญชี", "2 บัญชี", "1 บัญชี"]
        - [SCB, "1 บัญชี", "0 บัญชี", "0 บัญชี"]
      model_context: {has_inactive: true, none_shown: false}
      link: /statement/managebank
  - name: ไม่มีบัญชีฝาก = ไม่พบ
    responses:
      b: {body: {code: 0, count: 0, limit: 200, data: [], summary: {by_bank: []}}}
    expect: {status: not_found}
  - name: สิทธิ์ไม่ถึงที่ host
    responses:
      b: {status: 403, body: {code: 403, message: PERMISSION_DENIED}}
    expect: {status: denied}
