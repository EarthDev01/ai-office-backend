tool: withdraw_pending_by_status
cases:
  - name: ถอนค้าง 2 สถานะ (ตัวอย่าง catalog R5)
    service: K11S
    responses:
      p:
        body:
          code: 0
          message: SUCCESS
          excluded_statuses: [1, 4, 11]
          range: {from: "2026-09-24T00:00:00+07:00", to: "2026-09-25T00:00:00+07:00", timezone: Asia/Bangkok}
          data:
            - {status: 2, count: 3, amount: 900, oldest_datetime: "2026-09-24T08:00:00+07:00"}
            - {status: 13, count: 1, amount: 100, oldest_datetime: "2026-09-24T07:00:00+07:00"}
          summary: {count: 4, amount: 1000, oldest_datetime: "2026-09-24T07:00:00+07:00"}
    expect:
      status: ok
      calls:
        p: {path: /api/ai/read/withdraw-pending-summary/K11S, query: {from: "2026-09-24", to: "2026-09-24"}}
      fields: {รวมทั้งหมด: "4 รายการ", ยอดรวมทั้งหมด: "1,000.00 บาท", รายการเก่าสุดสร้างเมื่อ: "24/09/2026 07:00"}
      table_rows: 2
      table_cells:
        - [เตรียมการโอนเงิน, "3 รายการ", "900.00", "24/09/2026 08:00"]
        - [รบกวนตรวจสอบยอดที่ธนาคาร, "1 รายการ", "100.00", "24/09/2026 07:00"]
      model_context: {has_pending: true, needs_bank_check: true, statuses: [เตรียมการโอนเงิน, รบกวนตรวจสอบยอดที่ธนาคาร]}
      link: /transection/withdraw
  - name: ไม่มีค้าง = ไม่พบ ไม่ใช่ศูนย์
    responses:
      p: {body: {code: 0, message: SUCCESS, data: [], summary: {count: 0, amount: 0, oldest_datetime: null}}}
    expect: {status: not_found}
  - name: host ตอบผิดรูป (ไม่มี amount) = ดึงไม่ได้
    responses:
      p: {body: {code: 0, data: [{status: 2, count: 3}], summary: {count: 3, amount: 900}}}
    expect: {status: error, error_code: schema_mismatch}
  - name: ข้ามเที่ยงคืน — วันใหม่ตามเวลาไทย
    now: "2026-09-24T17:05:00Z"
    responses:
      p: {body: {code: 0, data: [], summary: {count: 0, amount: 0, oldest_datetime: null}}}
    expect:
      status: not_found
      calls:
        p: {query: {from: "2026-09-25", to: "2026-09-25"}}
