tool: credit_wallet_history
cases:
  - name: ประวัติกระเป๋าเงินสด (response เดิมของ GetCreditRealWalletList)
    input: {date_from: "2026-09-20", date_to: "2026-09-24"}
    responses:
      h:
        body:
          code: 0
          message: Success
          count: 1
          summary: 150
          data:
            - {id: "000000000000000000000000", datetime: "2026-09-23T05:00:00Z", username: user09, username_prefix: "", amount: 150, bonus: 0, bonus_id: 0, bonus_name: "", before_credit: 0, after_credit: 150, point: 0, withdraw_fix: 0, channel: "", status: 0, operator_name: somchai, comment: ""}
    expect:
      status: ok
      calls:
        h: {path: /api/ai/read/get-credit-real-wallet-list/DEMO-SVC, query: {from: "2026-09-20", to: "2026-09-24", limit: "50", page: "1", order: "-1"}}
      fields: {จำนวนรายการ: "1 รายการ", ยอดรวม: "150.00"}
      table_cells:
        - ["23/09/2026 12:00", user09, "150.00", "0.00", "150.00", somchai]
      link: /transection/managecredit?menu=credit
  - name: ไม่มีประวัติ
    responses:
      h: {body: {code: 0, data: [], count: 0, summary: 0}}
    expect: {status: not_found}
  - name: handler เดิม panic (page เกิน) = 500
    responses:
      h: {status: 500, raw: ""}
    expect: {status: error, error_code: http_error}
