guides:
  - id: add_credit
    title: เพิ่มเครดิตให้สมาชิก
    questions: [BQ-48, BQ-51]
    keywords: [เพิ่มเครดิต, เติมเครดิตให้สมาชิก, ใส่เครดิต, คืนเครดิต]
    menu: managecredit
    tab: จัดการเครดิต
    steps:
      - เปิดเมนู "จัดการเครดิต" แล้วเลือกแท็บ "จัดการเครดิต"
      - เลือกแท็บย่อย "เพิ่มเครดิต"
      - กรอก Username ของสมาชิก เลือกประเภทเครดิต (เติมเครดิต หรือ เครดิตกระเป๋าเงินสด) และกรอกจำนวนเครดิต
      - ถ้าเป็นเครดิตปกติ กรอกเงื่อนไขเครดิต (ยอดเทิร์น ถอนได้ และการคำนวนเทิร์นการถอน) ตามที่ต้องการ
      - กรอกหมายเหตุ เลือกหมวดที่สามารถเดิมพันได้ แล้วกดบันทึกข้อมูล
      - ตรวจผลได้ที่ตาราง "ประวัติจัดการเครดิต" ด้านล่างของหน้าเดียวกัน
    fields: [Username, ประเภทเครดิต, จำนวนเครดิต, ยอดเทิร์น (บาท), ถอนได้, เลือกการคำนวนเทิร์นการถอน, หมายเหตุ, หมวดที่สามารถเดิมพันได้]
    note: ผู้ช่วยเพิ่มเครดิตแทนไม่ได้ ต้องทำเองในหน้านี้ และต้องมีสิทธิ์เพิ่มเครดิตของเมนูจัดการเครดิต ทำจากหน้าข้อมูลสมาชิกได้เช่นกัน (เมนูจัดการเครดิตของสมาชิกคนนั้น)
  - id: manage_turn_bonus_point
    title: จัดการเทิร์น โบนัส แต้ม ทำตรงไหน
    questions: [BQ-49]
    keywords: [เทิร์น, แก้เทิร์น, แจกโบนัส, โบนัสฟรี, แต้ม, แจกแต้ม, กล่องสุ่ม, ยอดแนะนำเพื่อน]
    menu: managecredit
    steps:
      - เปิดเมนู "จัดการเครดิต"
      - เลือกแท็บตามเรื่อง ได้แก่ จัดการเครดิต · จัดการโบนัส · จัดการเทิร์น · จัดการแต้ม · จัดการกล่องสุ่ม · จัดการยอดแนะนำเพื่อน
      - แต่ละแท็บมีฟอร์มด้านบนและตารางประวัติด้านล่าง แท็บที่ไม่มีสิทธิ์จะไม่แสดง
      - ถ้าทำกับสมาชิกคนเดียว เปิดหน้าข้อมูลสมาชิกจากเมนูรายการสมาชิก แล้วใช้เมนูแจกโบนัสฟรี แก้ไขเทิร์น หรือแจกแต้มของสมาชิกคนนั้น
    note: ผู้ช่วยทำรายการแทนไม่ได้ บอกได้แค่ตำแหน่งเมนู
  - id: refuse_add_credit
    title: ขอให้ผู้ช่วยเพิ่มเครดิต / แก้ข้อมูลให้
    questions: [BQ-51]
    keywords: [เพิ่มเครดิตให้หน่อย, ใส่เครดิตให้, แก้ให้หน่อย, ยกเลิกรายการให้, อนุมัติให้]
    menu: managecredit
    tab: จัดการเครดิต
    steps:
      - ผู้ช่วยอ่านข้อมูลได้อย่างเดียว ทำรายการ เพิ่มเครดิต หรือแก้ข้อมูลแทนไม่ได้
      - ทำเองได้ที่เมนู "จัดการเครดิต" แท็บ "จัดการเครดิต" แท็บย่อย "เพิ่มเครดิต"
      - ถ้าไม่มีสิทธิ์เมนูนี้ ให้ผู้ดูแลระบบของเว็บเปิดสิทธิ์ให้
  - id: credit_history
    title: ดูประวัติการจัดการเครดิตย้อนหลัง
    questions: [BQ-50]
    keywords: [ประวัติเครดิต, ใครเพิ่มเครดิต, ประวัติจัดการเครดิต]
    menu: managecredit
    steps:
      - เปิดเมนู "จัดการเครดิต"
      - ตารางด้านล่างมีแท็บ "ประวัติจัดการเครดิต" และ "ประวัติจัดการเครดิตกระเป๋าเงินสด" เลือกวันที่ที่ต้องการ
    note: ประวัติการแก้ไขอื่น ๆ ของพนักงานดูได้ที่เมนูประวัติการทำงานของพนักงาน
  - id: check_member_credit
    title: เช็คเครดิตของสมาชิก
    questions: [BQ-47]
    keywords: [เช็คเครดิต, เครดิตคงเหลือ, เครดิตสมาชิก]
    menu: memberlist
    steps:
      - เปิดเมนู "รายการสมาชิก" แล้วกดชื่อยูสเพื่อเปิดหน้าข้อมูลสมาชิก
      - ใช้เมนูเครดิตของสมาชิกคนนั้นเพื่อดูเครดิตคงเหลือ หรือเช็คเครดิตกระเป๋าเงินสด
    note: ถามผู้ช่วยได้เช่นกัน ถ้ามีสิทธิ์เช็คเครดิตของเมนูจัดการเครดิต
  - id: profit_report
    title: ดูรายงานกำไรขาดทุนตามช่วงวัน
    questions: [BQ-12, BQ-13]
    keywords: [กำไรขาดทุน, รายงานกำไร]
    menu: report_profit
    steps:
      - เปิดเมนู "สรุปกำไรขาดทุน" ในกลุ่มรายงาน
      - เลือกช่วงวันที่ที่ต้องการ หน้าจอแสดงยอดฝาก ยอดถอน กำไร และ COMPANY
    note: ผู้ช่วยยังดึงรายงานนี้ให้ไม่ได้ ระหว่างรอกำหนดสิทธิ์ของเมนู ถามยอดฝากถอนและกำไรรายวันจากผู้ช่วยได้
  - id: topup_system_credit
    title: เติมเครดิตระบบ (เครดิตเอเจ้น / เครดิต Sms)
    questions: [BQ-45, BQ-46]
    keywords: [เติมเครดิตระบบ, เติมเครดิตเอเจ้น, เติม SMS]
    menu: bill
    steps:
      - หลังบ้านนี้ไม่มีหน้าจอเติมเครดิตระบบเอง
      - ติดต่อทีม support ในห้องแชทประจำของเว็บเพื่อขอเติม
      - ถ้ามีบิลที่ต้องชำระหรือรอคอนเฟิร์ม ดูได้ที่เมนู "บิลค่าใช้จ่าย"
  - id: bank_accounts
    title: ดูบัญชีธนาคารที่เปิดใช้งาน
    questions: [BQ-10]
    keywords: [บัญชีที่เปิดใช้, บัญชีธนาคาร]
    menu: managebank
    steps:
      - เปิดเมนู "จัดการบัญชีธนาคาร"
      - เลือกแท็บ "จัดการบัญชีฝาก" หรือ "จัดการบัญชีถอน" ดูคอลัมน์ สถานะ และ แสดงหน้าเว็บ
  - id: find_menu_permission
    title: เมนูไม่ขึ้น / เข้าเมนูไม่ได้
    questions: [BQ-13]
    keywords: [หาเมนูไม่เจอ, เมนูไม่ขึ้น, เข้าไม่ได้, ไม่มีสิทธิ์]
    steps:
      - เมนูที่ไม่มีสิทธิ์จะไม่แสดงในเมนูด้านซ้ายหรือแถบด้านบน
      - ให้ผู้ดูแลระบบของเว็บตรวจและเปิดสิทธิ์ที่เมนู "ตั้งค่าสิทธิ์การใช้งาน"
