# R17 credit-agent-balance (legacy GetBalanceAgent) · R18 credit-agent-reload (legacy ReloadBalanceAgent · side effect D-89) · R19 credit-sms-balance (legacy GetBalanceSMS)
# ทั้งสามเส้น rule = logged_in (navbar ของ v10x แสดงให้ทุกคน)
questions: [BQ-41, BQ-42, BQ-43]
tools:
  - name: credit_agent_balance
    description: >-
      เครดิตเอเจ้นคงเหลือของเว็บ (ยอดที่ระบบบันทึกล่าสุด พร้อมเวลาอัปเดต) — เท่ากับตัวเลข "เครดิตเอเจ้นคงเหลือ" บนแถบด้านบน
      · ถ้าผู้ใช้ต้องการยอดสดล่าสุดหรือเวลาอัปเดตเก่า ใช้ credit_agent_balance_refresh แทน · ระบบประเมินไม่ได้ว่าเครดิตจะหมดเมื่อไหร่
    questions: [BQ-41, BQ-43]
    permission: credit_system
    freshness: live
    calls:
      - id: a
        method: GET
        path: /api/ai/read/credit-agent-balance/{service}
        timeout_ms: 10000
        not_found_codes: [1]
        schema: &agentbal
          type: object
          required: [amount, updated_at]
          properties:
            amount: {type: number}
            unit: {type: string}
            updated_at: {type: integer}
    values:
      - {name: amount, from: a, path: amount}
      - {name: unit, from: a, path: unit}
      - {name: updated, from: a, path: updated_at}
    not_found: {when: "false", message: ยังไม่มีข้อมูลเครดิตเอเจ้นของเว็บนี้ในระบบ}
    card:
      title: เครดิตเอเจ้นคงเหลือ
      fields:
        - {label: เครดิตเอเจ้นคงเหลือ, value: amount, format: money}
        - {label: หน่วย, value: unit, when: "!empty(unit)"}
        - {label: อัปเดตล่าสุด, value: updated, format: datetime}
      note: เป็นยอดที่ระบบบันทึกล่าสุด ไม่มีประวัติย้อนหลัง จึงประเมินไม่ได้ว่าจะหมดเมื่อไหร่
      link: {label: เปิดหลังบ้าน (ดูแถบด้านบน), path: /}
    model_context:
      - {name: snapshot_note, type: text, text: ยอดนี้เป็นค่าที่บันทึกล่าสุด ดูเวลาอัปเดตในการ์ด ระบบไม่มีประวัติจึงคาดการณ์วันหมดไม่ได้}

  - name: credit_agent_balance_refresh
    description: >-
      สั่งดึงเครดิตเอเจ้นล่าสุดจากระบบเกม แล้วแสดงยอดที่บันทึกไว้พร้อมเวลาอัปเดต — ใช้เมื่อผู้ใช้ขอยอดสด หรือบอกว่ายอดเก่า
      · ถ้าเวลาอัปเดตในการ์ดยังเก่า ให้ผู้ใช้ถามซ้ำอีกครั้งหรือกดปุ่มรีเฟรชบนแถบด้านบน
    questions: [BQ-41]
    permission: credit_system
    freshness: live
    calls:
      - id: reload
        method: GET
        path: /api/ai/read/credit-agent-reload/{service}
        envelope: raw
        optional: true
        timeout_ms: 15000
        schema: {type: object, required: [code], properties: {code: {type: integer}}}
      - id: a
        method: GET
        path: /api/ai/read/credit-agent-balance/{service}
        timeout_ms: 10000
        not_found_codes: [1]
        schema: *agentbal
    values:
      - {name: amount, from: a, path: amount}
      - {name: unit, from: a, path: unit}
      - {name: updated, from: a, path: updated_at}
      - {name: reload_code, from: reload, path: code}
    not_found: {when: "false", message: ยังไม่มีข้อมูลเครดิตเอเจ้นของเว็บนี้ในระบบ}
    card:
      title: เครดิตเอเจ้นคงเหลือ (สั่งดึงยอดล่าสุดแล้ว)
      fields:
        - {label: เครดิตเอเจ้นคงเหลือ, value: amount, format: money}
        - {label: หน่วย, value: unit, when: "!empty(unit)"}
        - {label: อัปเดตล่าสุด, value: updated, format: datetime}
      note: ระบบสั่งดึงยอดใหม่พร้อมกับอ่านยอด ถ้าเวลาอัปเดตยังไม่เปลี่ยน ให้ถามซ้ำอีกครั้ง
      link: {label: เปิดหลังบ้าน (ดูแถบด้านบน), path: /}
    model_context:
      - {name: reload_requested, type: bool, expr: "reload_code == 0"}
      - {name: snapshot_note, type: text, text: ยอดอาจยังเป็นค่าก่อนดึงใหม่ ให้ดูเวลาอัปเดตในการ์ด}

  - name: credit_sms_balance
    description: เครดิต Sms คงเหลือของเว็บ (ดึงสดจากผู้ให้บริการ SMS) — เท่ากับตัวเลข "เครดิต Sms คงเหลือ" บนแถบด้านบน · หน่วยตามที่ผู้ให้บริการแจ้ง
    questions: [BQ-42]
    permission: credit_system
    freshness: live
    calls:
      - id: s
        method: GET
        path: /api/ai/read/credit-sms-balance/{service}
        timeout_ms: 15000
        schema: {type: number}
    values:
      - {name: sms, from: s, path: ""}
    card:
      title: เครดิต Sms คงเหลือ
      fields:
        - {label: เครดิต Sms คงเหลือ, value: sms, format: number}
      note: ถ้าผู้ให้บริการ SMS ตอบผิดพลาดบางแบบ ระบบเดิมแสดงเป็นศูนย์ ถ้าตัวเลขดูผิดปกติให้กดรีเฟรชบนแถบด้านบนหรือติดต่อทีม support
      link: {label: เปิดหลังบ้าน (ดูแถบด้านบน), path: /}
    model_context:
      - {name: is_zero, type: bool, expr: "sms == 0"}
