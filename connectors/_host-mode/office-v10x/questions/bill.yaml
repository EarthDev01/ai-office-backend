# R20 GET /api/ai/read/bills/:service (controller/ai_read.go AIReadBills) · ดึงสดจากระบบบิล (ห้ามแคช) · ระบบบิลล่ม = 502 UPSTREAM_ERROR
questions: [BQ-44, BQ-46]
tools:
  - name: bills_unpaid
    description: บิลค่าใช้จ่ายของเว็บที่ยังต้องชำระ (สถานะ รอจ่าย และ ค้างชำระ) พร้อมยอด ยอดค้าง และกำหนดชำระ
    questions: [BQ-44]
    permission: bill
    freshness: live
    calls:
      - id: b
        method: GET
        path: /api/ai/read/bills/{service}
        query: {status: "3,5", limit: "20"}
        envelope: raw
        timeout_ms: 15000
        schema: &bills
          type: object
          required: [code, data, count]
          properties:
            code: {type: integer}
            count: {type: integer}
            data:
              type: array
              items:
                type: object
                required: [billpayment_id, title, total, overdue_amount, status]
                properties:
                  billpayment_id: {type: integer}
                  title: {type: string}
                  billpayment_name: {type: string}
                  total: {type: number}
                  overdue_amount: {type: number}
                  confirm_amount: {type: number}
                  status: {type: integer}
                  end_date: {type: string, nullable: true}
                  updated_at: {type: string, nullable: true}
    values:
      - {name: rows, from: b, path: data}
      - {name: bill_count, from: b, path: count}
      - {name: overdue_total, from: b, path: data, agg: sum, field: overdue_amount}
      - {name: overdue_bills, from: b, path: data, filter: "item.status == 5", agg: count}
    not_found: {when: "empty(rows)", message: ไม่มีบิลที่รอจ่ายหรือค้างชำระ}
    card:
      title: บิลที่ต้องชำระ
      fields:
        - {label: บิลที่ต้องชำระ, value: bill_count, format: int, suffix: " ใบ"}
        - {label: ยอดค้างรวม (บิลในการ์ด), value: overdue_total, format: money, suffix: " บาท"}
      table:
        rows: rows
        max_rows: 20
        columns:
          - {label: เลขที่บิล, field: billpayment_id, format: text}
          - {label: รายการ, field: title}
          - {label: ยอดบิล, field: total, format: money}
          - {label: ยอดค้าง, field: overdue_amount, format: money}
          - {label: กำหนดชำระ, field: end_date, format: date}
          - {label: สถานะ, field: status, format: "status:bill"}
      link: {label: เปิดบิลค่าใช้จ่าย, path: /bill}
    model_context:
      - {name: has_overdue, type: bool, expr: "overdue_bills > 0"}
      - {name: statuses, type: labels, from: rows, pluck: status, format: "status:bill"}

  - name: bills_pending_confirm
    description: >-
      บิลที่แจ้งชำระแล้วแต่ยังรอคอนเฟิร์ม (สถานะ จ่ายแล้ว - รอคอนเฟิร์ม) — ใช้เมื่อถามว่าจ่ายหรือเติมแล้วทำไมยังไม่เข้า
      · ระบบไม่มีข้อมูลรายการเติมเครดิตระบบ ตรวจได้เฉพาะบิล
    questions: [BQ-46]
    permission: bill
    freshness: live
    calls:
      - id: b
        method: GET
        path: /api/ai/read/bills/{service}
        query: {status: "4", limit: "20"}
        envelope: raw
        timeout_ms: 15000
        schema: *bills
    values:
      - {name: rows, from: b, path: data}
      - {name: bill_count, from: b, path: count}
    not_found: {when: "empty(rows)", message: ไม่มีบิลที่รอคอนเฟิร์ม}
    card:
      title: บิลที่รอคอนเฟิร์ม
      fields:
        - {label: บิลรอคอนเฟิร์ม, value: bill_count, format: int, suffix: " ใบ"}
      table:
        rows: rows
        max_rows: 20
        columns:
          - {label: เลขที่บิล, field: billpayment_id, format: text}
          - {label: รายการ, field: title}
          - {label: ยอดบิล, field: total, format: money}
          - {label: ยอดที่แจ้งชำระ, field: confirm_amount, format: money}
          - {label: อัปเดตล่าสุด, field: updated_at, format: datetime}
          - {label: สถานะ, field: status, format: "status:bill"}
      note: ถ้ารอคอนเฟิร์มนานผิดปกติ หรือบิลยืนยันแล้วแต่เครดิตยังไม่เข้า ให้ติดต่อทีม support ในห้องแชทประจำของเว็บ
      link: {label: เปิดบิลค่าใช้จ่าย, path: /bill}
    model_context:
      - {name: statuses, type: labels, from: rows, pluck: status, format: "status:bill"}
