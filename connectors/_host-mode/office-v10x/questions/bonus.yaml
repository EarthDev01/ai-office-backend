# R14 GET /api/ai/read/bonus-list/:service — legacy controller.GetBonusList + aihost.RewriteBonusList
# response เดิม {"code":0,"message":"Success","data":[model.Bonus],"count":n} · เวลาเป็น UTC (Z) · ไม่มีตัวกรองวันที่
questions: [BQ-11]
tools:
  - name: promotions_open
    description: >-
      โปรโมชั่น/โบนัสที่สถานะเปิดใช้งานของเว็บ พร้อมฝากขั้นต่ำ เปอร์เซ็นต์ โบนัสสูงสุด เทิร์น อั้นถอน และวันที่กิจกรรม
      · ระบบกรองได้แค่สถานะเปิด ต้องดูวันสิ้นสุดในการ์ดประกอบ
    permission: bonus
    freshness: summary
    calls:
      - id: b
        method: GET
        path: /api/ai/read/bonus-list/{service}
        query: {status: "1", limit: "100", sort: order, order: "1"}
        cache_ttl: 60
        timeout_ms: 25000
        schema:
          type: array
          items:
            type: object
            required: [bonus_name, status]
            properties:
              bonus_name: {type: string}
              status: {type: integer}
              fix_deposit: {type: number}
              bonus_percent: {type: integer}
              bonus_limit: {type: number}
              fix_multiple: {type: number}
              fix_withdraw: {type: number}
              start_date: {type: string}
              end_date: {type: string}
    values:
      - {name: rows, from: b, path: ""}
      - {name: open_count, from: b, path: "", agg: count}
    not_found: {when: "empty(rows)", message: ตอนนี้ไม่มีโปรโมชั่นที่เปิดใช้งาน}
    card:
      title: โปรโมชั่นที่เปิดใช้งาน
      fields:
        - {label: โปรโมชั่นที่เปิดอยู่, value: open_count, format: int, suffix: " รายการ"}
      table:
        rows: rows
        max_rows: 50
        columns:
          - {label: ชื่อโบนัส, field: bonus_name}
          - {label: ฝากขั้นต่ำ, field: fix_deposit, format: money}
          - {label: "%", field: bonus_percent, format: int}
          - {label: โบนัสสูงสุด, field: bonus_limit, format: money}
          - {label: เทิร์น(เท่า), field: fix_multiple, format: number}
          - {label: อั้นถอน, field: fix_withdraw, format: money}
          - {label: เริ่มกิจกรรม, field: start_date, format: date}
          - {label: สิ้นสุดกิจกรรม, field: end_date, format: date}
      note: นับจากสถานะเปิดใช้งาน อาจมีโปรที่เลยวันสิ้นสุดแล้วแต่ยังเปิดสถานะไว้ ให้ดูคอลัมน์สิ้นสุดกิจกรรม ถ้าวันที่ดูผิดปกติให้ตรวจที่หน้าโบนัส/โปรโมชั่น
      link: {label: เปิดโบนัส/โปรโมชั่น, path: /setting/bonus}
    model_context:
      - {name: check_end_date, type: text, text: รายการในการ์ดเป็นโปรที่เปิดสถานะไว้ ต้องให้ผู้ใช้ดูวันสิ้นสุดกิจกรรมในการ์ดประกอบ}
