tool: withdraw_oldest_pending
cases:
  - name: มีรายการค้าง เรียงเก่าสุดก่อน (ข้ามสำเร็จ ยกเลิก ซ่อน)
    service: K11S
    responses:
      old:
        body:
          code: 0
          msg: Success
          count: 4
          payload:
            - {id: "66f2c3d4e5f60718293a4b51", datetime: "2026-09-24T01:00:00Z", update_time: "2026-09-24T01:05:00Z", username: "done01", phone_number: "0811111111", amount: 800, status: 1, operator_name: "admin01", bank_number: "1112223334"}
            - {id: "66f2c3d4e5f60718293a4b52", datetime: "2026-09-24T01:10:00Z", update_time: "2026-09-24T01:10:00Z", username: "wait01", amount: 1500, status: 2, operator_name: ""}
            - {id: "66f2c3d4e5f60718293a4b53", datetime: "2026-09-24T01:20:00Z", update_time: "2026-09-24T01:20:00Z", username: "cancel01", amount: 100, status: 4, operator_name: "admin02"}
            - {id: "66f2c3d4e5f60718293a4b54", datetime: "2026-09-24T02:00:00Z", update_time: "2026-09-24T02:30:00Z", username: "check01", amount: 2500, status: 3, operator_name: ""}
    expect:
      status: ok
      calls:
        old: {path: /GetWithdrawStatementListByFilter/K11S, query: {date: "2026-09-24", status: "0", sort: datetime, order: "1", limit: "300"}}
      fields: {รายการถอนทั้งวัน: "4 รายการ", ตรวจครบทุกรายการของวัน: "ใช่"}
      table_rows: 2
      table_cells:
        - ["24/09/2026 08:10", wait01, "1,500.00", รอโอน, "24/09/2026 08:10"]
        - ["24/09/2026 09:00", check01, "2,500.00", กำลังตรวจสอบ, "24/09/2026 09:30"]
      model_context: {has_pending: true, scanned_whole_day: true, statuses: [รอโอน, กำลังตรวจสอบ]}
      link: "/Withdraw?service=SzExUw==&web=K11S"
  - name: ไม่มีค้างและตรวจครบทั้งวัน = ไม่พบ
    service: K11S
    responses:
      old: {body: {code: 0, msg: Success, count: 1, payload: [{id: "66f2c3d4e5f60718293a4b51", datetime: "2026-09-24T01:00:00Z", username: "done01", amount: 800, status: 1}]}}
    expect: {status: not_found}
  - name: รายการเกินที่ดู ยังไม่พบค้าง = บอกว่าตรวจไม่ครบ (ไม่ตอบว่าไม่มี)
    service: K11S
    responses:
      old: {body: {code: 0, msg: Success, count: 950, payload: [{id: "66f2c3d4e5f60718293a4b51", datetime: "2026-09-24T01:00:00Z", username: "done01", amount: 800, status: 1}]}}
    expect:
      status: ok
      table_rows: 0
      fields: {ตรวจครบทุกรายการของวัน: "ไม่ใช่", รายการถอนทั้งวัน: "950 รายการ"}
      model_context: {has_pending: false, scanned_whole_day: false}
  - name: หลังเที่ยงคืนนับวันใหม่
    now: "2026-09-25T00:10:00+07:00"
    responses:
      old: {body: {code: 0, msg: Success, count: 0, payload: []}}
    expect:
      status: not_found
      calls: {old: {query: {date: "2026-09-25"}}}
  - name: host ตอบ code 1
    responses:
      old: {body: {code: 1, msg: "error", payload: []}}
    expect: {status: error, error_code: schema_mismatch}
