# GET /GetEventStatementListByUser?username&type=all → {code, msg:"SUCCESS", payload[] | null}
tool: member_events
cases:
  - name: แยกตามกิจกรรม
    input: {username: abc123}
    responses:
      e:
        body:
          code: 0
          msg: SUCCESS
          payload:
            - {datetime: "2026-09-24T03:00:00Z", username: abc123, bonus_name: CHECKIN, amount: 10, comment: เช็คอินวันที่ 24}
            - {datetime: "2026-09-23T03:00:00Z", username: abc123, bonus_name: CHECKIN, amount: 10}
            - {datetime: "2026-09-20T03:00:00Z", username: abc123, bonus_name: COUPON, amount: 100}
    expect:
      status: ok
      calls:
        e: {path: /GetEventStatementListByUser/DEMO-SVC, query: {username: abc123, type: all}}
      fields: {ยอดรวม: "120.00 บาท", รับทั้งหมด: "3 ครั้ง", รับล่าสุด: "24/09/2026 10:00"}
      table_rows: 2
      table_cells:
        - [CHECKIN, "20.00", "2 ครั้ง"]
        - [COUPON, "100.00", "1 ครั้ง"]
      model_context: {has_event: true}
  - name: ไม่เคยรับกิจกรรม
    input: {username: abc123}
    responses:
      e: {body: {code: 0, msg: SUCCESS, payload: null}}
    expect: {status: not_found}
