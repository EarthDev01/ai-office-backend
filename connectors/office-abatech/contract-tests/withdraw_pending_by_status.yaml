# GetWithdrawStatementListByFilter → {code:0, msg:"Success", payload:[WithdrawModel], count} · GetWithdrawP2PRemainCount → {code:0, count}
tool: withdraw_pending_by_status
cases:
  - name: ค้างหลายสถานะ (ตัดสำเร็จ/ยกเลิก/ซ่อน)
    service: DEMOSLOT
    responses:
      w:
        body:
          code: 0
          msg: Success
          count: 6
          payload:
            - {id: 66f2c3000000000000000001, datetime: "2026-09-24T01:10:00Z", username: u1, phone_number: "0812345678", amount: 1000, status: 2, bank_number: "1112223334"}
            - {id: 66f2c3000000000000000002, datetime: "2026-09-24T02:00:00Z", username: u2, amount: 2500.5, status: 13}
            - {id: 66f2c3000000000000000003, datetime: "2026-09-24T03:00:00Z", username: u3, amount: 500, status: 2}
            - {id: 66f2c3000000000000000004, datetime: "2026-09-24T04:00:00Z", username: u4, amount: 300, status: 1}
            - {id: 66f2c3000000000000000005, datetime: "2026-09-24T05:00:00Z", username: u5, amount: 700, status: 4}
            - {id: 66f2c3000000000000000006, datetime: "2026-09-24T06:00:00Z", username: u6, amount: 900, status: 11}
      p2p: {body: {code: 0, count: 2}}
    expect:
      status: ok
      calls:
        w: {path: /GetWithdrawStatementListByFilter/DEMOSLOT, query: {date: "2026-09-24", status: "0", limit: "2000", sort: datetime, order: "1"}}
        p2p: {path: /GetWithdrawP2PRemainCount/DEMOSLOT, query: {date: "2026-09-24"}}
      fields:
        รายการค้าง: "3 รายการ"
        ยอดรวมที่ค้าง: "4,000.50 บาท"
        รายการค้างเก่าสุดสร้างเมื่อ: "24/09/2026 08:10"
        ต้องตรวจสอบยอดธนาคาร: "1 รายการ"
        ถอน P2P ที่ยังมียอดเหลือต้องจัดการ: "2 รายการ"
      no_fields: [รายการทั้งวัน (นับจากที่ดึงได้บางส่วน)]
      table_rows: 2
      table_cells:
        - [รอโอน, "2 รายการ", "1,500.00"]
      model_context: {has_pending: true, needs_bank_check: true, counted_partially: false, statuses: [รอโอน, ตรวจสอบยอดธนาคาร]}
      link: "/Withdraw?service=REVNT1NMT1Q="
  - name: เส้น P2P ล่ม — ยังตอบรายการค้างได้
    responses:
      w: {body: {code: 0, msg: Success, count: 1, payload: [{datetime: "2026-09-24T01:00:00Z", username: u1, amount: 100, status: 3}]}}
      p2p: {error: timeout}
    expect:
      status: ok
      fields: {รายการค้าง: "1 รายการ"}
      no_fields: [ถอน P2P ที่ยังมียอดเหลือต้องจัดการ]
  - name: ไม่มีค้าง
    input: {date: "2026-09-22"}
    responses:
      w: {body: {code: 0, msg: Success, count: 1, payload: [{datetime: "2026-09-22T01:00:00Z", username: u1, amount: 100, status: 1}]}}
      p2p: {body: {code: 0, count: 0}}
    expect:
      status: not_found
      calls:
        w: {query: {date: "2026-09-22"}}
  - name: หลังบ้านตอบ error (ไม่มี count)
    responses:
      w: {body: {code: 1, msg: "context deadline exceeded", payload: []}}
      p2p: {body: {code: 0, count: 0}}
    expect: {status: error, error_code: schema_mismatch}
