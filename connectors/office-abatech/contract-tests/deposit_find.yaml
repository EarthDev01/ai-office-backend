tool: deposit_find
cases:
  - name: ค้นด้วยยูส ผู้ทำรายการว่าง = ระบบ
    service: K11S
    input: {username: "abc0812345678"}
    responses:
      list:
        body:
          code: 0
          msg: Success
          count: 2
          payload:
            - {id: "66f2b0000000000000000002", datetime: "2026-09-24T02:10:11Z", username: "abc0812345678", amount: 500, bonus: 50, bonus_id: 3, bonus_name: "ฝากแรก", before_credit: 12.5, after_credit: 562.5, channel: AUTO, status: 1, operator_id: "", operator_name: "", comment: "", bank_number: "9876543210", bank_code: SCB, bank_name: "นาย ก"}
            - {id: "66f2b0000000000000000003", datetime: "2026-09-24T01:00:00Z", username: "abc08123456789", amount: 100, bonus: 0, channel: AUTO, status: 2, operator_name: ""}
    expect:
      status: ok
      calls:
        list: {path: /GetDepositStatementListByFilter/K11S, query: {date: "2026-09-24", status: "0", search: abc0812345678, limit: "200"}}
      fields: {จำนวนที่แสดง: "1 รายการ"}
      table_rows: 1
      table_cells: [["24/09/2026 09:10", abc0812345678, "500.00", "50.00", สำเร็จ, "", AUTO]]
      model_context: {statuses_found: [สำเร็จ]}
      link: "/Deposit?service=SzExUw==&web=K11S"
  - name: กรองสถานะเครดิตค้างและยอด
    service: K11S
    input: {status: 6, amount: 300, date: "2026-09-23"}
    responses:
      list:
        body:
          code: 0
          msg: Success
          count: 3
          payload:
            - {datetime: "2026-09-23T02:00:00Z", username: "u1", amount: 300, bonus: 0, status: 6, operator_name: "admin01", channel: MANUAL}
            - {datetime: "2026-09-23T01:00:00Z", username: "u2", amount: 300, status: 1, operator_name: ""}
            - {datetime: "2026-09-23T00:30:00Z", username: "u3", amount: 200, status: 6, operator_name: ""}
    expect:
      status: ok
      calls: {list: {query: {date: "2026-09-23", status: "0"}}}
      table_rows: 1
      table_cells: [["23/09/2026 09:00", u1, "300.00", "0.00", เครดิตค้าง, admin01, MANUAL]]
  - name: ไม่พบ
    input: {username: "nobody"}
    responses:
      list: {body: {code: 0, msg: Success, count: 0, payload: []}}
    expect: {status: not_found}
  - name: host ตอบ code 1
    responses:
      list: {body: {code: 1, msg: "err", payload: []}}
    expect: {status: error}
  - name: หลังเที่ยงคืนค้นของวันใหม่
    now: "2026-09-25T00:02:00+07:00"
    input: {username: "abc0812345678"}
    responses:
      list: {body: {code: 0, msg: Success, count: 0, payload: []}}
    expect: {status: not_found, calls: {list: {query: {date: "2026-09-25"}}}}
