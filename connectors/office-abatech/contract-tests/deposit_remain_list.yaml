# DepositBankRemain → {code:0, msg:"", payload:[DepositBankStatementModel] | null} (deposit/model.go:340-352)
tool: deposit_remain_list
cases:
  - name: ตกค้างสองสาเหตุ
    responses:
      r:
        body:
          code: 0
          msg: ""
          payload:
            - {id: 66f2a1c0e4b0a1b2c3d4e5f6, bank_number: "9876543210", bank_code: SCB, datetime: "2026-09-24T05:15:00Z", deposit: 500, withdraw: 0, acc_bank_code: KBANK, status: 2, comment: ไม่พบสมาชิก}
            - {id: 66f2a1c0e4b0a1b2c3d4e5f7, bank_number: "9876543211", bank_code: KTB, datetime: "2026-09-24T03:00:00Z", deposit: 300, withdraw: 0, acc_bank_code: KBANK, status: 2, comment: ไม่พบสมาชิก}
            - {id: 66f2a1c0e4b0a1b2c3d4e5f8, bank_number: "9876543212", bank_code: BBL, datetime: "2026-09-24T02:00:00Z", deposit: 1000, withdraw: 0, acc_bank_code: KBANK, status: 3, comment: โปรโมชั่นผิดพลาด}
    expect:
      status: ok
      calls:
        r: {path: /DepositBankRemain/DEMO-SVC, query: {date: "2026-09-24", bank_number: ""}}
      fields:
        รายการตกค้าง: "3 รายการ"
        ยอดรวม: "1,800.00 บาท"
        รายการล่าสุดเข้าเมื่อ: "24/09/2026 12:15"
      table_rows: 2
      table_cells:
        - [ไม่พบสมาชิก, "2 รายการ", "800.00"]
      model_context: {has_remain: true}
      link: "/Deposit?service=REVNTy1TVkM="
  - name: ไม่มีตกค้าง
    input: {date: "2026-09-21"}
    responses:
      r: {body: {code: 0, msg: "", payload: null}}
    expect:
      status: not_found
      calls:
        r: {query: {date: "2026-09-21"}}
  - name: JSON พัง (ไม่ส่ง date → หลังบ้านเขียน 2 ก้อน)
    responses:
      r: {raw: '{"code":1,"msg":"PARAMETER DATE NOT FLOUND"}{"code":0,"msg":"","payload":null}'}
    expect: {status: error, error_code: bad_json}
