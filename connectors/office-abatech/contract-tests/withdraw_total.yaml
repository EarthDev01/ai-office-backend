# GET /WithdrawByUsername → {code, msg, payload[] | null} · นับเฉพาะ status 1 · แถวมี bank_number (ต้องไม่ขึ้นการ์ด)
tool: withdraw_total
cases:
  - name: ไม่ระบุวัน = ตั้งแต่สมัคร · นับเฉพาะสำเร็จ
    input: {username: abc123}
    responses:
      w:
        body:
          code: 0
          msg: ""
          payload:
            - {datetime: "2026-09-24T02:10:11Z", username: abc123, amount: 500, status: 1, bank_number: "9876543210", acc_bank_number: "1112223334"}
            - {datetime: "2026-09-23T02:00:00Z", username: abc123, amount: 300, status: 2}
            - {datetime: "2026-09-10T02:00:00Z", username: abc123, amount: 1000, status: 1}
            - {datetime: "2026-09-01T02:00:00Z", username: abc123, amount: 50, status: 4}
    expect:
      status: ok
      calls:
        w: {path: /WithdrawByUsername/DEMO-SVC, query: {username: abc123, start_date: "2000-01-01 00:00:00", end_date: "2026-09-24 23:59:00"}}
      fields: {ยอดถอนสำเร็จ: "1,500.00 บาท", สำเร็จ: "2 รายการ", ทั้งหมด: "4 รายการ", ยังไม่จบ: "1 รายการ", ถอนสำเร็จล่าสุด: "24/09/2026 09:10"}
      model_context: {has_withdraw: true, has_open: true}
      link: /Member?service=REVNTy1TVkM=
  - name: ระบุช่วง · ไม่มีรายการ (payload null)
    input: {username: nobody, date_from: "2026-09-01", date_to: "2026-09-15"}
    responses:
      w: {body: {code: 0, msg: "", payload: null}}
    expect:
      status: not_found
      calls:
        w: {query: {start_date: "2026-09-01 00:00:00", end_date: "2026-09-15 23:59:00"}}
  - name: backend ตอบ code 1
    input: {username: abc123}
    responses:
      w: {body: {code: 1, msg: ไม่พบข้อมูล}}
    expect: {status: error}
