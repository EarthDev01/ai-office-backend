tool: deposit_remain_summary
cases:
  - name: ตกค้างหลายสาเหตุ
    service: K11S
    responses:
      rem:
        body:
          code: 0
          msg: ""
          payload:
            - {id: "66f2a1c0e4b0a1b2c3d4e5f6", bank_number: "9876543210", bank_code: SCB, datetime: "2026-09-24T03:15:00Z", deposit: 500, withdraw: 0, acc_bank_number: "1234567890", acc_bank_code: KBANK, acc_bank_name: "บจก. ตัวอย่าง", status: 2, comment: "ไม่พบสมาชิก"}
            - {id: "66f2a1c0e4b0a1b2c3d4e5f7", bank_number: "9876543211", bank_code: KTB, datetime: "2026-09-24T03:20:00Z", deposit: 300, withdraw: 0, acc_bank_number: "1234567890", acc_bank_code: KBANK, acc_bank_name: "บจก. ตัวอย่าง", status: 2, comment: "ไม่พบสมาชิก"}
            - {id: "66f2a1c0e4b0a1b2c3d4e5f8", bank_number: "9876543212", bank_code: BBL, datetime: "2026-09-24T03:30:00Z", deposit: 1000, withdraw: 0, acc_bank_number: "1234567890", acc_bank_code: KBANK, acc_bank_name: "บจก. ตัวอย่าง", status: 3, comment: "สมาชิกยังไม่เลือกรับโบนัส"}
    expect:
      status: ok
      calls: {rem: {path: /DepositBankRemain/K11S, query: {date: "2026-09-24"}}}
      fields: {จำนวนรายการตกค้าง: "3 รายการ", ยอดตกค้างรวม: "1,800.00 บาท"}
      no_fields: [มีรายการมากกว่าที่ระบบส่งมา]
      table_rows: 2
      table_cells:
        - [ไม่พบสมาชิก, "2 รายการ", "800.00"]
        - [สมาชิกยังไม่เลือกรับโบนัส, "1 รายการ", "1,000.00"]
      model_context: {has_remain: true, statuses: [ตกค้าง, ตกค้างโปรโมชั่น]}
  - name: ไม่มีรายการตกค้าง (payload null)
    service: K11S
    input: {date: "2026-09-21"}
    responses:
      rem: {body: {code: 0, msg: "", payload: null}}
    expect:
      status: not_found
      calls: {rem: {query: {date: "2026-09-21"}}}
  - name: หลังเที่ยงคืน
    now: "2026-09-25T00:00:10+07:00"
    responses:
      rem: {body: {code: 0, msg: "", payload: []}}
    expect: {status: not_found, calls: {rem: {query: {date: "2026-09-25"}}}}
  - name: JSON สองก้อน (ไม่ส่ง date) = parse ไม่ได้
    responses:
      rem: {raw: '{"code":1,"msg":"PARAMETER DATE NOT FLOUND"}{"code":0,"msg":"","payload":null}'}
    expect: {status: error, error_code: bad_json}
