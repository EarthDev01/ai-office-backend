unknown_message: สถานะนี้ยังไม่มีคำอธิบายในระบบ — เปิดรายการนั้นในหน้าจริงเพื่อตรวจ หรือติดต่อทีม support ในห้องแชทประจำของเว็บ
tables:
  withdraw:
    label: สถานะรายการถอน
    source: office-abatech components/Withdraw/WithdrawStatementV2.vue:220-285 (ป้ายสถานะ + ปุ่มจัดการของแถว) · HistoryWithdraw.vue:88-102
    questions: [BQ-29, BQ-03, BQ-04, BQ-06]
    entries:
      - {code: 1, label: สำเร็จ, aliases: [โอนแล้ว], meaning: โอนเงินให้สมาชิกเรียบร้อยแล้ว (ถ้าหน้าจอขึ้นว่าต้องโอนเอง แปลว่ายังมียอดที่ต้องโอนเพิ่ม), next_action: ไม่ต้องทำอะไรต่อ เว้นแต่หน้าจอขึ้นป้ายต้องโอนเอง, final: true}
      - {code: 2, label: รอโอน, aliases: [รอคิว], meaning: รายการรอระบบหรือพนักงานโอนเงิน, next_action: ผู้มีสิทธิ์กดป้ายสถานะของแถวนั้นในหน้ารายการถอนเพื่อจัดการ}
      - {code: 3, label: กำลังตรวจสอบ, aliases: [รอตรวจสอบ], meaning: รายการอยู่ระหว่างตรวจสอบก่อนโอน, next_action: รอการตรวจสอบ ถ้าค้างนานให้ผู้มีสิทธิ์ตรวจที่หน้ารายการถอน}
      - {code: 4, label: ยกเลิก, meaning: รายการถอนถูกยกเลิกแล้ว, next_action: ไม่ต้องทำอะไรต่อ, final: true, tone: bad}
      - {code: 5, label: ทำรายการอีกครั้ง, meaning: สั่งให้ระบบโอนรายการนี้ใหม่แล้ว, next_action: รอระบบโอน ถ้ายังไม่สำเร็จผู้มีสิทธิ์กดป้ายสถานะเพื่อจัดการ}
      - {code: 6, label: กำลังขอ OTP, meaning: ระบบกำลังขอรหัส OTP จากธนาคารเพื่อโอน, next_action: รอระบบ ถ้าค้างนานผู้มีสิทธิ์กดป้ายสถานะเพื่อจัดการ}
      - {code: 7, label: ขอ OTP สำเร็จ รอ OTP, meaning: ขอรหัส OTP สำเร็จแล้วและรอรับรหัส, next_action: รอระบบ ถ้าค้างนานผู้มีสิทธิ์กดป้ายสถานะเพื่อจัดการ}
      - {code: 8, label: ขอ OTP ไม่สำเร็จ, meaning: ขอรหัส OTP จากธนาคารไม่สำเร็จ, next_action: ผู้มีสิทธิ์กดป้ายสถานะของแถวนั้นในหน้ารายการถอนเพื่อทำรายการใหม่, tone: bad}
      - {code: 9, label: ได้รับ OTP รอยืนยัน, meaning: ได้รหัส OTP แล้วแต่ยังไม่ได้ยืนยันการโอน, next_action: ผู้มีสิทธิ์กดป้ายสถานะของแถวนั้นเพื่อยืนยัน}
      - {code: 10, label: ไม่ได้รับ OTP, aliases: [OTP ไม่ถูกต้อง], meaning: ไม่ได้รับรหัส OTP หรือรหัสไม่ถูกต้อง, next_action: ผู้มีสิทธิ์กดป้ายสถานะของแถวนั้นเพื่อทำรายการใหม่}
      - {code: 11, label: ถูกซ่อน, meaning: รายการถูกซ่อนจากรายการปกติ, next_action: ผู้มีสิทธิ์กดป้ายสถานะของแถวนั้นเพื่อตรวจ}
      - {code: 12, label: เกิดข้อผิดพลาด, aliases: [ไม่สำเร็จ], meaning: ระบบโอนไม่สำเร็จ, next_action: ผู้มีสิทธิ์ดูหมายเหตุของรายการแล้วกดป้ายสถานะเพื่อทำรายการใหม่, tone: bad}
      - {code: 13, label: ตรวจสอบยอดธนาคาร, aliases: [รบกวนตรวจสอบยอดที่ธนาคาร], meaning: ระบบไม่แน่ใจว่าเงินโอนออกไปแล้วหรือยัง, next_action: ตรวจสเตทเม้นธนาคารก่อน ถ้าเงินออกแล้วผู้มีสิทธิ์จึงยืนยันเป็นสำเร็จ ห้ามทำรายการซ้ำก่อนตรวจ}
      - {code: 14, label: ตัดเครดิตไม่สำเร็จ, meaning: ระบบตัดเครดิตของสมาชิกไม่สำเร็จ, next_action: ยังไม่มีขั้นตอนในหน้าจอ ให้ติดต่อทีม support ในห้องแชทประจำของเว็บ, tone: bad}
      - {code: 15, label: ส่งรายการถอนสำเร็จ รอยืนยัน, meaning: ส่งรายการถอนออกไปแล้ว รอผลยืนยันกลับมา, next_action: รอระบบยืนยัน ถ้าค้างนานผู้มีสิทธิ์กดป้ายสถานะเพื่อตรวจ}
      - {code: 16, label: ได้รับรายการถอน รอยืนยัน, meaning: ปลายทางรับรายการถอนแล้ว รอยืนยันผล, next_action: รอระบบยืนยัน}
  deposit:
    label: สถานะรายการฝาก
    source: office-abatech components/Deposit/DepositStatementV2.vue:305-335 (ค่าอื่นแสดงว่าไม่สำเร็จ) · Docs/go_deposit_mootui.md (ความหมาย)
    questions: [BQ-29, BQ-02, BQ-06]
    entries:
      - {code: 1, label: สำเร็จ, meaning: เติมเครดิตให้สมาชิกแล้ว, next_action: ไม่ต้องทำอะไรต่อ, final: true}
      - {code: 2, label: รอคิว, meaning: รายการฝากยังไม่ได้เติมเครดิต, next_action: ผู้มีสิทธิ์กดป้ายสถานะของแถวนั้นในหน้ารายการฝากเพื่อจัดการ}
      - {code: 5, label: ติดกิจกรรม, meaning: รายการฝากติดเงื่อนไขกิจกรรมหรือโปรโมชั่น, next_action: ผู้มีสิทธิ์กดป้ายสถานะของแถวนั้นในหน้ารายการฝากเพื่อจัดการ}
      - {code: 6, label: เครดิตค้าง, meaning: สมาชิกยังมีเครดิตค้างอยู่ ระบบจึงยังไม่เติมเครดิตรายการนี้, next_action: ผู้มีสิทธิ์กดป้ายสถานะของแถวนั้นเพื่อจัดการเครดิตค้าง}
      - {code: 0, label: ไม่สำเร็จ, meaning: เติมเครดิตไม่สำเร็จ, next_action: ผู้มีสิทธิ์กดป้ายสถานะของแถวนั้นในหน้ารายการฝากเพื่อตรวจและจัดการ, tone: bad}
  bank_statement:
    label: สถานะรายการเงินเข้าบัญชีฝาก (รายการตกค้าง)
    source: GOTOPOPOFFICE deposit/repository.go DepositBankRemain (status ∉ {0,1,99}) · Docs/go_deposit_mootui.md (ความหมาย) · สาเหตุจริงอยู่ในช่องหมายเหตุ
    questions: [BQ-02, BQ-29]
    entries:
      - {code: 1, label: ประมวลผลแล้ว, meaning: เติมเครดิตจากรายการนี้แล้ว, next_action: ไม่ต้องทำอะไรต่อ, final: true}
      - {code: 2, label: เติมเครดิตไม่ได้, aliases: [ตกค้าง], meaning: ระบบเติมเครดิตจากเงินเข้ารายการนี้ไม่ได้ เช่น หาสมาชิกไม่พบ บัญชีปิด หรือเช็คเครดิตไม่ผ่าน (สาเหตุอยู่ในช่องหมายเหตุ), next_action: ผู้มีสิทธิ์เปิดแท็บรายการตกค้างในหน้ารายการฝาก ดูหมายเหตุแล้วจัดการ}
      - {code: 3, label: โปรโมชั่นผิดพลาด, meaning: ระบบใส่โปรโมชั่นให้รายการนี้ไม่สำเร็จ, next_action: ผู้มีสิทธิ์เปิดแท็บรายการตกค้างในหน้ารายการฝาก ดูหมายเหตุแล้วจัดการ, tone: bad}
  bank_account:
    label: สถานะบัญชีฝากของเว็บ
    source: GOTOPOPOFFICE deposit/repository.go DepositBankSummaryV2 (bank_config.status · deposit_type=all = status น้อยกว่าสอง) · AccountDeposit.vue
    questions: [BQ-10]
    entries:
      - {code: 1, label: เปิดใช้งาน, meaning: บัญชีฝากนี้เปิดใช้งานอยู่, next_action: ไม่ต้องทำอะไรต่อ}
      - {code: 0, label: ปิดใช้งาน, meaning: บัญชีฝากนี้ปิดใช้งานอยู่, next_action: ผู้มีสิทธิ์เปิดได้ที่เมนูจัดการบัญชีธนาคาร แท็บจัดการบัญชี}
  bill:
    label: สถานะบิลค่าใช้จ่ายระบบ
    source: office-abatech components/billpayment/statuscard.vue:3-20
    questions: [BQ-44, BQ-46]
    entries:
      - {code: 1, label: ฉบับร่าง, meaning: บิลยังเป็นฉบับร่าง, next_action: ยังไม่ต้องชำระ}
      - {code: 2, label: ยกเลิก, meaning: บิลถูกยกเลิกแล้ว, next_action: ไม่ต้องชำระ, final: true, tone: bad}
      - {code: 3, label: รอจ่าย, meaning: บิลรอชำระ, next_action: ชำระตามช่องทางในบิลที่เมนูบิลค่าใช้จ่ายระบบ}
      - {code: 4, label: จ่ายแล้ว รอคอนเฟิร์ม, meaning: ชำระแล้ว รอผู้ให้บริการยืนยัน, next_action: รอการยืนยัน ถ้านานผิดปกติให้ติดต่อทีม support ในห้องแชทประจำของเว็บ}
      - {code: 5, label: ค้างชำระ, meaning: บิลเลยกำหนดแล้วยังไม่ชำระ, next_action: ชำระโดยเร็วตามช่องทางในบิล}
      - {code: 6, label: สำเร็จ, meaning: ชำระและยืนยันเรียบร้อยแล้ว, next_action: ไม่ต้องทำอะไรต่อ, final: true}
  bonus:
    label: สถานะโปรโมชั่น
    source: office-abatech components/Bonus/BonusList.vue:174-177
    questions: [BQ-11]
    entries:
      - {code: 1, label: เปิดใช้งาน, meaning: โปรโมชั่นเปิดอยู่ (ยังต้องอยู่ในช่วงวันเวลาที่ตั้งไว้), next_action: ไม่ต้องทำอะไรต่อ}
      - {code: 0, label: ปิดใช้งาน, meaning: โปรโมชั่นปิดอยู่, next_action: ผู้มีสิทธิ์เปิดได้ที่เมนูจัดการโปรโมชั่น}
