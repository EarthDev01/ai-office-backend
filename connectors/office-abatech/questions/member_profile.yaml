# คำถามรายยูส — mirror แท็บในหน้าข้อมูลสมาชิก (office-abatech components/Member/MemberInfo.vue)
# ตรวจกับโค้ดจริง GOTOPOPOFFICE ff8a4ef · office-abatech · 08/10/2026 · ทุกเส้นอ่านอย่างเดียว (Find / Aggregate / GET ไป agent)
#
# สิทธิ์: หน้าข้อมูลสมาชิกเปิดจากรายการสมาชิก (MemberList.vue:210 · เมนู P006) และแท็บประวัติใน MemberInfo ไม่มี code ของตัวเอง
#   → tool รายยูสใช้ rule `member` (P006) · ยกเว้น withdraw_total ใช้ `withdraw_list` ให้ตรงกับ deposit_total / withdraw_find (ข้อมูลชุดเดียวกับหน้ารายการถอน)
# ลิงก์: หน้าข้อมูลสมาชิกไม่มี route ของตัวเอง (เป็นหน้าต่างใน /Member) → ลิงก์ไป /Member แล้วบอกแท็บใน note
# PII: ไม่หยิบ bank_number / acc_bank_* / bank_name / phone / token / ยูสของสมาชิกคนอื่น (username_child, ผู้ถูกแนะนำ) ขึ้นการ์ดหรือส่งให้โมเดล
#
# ไม่ใช้ GetTicketByUser (ticket/route.go:19) — repo คืน [] ทันทีถ้าไม่ส่ง type = "<ticket_type>-<id config>" (ticket/repository.go:63-65)
#   ซึ่งโมเดลไม่รู้ → member_randombox อ่านแถว channel ticket_pay จาก DepositWalletStatementByUser (collection wallet_statement เดียวกัน)
questions: [BQ-06]
keywords: [ยูส, สมาชิก, ถอนทั้งหมด, ยอดถอน, ถอนรวม, เล่น, เกม, เดิมพัน, เกมค้าง, เคลื่อนไหว, แนะนำ, เพื่อน, ค่าแนะนำ, กิจกรรม, กงล้อ, กล่องสุ่ม, กระเป๋า, แต้ม, ยืนยันยอด, สรุป, รายงานสมาชิก]
tools:
  # GET /api/WithdrawByUsername/:service?username&start_date&end_date (GOTOPOPOFFICE withdraw/route.go:28 · handler :112-141 · repo withdraw/repository.go:104-128)
  #   frontend: components/History/HistoryWithdraw.vue:206-226 ส่ง "YYYY-MM-DD HH:mm:ss" · backend GetFilterDateTimeBetweenV2 (end + 1 นาที · $lt) → end "23:59:00" = ถึงสิ้นวัน
  #   ไม่แบ่งหน้า · เรียง datetime ล่าสุดก่อน · ไม่มีข้อมูล = payload null · error = {code:1, msg:"ไม่พบข้อมูล"}
  #   ⚠️ แถวมี bank_number / acc_bank_* / bank_name ของลูกค้า → ไม่ประกาศใน schema/values
  - name: withdraw_total
    description: >-
      ยอดถอนสำเร็จรวมของสมาชิก 1 ยูส ตั้งแต่สมัคร (หรือช่วงวันที่ระบุ) พร้อมจำนวนรายการ
      · ใช้เมื่อถามว่ายูสนี้ถอนไปทั้งหมดเท่าไหร่/ถอนรวมเท่าไหร่ โดยไม่ระบุวันเดียว · ดูรายการถอนรายวันให้ใช้ withdraw_find
    questions: [BQ-06]
    permission: withdraw_list
    freshness: summary
    answer: "ยอดถอนสำเร็จของ {input.username}"
    input:
      username: {type: string, required: true, pattern: "^[A-Za-z0-9_.@-]{2,40}$", description: ยูสเซอร์เนมของสมาชิก}
      date_from: {type: date, description: วันแรก YYYY-MM-DD (ไม่ระบุ = ตั้งแต่สมัคร)}
      date_to: {type: date, description: วันสุดท้าย YYYY-MM-DD (ไม่ระบุ = วันนี้)}
    calls:
      - id: w
        method: GET
        path: /WithdrawByUsername/{service}
        query:
          username: "{input.username}"
          start_date: "{date:input.date_from|date:beginning} 00:00:00"
          end_date: "{date:input.date_to|date:today} 23:59:00"
        cache_ttl: 30
        timeout_ms: 20000
        schema:
          type: array
          nullable: true
          items:
            type: object
            required: [amount, status]
            properties:
              datetime: {type: string}
              amount: {type: number}
              status: {type: integer}
    values:
      - {name: ok_sum, from: w, filter: "item.status == 1", agg: sum, field: amount, default: 0}
      - {name: ok_count, from: w, filter: "item.status == 1", agg: count}
      - {name: all_count, from: w, agg: count}
      - {name: open_count, from: w, filter: "!in(item.status, 1, 4, 11)", agg: count}
      - {name: last_ok_at, from: w, filter: "item.status == 1", agg: first, field: datetime}
    not_found: {when: "all_count == 0", message: ยูสนี้ยังไม่มีรายการถอนในช่วงที่ถาม}
    card:
      style: stat
      title: ยอดถอนสำเร็จของสมาชิก
      fields:
        - {label: ยอดถอนสำเร็จ, value: ok_sum, format: money, suffix: " บาท"}
        - {label: สำเร็จ, value: ok_count, format: int, suffix: " รายการ"}
        - {label: ทั้งหมด, value: all_count, format: int, suffix: " รายการ"}
        - {label: ยังไม่จบ, value: open_count, format: int, suffix: " รายการ", when: "open_count > 0"}
        - {label: ถอนสำเร็จล่าสุด, value: last_ok_at, format: datetime, when: "ok_count > 0"}
      note: นับเฉพาะรายการสถานะสำเร็จ ดูรายละเอียดได้ที่หน้าข้อมูลสมาชิก แท็บรายการถอน
      link: {label: เปิดรายการสมาชิก, path: "/Member?service={service_b64}"}
    model_context:
      - {name: has_withdraw, type: bool, expr: "ok_count > 0"}
      - {name: has_open, type: bool, expr: "open_count > 0"}
      - {name: note, type: text, text: ยอดและจำนวนแสดงในการ์ดแล้ว}
    follow_ups:
      - {label: "ยอดฝากทั้งหมดของ {input.username}", ask: "ยูส {input.username} ฝากมาทั้งหมดเท่าไหร่"}
      - {label: "รายการถอนวันนี้ของ {input.username}", ask: "รายการถอนวันนี้ของยูส {input.username}"}
      - {label: "สรุป {input.username} เดือนนี้", ask: "สรุปยูส {input.username} เดือนนี้"}

  # POST /api/report-user-online/:service {byfilter, date, username} (route/Member.go:21 · controller/Member.go:414-494 · aggregate อ่านอย่างเดียว)
  #   frontend: components/Dashboard/DashboardUserPerUser.vue:356-366 (แท็บ รายงานสมาชิก ใน MemberInfo) · month → date "YYYY-MM" · day → "YYYY-MM-DD"
  #   byfilter "day" = report_active_user_hour (date "YYYY-MM-DD-HH") · ค่าอื่น/ว่าง = report_active_user_day (date "YYYY-MM-DD")
  #   date ใช้เป็น regex → ส่งเดือน "YYYY-MM" หรือวัน "YYYY-MM-DD" ก็กรองได้ทั้งสองแบบ (input ผ่าน pattern แล้ว)
  #   response helper.ResponseV2 {code, msg, payload[ReportUserOnline] | null}
  #   ⚠️ countDeposit / countWithdraw / newMember ได้ 0/false เสมอ: model.ReportUserOnline (model/member.go:150) ไม่มี bson tag
  #      → driver ใช้ชื่อตัวเล็ก (countdeposit) ไม่ตรงกับ key ที่ $project (countDeposit) → ไม่ใช้จำนวนรายการ
  - name: member_report
    description: >-
      สรุปยอดฝาก ยอดถอน โบนัส ของสมาชิก 1 ยูส แยกรายวันในเดือนที่ถาม (ไม่ระบุ = เดือนนี้) หรือของวันเดียว
      · period day = แยกรายชั่วโมงของวันที่ระบุ · ไม่บอกจำนวนรายการ
    questions: [BQ-06]
    permission: member
    freshness: summary
    answer: "สรุปยอดของ {input.username}"
    input:
      username: {type: string, required: true, pattern: "^[A-Za-z0-9_.@-]{2,40}$", description: ยูสเซอร์เนมของสมาชิก}
      month: {type: string, pattern: "^20[0-9]{2}-(0[1-9]|1[0-2])$", description: เดือน YYYY-MM (ไม่ระบุ = เดือนนี้)}
      date: {type: date, description: วันเดียว YYYY-MM-DD (ระบุแล้วไม่ต้องส่ง month)}
      period: {type: string, enum: [day, month], description: day = แยกรายชั่วโมงของวันที่ระบุ · ไม่ระบุหรือ month = แยกรายวัน}
    calls:
      - id: r
        method: POST
        path: /report-user-online/{service}
        body:
          byfilter: "{input.period}"
          date: "{date:input.date|input.month|month:today}"
          username: "{input.username}"
        cache_ttl: 60
        timeout_ms: 20000
        schema:
          type: array
          nullable: true
          items:
            type: object
            required: [date]
            properties:
              date: {type: string}
              deposit: {type: number}
              withdraw: {type: number}
              bonus: {type: number}
    values:
      - {name: rows_count, from: r, agg: count}
      - {name: rows, from: r, sort_by: date, order: asc}
      - {name: sum_deposit, from: r, agg: sum, field: deposit, default: 0}
      - {name: sum_withdraw, from: r, agg: sum, field: withdraw, default: 0}
      - {name: sum_bonus, from: r, agg: sum, field: bonus, default: 0}
      - {name: sum_net, expr: "sum_deposit - sum_withdraw"}
    not_found: {when: "rows_count == 0", message: ยังไม่มีรายงานของยูสนี้ในช่วงที่ถาม}
    card:
      style: table
      title: รายงานสมาชิก
      fields:
        - {label: ยอดฝากรวม, value: sum_deposit, format: money, suffix: " บาท"}
        - {label: ยอดถอนรวม, value: sum_withdraw, format: money, suffix: " บาท"}
        - {label: โบนัสรวม, value: sum_bonus, format: money, suffix: " บาท"}
        - {label: ฝากลบถอน, value: sum_net, format: money, suffix: " บาท"}
      table:
        rows: rows
        max_rows: 31
        columns:
          - {label: วันที่, field: date}
          - {label: ฝาก, field: deposit, format: money}
          - {label: ถอน, field: withdraw, format: money}
          - {label: โบนัส, field: bonus, format: money}
      note: มาจากรายงานที่ระบบสรุปไว้ แสดงเฉพาะวันที่มีความเคลื่อนไหว · ดูกราฟได้ที่หน้าข้อมูลสมาชิก แท็บรายงานสมาชิก
      link: {label: เปิดรายการสมาชิก, path: "/Member?service={service_b64}"}
    model_context:
      - {name: net_positive, type: bool, expr: "sum_net > 0"}
      - {name: note, type: text, text: ยอดแสดงในการ์ดแล้ว ฝากลบถอนยังไม่หักโบนัส}
    follow_ups:
      - {label: "ยอดฝากทั้งหมดของ {input.username}", ask: "ยูส {input.username} ฝากมาทั้งหมดเท่าไหร่"}
      - {label: "ยอดถอนทั้งหมดของ {input.username}", ask: "ยูส {input.username} ถอนไปทั้งหมดเท่าไหร่"}
      - {label: "รายการเล่นของ {input.username}", ask: "ยูส {input.username} เล่นเกมอะไร ยอดเดิมพันเท่าไหร่"}

  # POST /api/GetMemberTransectionGame/:service {start_date, end_date, username} (member/route.go:44 · handler :821-839 · repo member/repository.go:1125-1150)
  #   backend GET <agent APIURL>/seamless/transaction?FromTime&ToTime&key (อ่านอย่างเดียว · ALLMYBEEF อ่าน deposit_statement เพิ่มเพื่อหา ref)
  #   frontend: components/Member/TransectionGame.vue:222-262 (แท็บ รายการเล่น) · ส่ง "YYYY-MM-DD HH:mm" · หน้าจอจำกัดช่วงไม่เกินเจ็ดวัน
  #   response = body ของ agent ตรง ๆ {status:{code:200}, data:{TransactionData[], SummaryAmountData{BetAmount, WinlossAmount}}} → envelope raw
  #   หน้าจอตัดแถวที่ทั้งยอดเดิมพันและยอดได้เสียเป็นศูนย์ออก (TransectionGame.vue:239-246) → นับแบบเดียวกัน
  - name: member_games
    description: >-
      รายการเล่นของสมาชิก 1 ยูส แยกตามเกม พร้อมยอดเดิมพันรวมและยอดแพ้ชนะ ของวันนี้หรือช่วงที่ถาม
      · ดูได้ครั้งละไม่เกินเจ็ดวัน (หน้าจอจำกัดไว้)
    questions: [BQ-06]
    permission: member
    freshness: summary
    answer: "รายการเล่นของ {input.username}"
    input:
      username: {type: string, required: true, pattern: "^[A-Za-z0-9_.@-]{2,40}$", description: ยูสเซอร์เนมของสมาชิก}
      date_from: {type: date, description: วันแรก YYYY-MM-DD (ไม่ระบุ = วันนี้)}
      date_to: {type: date, description: วันสุดท้าย YYYY-MM-DD รวมทั้งวัน (ไม่ระบุ = เท่ากับวันแรก) · ห่างจากวันแรกไม่เกินเจ็ดวัน}
    calls:
      - id: g
        method: POST
        path: /GetMemberTransectionGame/{service}
        body:
          start_date: "{date:input.date_from|date:today} 00:00"
          end_date: "{date:input.date_to|date:input.date_from|date:today} 23:59"
          username: "{input.username}"
        envelope: raw
        cache_ttl: 30
        timeout_ms: 25000
        schema:
          type: object
          required: [status]
          properties:
            status:
              type: object
              properties:
                code: {type: integer}
            data:
              type: object
              nullable: true
              properties:
                TransactionData:
                  type: array
                  nullable: true
                  items:
                    type: object
                    properties:
                      GameListName: {type: string}
                      TransactionBetAmount: {type: number}
                      TransactionSettleAmount: {type: number}
                      UpdatedAt: {type: number}
                SummaryAmountData:
                  type: object
                  nullable: true
                  properties:
                    BetAmount: {type: number}
                    WinlossAmount: {type: number}
    values:
      - {name: played, from: g, path: data.TransactionData, filter: "item.TransactionBetAmount != 0 || item.TransactionSettleAmount != 0", agg: count}
      - {name: by_game, from: g, path: data.TransactionData, filter: "item.TransactionBetAmount != 0 || item.TransactionSettleAmount != 0", group_by: GameListName, field: TransactionBetAmount, sort_by: sum, order: desc, limit: 20}
      - {name: bet_total, from: g, path: data.SummaryAmountData.BetAmount, default: 0}
      - {name: winloss, from: g, path: data.SummaryAmountData.WinlossAmount, default: 0}
      - {name: last_play, from: g, path: data.TransactionData, filter: "item.TransactionBetAmount != 0 || item.TransactionSettleAmount != 0", sort_by: UpdatedAt, order: desc, agg: first, field: UpdatedAt}
    not_found: {when: "played == 0", message: ไม่พบรายการเล่นของยูสนี้ในช่วงที่ถาม (ดูได้ครั้งละไม่เกินเจ็ดวัน ลองระบุช่วงอื่น)}
    card:
      style: list
      title: รายการเล่นของสมาชิก
      fields:
        - {label: ยอดเดิมพันรวม, value: bet_total, format: money, suffix: " บาท"}
        - {label: แพ้/ชนะ, value: winloss, format: money, suffix: " บาท"}
        - {label: รายการเล่น, value: played, format: int, suffix: " รายการ"}
        - {label: เล่นล่าสุด, value: last_play, format: datetime}
      table:
        rows: by_game
        columns:
          - {label: เกม, field: key}
          - {label: ยอดเดิมพัน, field: sum, format: money}
          - {label: จำนวน, field: count, format: int, suffix: " รายการ"}
      note: แยกตามเกม ยี่สิบเกมที่เดิมพันมากสุด · แพ้/ชนะ ตามที่หน้ารายการเล่นแสดง · ดูรายตาได้ที่หน้าข้อมูลสมาชิก แท็บรายการเล่น
      link: {label: เปิดรายการสมาชิก, path: "/Member?service={service_b64}"}
    model_context:
      - {name: has_play, type: bool, expr: "played > 0"}
      - {name: note, type: text, text: ยอดเดิมพันและเกมแสดงในการ์ดแล้ว}
    follow_ups:
      - {label: "เกมค้างของ {input.username}", ask: "ยูส {input.username} มีเกมค้างไหม"}
      - {label: "กิจกรรมของ {input.username}", ask: "ยูส {input.username} รับกิจกรรมอะไรไปบ้าง"}
      - {label: "สรุป {input.username} เดือนนี้", ask: "สรุปยูส {input.username} เดือนนี้"}

  # GET /api/AgentOutstanding/:service?username (route/Transection.go:30 · controller/Agent.go:199-258)
  #   backend GET <agent APIURL>/outstanding/<username> → payload = data.OutstandingData[] {Username, game_id, game_name, game_list_id, game_list_name, datetime}
  #   ⚠️ POST /AgentOutstanding = ลบเกมค้าง (route/Transection.go:31) — ห้ามใช้ · ใช้ GET เท่านั้น
  #   frontend: components/Member/Outstanding.vue:110-125 (หน้าต่าง เกมค้าง ใน MemberInfo)
  - name: member_outstanding
    description: >-
      เกมที่สมาชิก 1 ยูสเล่นค้างอยู่ (ยังไม่จบตา) ณ ตอนนี้ ดึงสดจากระบบเกม
    questions: [BQ-06]
    permission: member
    freshness: live
    answer: llm   # ต้องอธิบายผลของเกมค้าง
    input:
      username: {type: string, required: true, pattern: "^[A-Za-z0-9_.@-]{2,40}$", description: ยูสเซอร์เนมของสมาชิก}
    calls:
      - id: o
        method: GET
        path: /AgentOutstanding/{service}
        query: {username: "{input.username}"}
        cache_ttl: 0
        timeout_ms: 20000
        schema:
          type: array
          nullable: true
          items:
            type: object
            properties:
              game_name: {type: string}
              game_list_name: {type: string}
              datetime: {type: string}
    values:
      - {name: open_games, from: o, agg: count}
      - {name: rows, from: o, sort_by: datetime, order: desc, limit: 20}
    not_found: {when: "open_games == 0", message: ยูสนี้ไม่มีเกมค้าง}
    card:
      style: single
      title: เกมค้างของสมาชิก
      fields:
        - {label: เกมค้าง, value: open_games, format: int, suffix: " เกม"}
      table:
        rows: rows
        columns:
          - {label: เริ่มเล่นเมื่อ, field: datetime, format: datetime}
          - {label: ค่ายเกม, field: game_name}
          - {label: เกม, field: game_list_name}
      note: ดึงสดจากระบบเกม · ล้างเกมค้างทำได้ที่หน้าข้อมูลสมาชิก (ผู้ช่วยทำแทนไม่ได้)
      link: {label: เปิดรายการสมาชิก, path: "/Member?service={service_b64}"}
    model_context:
      - {name: has_outstanding, type: bool, expr: "open_games > 0"}
      - {name: note, type: text, text: รายชื่อเกมค้างแสดงในการ์ดแล้ว ผู้ช่วยล้างเกมค้างแทนไม่ได้ ผู้มีสิทธิ์ทำได้ที่หน้าข้อมูลสมาชิก}
    follow_ups:
      - {label: "รายการเล่นของ {input.username}", ask: "ยูส {input.username} เล่นเกมอะไร ยอดเดิมพันเท่าไหร่"}
