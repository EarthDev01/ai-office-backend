      - {label: "ยอดฝากทั้งหมดของ {input.username}", ask: "ยูส {input.username} ฝากมาทั้งหมดเท่าไหร่"}

  # GET /api/DepositWalletStatementByUser/:service?username&typename= (deposit/route.go:45) → กรอง channel ticket_pay
  #   แถว ticket_pay เขียนโดย topupserie_mootui controller/Ranking.go:1207-1222 · affiliate ticketService.go:372-388 · GOTOPOPOFFICE credit/repository.go:1450-1460
  #   = เงินรางวัลจากกล่องสุ่ม (type_action DEPOSIT · type_description TICKET · type_name "<ticket_type>-<id config>")
  #   ไม่ใช้ GetTicketByUser (ticket/route.go:19) — ต้องรู้ type "<ticket_type>-<id>" ล่วงหน้า ไม่ส่ง = [] (ticket/repository.go:63-65)
  #   หน้าจอ: components/ticket/TicketEvent.vue (แท็บ กิจกรรมกล่องสุ่ม · เลือกกล่องก่อน)
  - name: member_randombox
    description: >-
      เงินรางวัลที่สมาชิก 1 ยูสได้จากกล่องสุ่ม จำนวนครั้งและยอดรวม พร้อมรายการล่าสุด
    questions: [BQ-06]
    permission: member
    freshness: summary
    answer: "รางวัลกล่องสุ่มของ {input.username}"
    input:
      username: {type: string, required: true, pattern: "^[A-Za-z0-9_.@-]{2,40}$", description: ยูสเซอร์เนมของสมาชิก}
    calls:
      - id: wl
        method: GET
        path: /DepositWalletStatementByUser/{service}
        query: *walletq
        cache_ttl: 60
        timeout_ms: 20000
        schema: *walletschema
    values:
      - {name: fetched, from: wl, agg: count}
      - {name: box_count, from: wl, filter: "item.channel == 'ticket_pay' && item.type_action == 'DEPOSIT'", agg: count}
      - {name: box_sum, from: wl, filter: "item.channel == 'ticket_pay' && item.type_action == 'DEPOSIT'", agg: sum, field: amount, default: 0}
      - {name: last_at, from: wl, filter: "item.channel == 'ticket_pay' && item.type_action == 'DEPOSIT'", agg: first, field: datetime}
      - {name: rows, from: wl, filter: "item.channel == 'ticket_pay' && item.type_action == 'DEPOSIT'", limit: 20}
      - {name: partial_note, expr: "'นับจากหนึ่งพันรายการกระเป๋าล่าสุด'"}
    not_found: {when: "box_count == 0", message: ยูสนี้ยังไม่ได้รับรางวัลจากกล่องสุ่ม}
    card:
      style: list
      title: รางวัลกล่องสุ่มของสมาชิก
      fields:
        - {label: รางวัลรวม, value: box_sum, format: money, suffix: " บาท"}
        - {label: ได้รับ, value: box_count, format: int, suffix: " ครั้ง"}
        - {label: ล่าสุด, value: last_at, format: datetime}
        - {label: หมายเหตุ, value: partial_note, when: "fetched >= 1000"}
      table:
        rows: rows
        columns:
          - {label: วันที่ทำรายการ, field: datetime, format: datetime}
          - {label: ยอดเงิน, field: amount, format: money}
      note: ไม่แยกชื่อกล่อง ดูแยกกล่องได้ที่หน้าข้อมูลสมาชิก แท็บกิจกรรมกล่องสุ่ม
      link: {label: เปิดรายการสมาชิก, path: "/Member?service={service_b64}"}
    model_context:
      - {name: has_box_reward, type: bool, expr: "box_count > 0"}
      - {name: note, type: text, text: ยอดรางวัลแสดงในการ์ดแล้ว}
    follow_ups:
      - {label: "กิจกรรมของ {input.username}", ask: "ยูส {input.username} รับกิจกรรมอะไรไปบ้าง"}
      - {label: "กงล้อของ {input.username}", ask: "ยูส {input.username} หมุนกงล้อได้อะไร"}
