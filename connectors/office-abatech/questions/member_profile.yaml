    questions: [BQ-06]
    permission: member
    freshness: summary
    answer: "รายการยืนยันยอดฝากของ {input.username}"
    input:
      username: {type: string, required: true, pattern: "^[A-Za-z0-9_.@-]{2,40}$", description: ยูสเซอร์เนมของสมาชิก}
    calls:
      - id: c
        method: GET
        path: /GetComfirmStatementList/{service}
        query: {username: "{input.username}"}
        cache_ttl: 60
        timeout_ms: 20000
        schema:
          type: array
          nullable: true
          items:
            type: object
            required: [amount]
            properties:
              datetime: {type: string}
              amount: {type: number}
    values:
      - {name: confirm_count, from: c, agg: count}
      - {name: confirm_sum, from: c, agg: sum, field: amount, default: 0}
      - {name: rows, from: c, sort_by: datetime, order: desc, limit: 20}
      - {name: last_at, from: c, sort_by: datetime, order: desc, agg: first, field: datetime}
    not_found: {when: "confirm_count == 0", message: ยูสนี้ยังไม่มีรายการยืนยันยอดฝาก}
    card:
      style: list
