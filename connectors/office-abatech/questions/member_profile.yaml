      - {label: "กิจกรรมของ {input.username}", ask: "ยูส {input.username} รับกิจกรรมอะไรไปบ้าง"}
      - {label: "รายได้แนะนำของ {input.username}", ask: "ยูส {input.username} ได้ค่าแนะนำเพื่อนเท่าไหร่"}

  # GET /api/GetEventStatementList/:service?username&type=WHEEL (Event/route.go:24 · handler :257-278 · repo Event/repository.go:532-562)
  #   ⚠️ route นี้ไม่มี auth ที่ backend · อ่านอย่างเดียว · useragent ว่าง = กงล้อหลัก (agent_wheel ไม่มี) ตรงกับหน้าจอ
  #   frontend: components/History/HistoryWheelStatement.vue:126-142 (แท็บ ประวัติเกมกงล้อ) · ยอด BET = detail.bet · รางวัล = amount
  - name: member_wheel
    description: >-
      ประวัติการหมุนกงล้อของสมาชิก 1 ยูส จำนวนครั้ง ยอดที่ใช้หมุน และรางวัลที่ได้
    questions: [BQ-06]
    permission: member
    freshness: summary
    answer: "กงล้อของ {input.username}"
    input:
      username: {type: string, required: true, pattern: "^[A-Za-z0-9_.@-]{2,40}$", description: ยูสเซอร์เนมของสมาชิก}
    calls:
      - id: wh
        method: GET
        path: /GetEventStatementList/{service}
        query: {username: "{input.username}", type: WHEEL}
        cache_ttl: 60
        timeout_ms: 20000
        schema:
          type: array
          nullable: true
          items:
            type: object
            required: [amount]
            properties:
              datetime: {type: string}
              amount: {type: number}
              detail:
                type: object
                nullable: true
                properties:
                  bet: {type: number}
    values:
      - {name: spins, from: wh, agg: count}
      - {name: reward_sum, from: wh, agg: sum, field: amount, default: 0}
      - {name: bet_sum, from: wh, agg: sum, field: detail.bet, default: 0}
      - {name: last_at, from: wh, agg: first, field: datetime}
      - {name: rows, from: wh, limit: 20}
    not_found: {when: "spins == 0", message: ยูสนี้ยังไม่เคยหมุนกงล้อ}
    card:
      style: list
      title: ประวัติกงล้อของสมาชิก
      fields:
        - {label: รางวัลรวม, value: reward_sum, format: money, suffix: " บาท"}
        - {label: หมุนทั้งหมด, value: spins, format: int, suffix: " ครั้ง"}
        - {label: ยอดที่ใช้หมุนรวม, value: bet_sum, format: number}
        - {label: หมุนล่าสุด, value: last_at, format: datetime}
      table:
        rows: rows
        columns:
          - {label: เวลา, field: datetime, format: datetime}
          - {label: รางวัล, field: amount, format: money}
          - {label: ยอดที่ใช้หมุน, field: detail.bet, format: number}
      note: แสดงยี่สิบครั้งล่าสุด เฉพาะกงล้อหลักของเว็บ · ดูครบได้ที่หน้าข้อมูลสมาชิก แท็บประวัติเกมกงล้อ
      link: {label: เปิดรายการสมาชิก, path: "/Member?service={service_b64}"}
    model_context:
      - {name: has_spin, type: bool, expr: "spins > 0"}
      - {name: note, type: text, text: รางวัลและจำนวนครั้งแสดงในการ์ดแล้ว}
    follow_ups:
      - {label: "กิจกรรมของ {input.username}", ask: "ยูส {input.username} รับกิจกรรมอะไรไปบ้าง"}
      - {label: "กล่องสุ่มของ {input.username}", ask: "ยูส {input.username} ได้อะไรจากกล่องสุ่ม"}

  # GET /api/GetComfirmStatementList/:service?username (statement/route.go:56 · handler :597-616 · repo statement/repository.go:1255-1275)
  #   confirm_statement ของยูส (ไม่เรียง · ไม่จำกัด) · frontend: components/History/HistoryComfirmStatement.vue:142-150 (แท็บ ยืนยันยอดฝาก)
  #   ⚠️ แถวมี bank_number / acc_bank_number ของทั้งลูกค้าและเว็บ → ไม่ประกาศ
