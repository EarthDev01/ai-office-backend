guides:
  - id: check_member_credit
    title: เช็คเครดิตของสมาชิก
    menu: credit
    tab: เช็คเครดิต
    steps: [เปิดเมนู ระบบจัดการเครดิตสมาชิก, เลือกแท็บ เช็คเครดิต, กรอกยูสเซอร์เนมของสมาชิกแล้วกดค้นหา]
    note: การเช็คเครดิตถูกบันทึกเป็นประวัติการทำงานในชื่อพนักงานที่กด ผู้ช่วยจึงไม่เช็คเครดิตแทน
    questions: [BQ-47]
    keywords: [เช็คเครดิต, เครดิตสมาชิก, เครดิตคงเหลือ, ยอดเครดิตยูส]
  - id: return_credit
    title: คืนเครดิตให้สมาชิก
    menu: credit
    tab: คืนเครดิต
    steps: [เปิดเมนู ระบบจัดการเครดิตสมาชิก, เลือกแท็บ คืนเครดิต, กรอกยูสเซอร์เนมและยอดที่จะคืน แล้วตรวจก่อนยืนยัน]
    note: ผู้ช่วยทำรายการแทนไม่ได้ ต้องมีสิทธิ์แท็บคืนเครดิต
    questions: [BQ-48, BQ-51]
    keywords: [คืนเครดิต, เพิ่มเครดิต, เติมเครดิตมือ]
  - id: free_bonus
    title: แจกโบนัสฟรี
    menu: credit
    tab: แจกโบนัสฟรี
