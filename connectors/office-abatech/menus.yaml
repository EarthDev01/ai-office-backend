    keywords: [บัญชีรอตรวจ, รออนุมัติบัญชี, บัญชีสมาชิกรอตรวจสอบ, บัญชีซ้ำ]
    description: บัญชีธนาคารของสมาชิกที่ยังรอตรวจสอบ แยกตามผลการตรวจ
  - id: credit
    name: ระบบจัดการเครดิตสมาชิก
    path: /Credit
    group: ระบบสมาชิก
    permission: menu_p008
    keywords: [เครดิต, เช็คเครดิต, คืนเครดิต, ลบเครดิต, โบนัสฟรี, เทิร์น, แต้ม, ตั๋ว, แนะนำเพื่อน]
    description: เช็คเครดิต คืนหรือลบเครดิต แจกโบนัสฟรี แก้ไขเทิร์น แจกแต้ม แจกตั๋ว และแจกยอดแนะนำเพื่อน
