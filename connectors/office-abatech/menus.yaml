guides:
  - id: find_menu
    title: หาเมนูหรือรายงานในหลังบ้าน
    questions: [BQ-13]
    keywords: [เมนูอยู่ไหน, ดูตรงไหน, รายงานอยู่ไหน, หาเมนู]
    steps:
      - เลือกเว็บที่ต้องการจากแถบเมนูด้านซ้าย (ถ้ามีหลายเว็บ)
      - เมนูแบ่งเป็นกลุ่ม รายงาน · รายการ ฝาก - ถอน · ระบบสมาชิก · ตั้งค่าโปรโมชั่น · บริการเสริม · ระบบติดตามลูกค้า · บัญชีธนาคาร · ตั้งค่าต่าง ๆ
      - เมนูระดับ office เช่น จัดการพนักงาน และ รายงานการทำงานของพนักงาน อยู่ในเมนูหลักด้านบนของแถบซ้าย
      - ถ้าไม่เห็นเมนู แปลว่าเมนูนั้นยังไม่เปิดในระบบนี้ หรือบัญชีของคุณยังไม่มีสิทธิ์ ให้หัวหน้าเปิดสิทธิ์ในเมนู ตั้งค่าสิทธิ์การใช้งาน
    note: เมนูกลุ่มบริการเสริมต้องมีสิทธิ์ดูเมนูนั้นด้วยจึงจะแสดง
  - id: add_credit
    title: เพิ่มเครดิตให้สมาชิก (แจกโบนัสฟรี)
    questions: [BQ-48, BQ-51]
    keywords: [เพิ่มเครดิต, เติมเครดิตให้สมาชิก, แจกโบนัส, แจกโบนัสฟรี, ให้เครดิต, ชดเชยเครดิต]
    menu: credit
    tab: แจกโบนัสฟรี
    steps:
      - เปิดเมนู ระบบจัดการเครดิตสมาชิก ในกลุ่ม ระบบสมาชิก ของเว็บที่ต้องการ
      - กดแท็บ แจกโบนัสฟรี
      - กรอก ยูสเซอร์เนม หรือ เบอร์โทรศัพท์ ของสมาชิก
      - เลือก โบนัส กิจกรรม (ถ้ามี) แล้วกำหนด วันที่เริ่ม และ ถึงวันที่
      - กรอก จำนวน ยอดเทิร์น และ ถอนได้สูงสุด (ใส่ศูนย์ในช่องถอนได้สูงสุด = ไม่จำกัด)
      - เลือก การคำนวณเทิร์นการถอน (ทำเทิร์นเครดิต หรือ ทำเทิร์นโอเวอร์) และประเภทเกม เกม หรือแคมเปญ ถ้าต้องการจำกัด
      - กรอก สาเหตุ แล้วกดปุ่ม แจกโบนัสฟรี ถ้าสมาชิกเคยได้รับแล้ว ระบบจะถามยืนยันอีกครั้ง
    fields:
      - ยูสเซอร์เนม หรือ เบอร์โทรศัพท์ (บังคับ)
      - โบนัส กิจกรรม
      - วันที่เริ่ม (บังคับ)
      - ถึงวันที่ (บังคับ)
      - จำนวน (บังคับ)
      - ยอดเทิร์น (บังคับ)
      - ถอนได้สูงสุด (บังคับ · ศูนย์ = ไม่จำกัด)
      - แบรนด์เกมที่เล่นได้ (บังคับ · เฉพาะบางธีม)
      - ประเภทเกมที่สามารถเล่นได้
      - เกมที่สามารถเล่นได้
      - การคำนวณเทิร์นการถอน
      - แคมเปญ
      - สาเหตุ (บังคับ)
    note: >-
      ผู้ช่วยทำรายการเพิ่มเครดิตแทนไม่ได้ ต้องกดเองในหน้าจอ · ต้องมีสิทธิ์แท็บแจกโบนัสฟรี
      และพนักงานระดับต่ำกว่าเกณฑ์จะกรอกช่องจำนวน ยอดเทิร์น และถอนได้สูงสุดไม่ได้ · ถ้าต้องการคืนเครดิตที่หายไป ใช้แท็บ คืนเครดิต แทน
  - id: credit_tabs
    title: จัดการเทิร์น โบนัส แต้ม ตั๋ว ทำตรงไหน
    questions: [BQ-49]
    keywords: [จัดการเทิร์น, แก้เทิร์น, แจกแต้ม, แจกตั๋ว, คืนเครดิต, ลบเครดิต, เช็คเครดิต, แท็บเครดิต]
    menu: credit
    steps:
      - เปิดเมนู ระบบจัดการเครดิตสมาชิก ในกลุ่ม ระบบสมาชิก
      - แท็บที่มี เช็คเครดิต · เช็คเครดิต กระเป๋าเงินสด · คืนเครดิต · คืนเครดิตกระเป๋าเงินสด · ลบเครดิต · ลบเครดิตกระเป๋าเงินสด
      - แจกโบนัสฟรี · แก้ไขเทิร์น · แจกแต้ม · แจกตั๋ว · แจกยอดแนะนำเพื่อน
      - แต่ละแท็บแสดงเฉพาะเมื่อบัญชีของคุณมีสิทธิ์ของแท็บนั้น ถ้าไม่เห็นแท็บให้หัวหน้าเปิดสิทธิ์ในเมนู ตั้งค่าสิทธิ์การใช้งาน
    note: หน้านี้ไม่มีแท็บกล่องสุ่ม กล่องสุ่มเป็นเมนูแยกในกลุ่มบริการเสริม
  - id: topup_system_credit
    title: เติมเครดิตระบบ (Agent Credit)
    questions: [BQ-45]
    keywords: [เติมเครดิตระบบ, เติม agent, credit agent, เครดิตระบบหมด]
    steps:
      - ดูยอดล่าสุดได้ที่ Agent Credit บนแถบด้านบนของหลังบ้าน และกดรีเฟรชยอดได้ที่แถบเดียวกัน
      - หลังบ้านนี้ไม่มีเมนูเติมเครดิตระบบ ให้แจ้งทีม support เพื่อเติมเครดิต
    note: ถ้าเครดิตระบบหมด ระบบจะทำรายการฝากถอนไม่ได้ ควรแจ้งเติมก่อนยอดหมด
