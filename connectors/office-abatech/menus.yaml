# ที่มา: office-abatech plugins/menulist.js (เมนูต่อเว็บ · group จาก plugins/menugrouplist.js) · plugins/menumain.js (เมนูระดับ office "ตั้งค่าอื่น ๆ")
#        แท็บจาก buttonMenu ของ pages/Deposit · Withdraw · Credit · Statement (text + code) · บิล/เครดิตบนแถบบน จาก SideBar.vue / TopNavbar.vue
# ⚠️ path จริงต้องต่อ ?service=<base64>&web=<ชื่อเว็บ> (SideBar.vue:54-59) — ลิงก์บนการ์ดใส่ ?service={service_b64} ให้แล้ว
# ⚠️ เมนูที่ deployment ปิดไว้ (GET /GetConfigByKey?key=submenu) ไม่ได้ mirror ที่นี่ — lookup_menu อาจแนะนำเมนูที่เว็บนั้นปิดอยู่
menus:
  - id: dashboardonce
    name: รายงานภาพรวม
    path: /DashboardOnce
    group: รายงาน
    permission: dashboard
    keywords: [ภาพรวม, dashboard, แดชบอร์ด, ยอดวันนี้, ยอดฝากวันนี้, ยอดถอนวันนี้, กำไร]
    description: ยอดฝาก ยอดถอน โบนัส จำนวนสมาชิกที่ฝาก/ถอน แยกรายวันตามช่วงที่เลือก
  - id: deposit
    name: รายการฝาก
    path: /Deposit
    group: รายการ ฝาก - ถอน
    permission: menu_p003
    keywords: [ฝาก, รายการฝาก, ตกค้าง, สรุปยอดฝาก, บัญชีฝาก, รอคิว]
    description: สรุปยอดเงินในบัญชีฝาก รายการตกค้างรอยืนยัน และรายการฝากทั้งหมดของเว็บ
    tabs:
      - {name: สรุปยอดเงินในบัญชีฝาก, permission: deposit_summary}
      - {name: รายการตกค้าง, permission: deposit_remain}
      - {name: รายการโยกเงินออกจากบัญชีฝาก, permission: deposit_move}
      - {name: แสดงรายการฝาก, permission: deposit_list}
      - {name: แสดงรายการโยกเงิน, permission: deposit_list}
      - {name: รายการเคลือนไหว, permission: deposit_movement}
      - {name: รายการสร้างฝากทศนิยม, permission: deposit_float}
      - {name: รายการฝากกระเป๋า, permission: deposit_bag}
      - {name: รายการฝาก QRCODE, permission: deposit_qr}
      - {name: รายการฝาก PEER2PAY, permission: deposit_qr}
  - id: withdraw
    name: รายการถอน
    path: /Withdraw
    group: รายการ ฝาก - ถอน
    permission: menu_p004
    keywords: [ถอน, รายการถอน, ถอนค้าง, รอโอน, บัญชีถอน]
    description: สรุปยอดเงินในบัญชีถอน และรายการถอนทั้งหมดของเว็บ เปลี่ยนสถานะรายการได้ตามสิทธิ์
    tabs:
      - {name: สรุปยอดเงินในบัญชีถอน, permission: withdraw_bank}
      - {name: รายการเพิ่มทุนบัญชีถอน, permission: withdraw_capital}
      - {name: แสดงรายการถอน, permission: withdraw_list}
      - {name: แสดงรายการโยกเงิน, permission: withdraw_transfer}
      - {name: KPI รายการถอน, permission: withdraw_kpi}
  - id: member
    name: รายการสมาชิก
    path: /Member
    group: ระบบสมาชิก
    permission: member
    keywords: [สมาชิก, ยูส, สมาชิกใหม่, สมาชิกทั้งหมด, ค้นหาสมาชิก]
    description: จำนวนสมาชิกทั้งหมด สมาชิกใหม่วันนี้ และค้นหาข้อมูลสมาชิก
